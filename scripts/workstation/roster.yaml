# THE single source of truth for the devvm Workstation lifecycle (onboard -> offboard).
# Consumed by roster_engine.py (derive/validate) + t3-provision-users.sh (apply).
#
# os_user (the map KEY, pinned) -> authentik_user . k8s_user . tier . namespaces
# The three identifiers differ per person (verified 2026-06-08) -- no email->username
# derivation; record each explicitly.
#
# Tiers: admin | power-user | namespace-owner
#   admin           - cluster-admin, unlocked tree, secrets (groups: sudo,docker,code-shared)
#   power-user      - cluster-wide READ (no Secrets) via oidc-power-user-readonly; locked clone
#   namespace-owner - admin in their own namespace(s) only; locked clone
#
# Optional per-user code layout (non-admins):
#   code_layout: single (default) - ~/code IS the locked infra clone
#   code_layout: workspace        - ~/code is a directory of per-project clones:
#                                   the locked infra clone at ~/code/infra, plus
#                                   each `repos` entry cloned from Forgejo
#                                   viktor/<name> with the user's own PAT.
#                                   A single-layout ~/code is auto-migrated.
#
# Optional per-user parking (all tiers):
#   parked: false (default) - normal: all per-user daemons run
#   parked: true            - the account and everything on disk STAY, but none
#                             of the per-user daemons run: t3-serve@,
#                             playwright-mcp@, playwright-snapshot-refresh@ and
#                             claude-auth-sync@ (parked implies claude_auth:
#                             false). For someone who has an account here but is
#                             not using the box. The provisioner DISABLES these
#                             rather than skipping them, so an already-running
#                             instance actually stops. Fully reversible: set back
#                             to false and the next reconcile restores all of it.
#
# Optional per-user Claude auth (all tiers):
#   claude_auth: true (default) - enable claude-auth-sync@<user>.timer, which
#                                 validates the user's own Claude credential
#                                 every ~6h and backs it up to their Vault path
#   claude_auth: false          - do NOT run that timer for this user. Use when
#                                 someone has an account here but does not use
#                                 Claude on this box: the timer would validate a
#                                 credential that was never created, fail every
#                                 run, and raise WorkstationClaudeAuthInvalid
#                                 forever with nothing to fix. Reversible — the
#                                 provisioner disables the timer while false and
#                                 re-enables it when set back to true.
#
# wizard IS listed (as admin): the reconcile REGENERATES /etc/ttyd-user-map +
# dispatch.json from this file, so omitting him would drop his t3 instance. The
# provisioner skips account/group/clone mutations for already-existing users, so
# listing him is safe (he keeps his unlocked tree + cluster-admin untouched).
#
# ONE THING ONBOARDING NEEDS THAT IS NOT IN THIS FILE (2026-08-17): the web
# terminal's per-user sudo grant, terminal-lobby's devvm/sudoers.d-ttyd-users,
# is hand-maintained there by decision — this file says who exists, that file
# says which binaries may run as them. A user added here reaches the lobby and
# sees their sidebar, but every terminal attach fails until that file gains their
# line and terminal-lobby is deployed. The identity map itself is generated from
# here and from nowhere else: terminal-lobby carried a second copy until
# 2026-08-17, which its deploy installed over the generated one.
users:
  wizard:    {authentik_user: vbarzin,     k8s_user: wizard, tier: admin}                                          # base config author + cluster-admin
  emo:       {authentik_user: emil.barzin, k8s_user: emo,    tier: power-user}                                     # NET-NEW k8s_users entry (add as power-user before provisioning)
  ancamilea: {authentik_user: ancaelena98, k8s_user: anca,   tier: namespace-owner, namespaces: [plotting-book], code_layout: workspace, repos: [tripit], parked: true}  # ALREADY provisioned in-cluster -- assert, don't re-create
  #  parked: true (2026-08-16, Viktor: "park it") -- Anca has an account here but
  #  is not using the devvm and is not expected to soon. She never completed the
  #  one-time Claude SSO, so claude-auth-sync had nothing to validate or restore
  #  and failed every ~6h since 2026-08-10, alerting with nothing anyone could
  #  fix; meanwhile t3-serve and the playwright MCP browser sat running for an
  #  account nobody was using. `parked` implies claude_auth: false, so that flag
  #  is not repeated here. NOTHING is removed -- account, both workspace clones,
  #  sticky T3 port, scoped Vault token + policy all stay -- so setting parked
  #  back to false brings the whole set back on the next hourly reconcile.
# gheorghe:  {authentik_user: vabbit81,    k8s_user: vabbit81, tier: namespace-owner, namespaces: [vabbit81]}      # already a cluster ns-owner; uncomment to give him a devvm workstation
