  #  REMOVED 2026-08-17 (Viktor: "remove anca from t3 users") -- the reversible
  #  cut from docs/runbooks/offboard-user.md part A1, one step past the parking of
  #  2026-08-16. She had an account here, never used it, and never completed the
  #  one-time Claude SSO. Her line is left COMMENTED rather than deleted so
  #  bringing her back is one edit; the reconcile treats commented and absent
  #  identically.
  #
  #  What this removal does, automatically, on the next reconcile: drops her from
