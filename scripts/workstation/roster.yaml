# The devvm Workstation POLICY TABLE, keyed by user.
#
# WHO has access is decided in Authentik's `T3 Users` group (2026-08-17), not here:
# .woodpecker/t3-membership-sync.yml reconciles the rows below to match that group
# every 15 minutes — adding a floor-tier row (namespace-owner) for a new member and
# commenting out the row of anyone who left. So a row for someone outside the group
# is inert, and DELETING a row does not remove access: it resets that person to the
# floor and the sync writes the row back. Remove access by removing them from the
# group.
#
# What lives here is everything a group membership cannot say — tier, namespaces,
# k8s_user, code layout, repos, parked — because `tier` is a privilege grant that is
# reviewed in a diff and cross-checked against Vault k8s_users.
# Consumed by roster_engine.py (derive/validate) + t3-provision-users.sh (apply).
#
# os_user (the map KEY, pinned) -> authentik_user . k8s_user . tier . namespaces
# The three identifiers differ per person (verified 2026-06-08) -- no email->username
# derivation; record each explicitly.
#
# Tiers: admin | power-user | namespace-owner
#   admin           - cluster-admin, unlocked tree, secrets (groups: sudo,docker,code-shared)
#   power-user      - cluster-wide READ (no Secrets) via oidc-power-user-readonly; locked clone
#   namespace-owner - admin in their own namespace(s) only; locked clone
#
# Optional per-user code layout (non-admins):
#   code_layout: single (default) - ~/code IS the locked infra clone
#   code_layout: workspace        - ~/code is a directory of per-project clones:
#                                   the locked infra clone at ~/code/infra, plus
#                                   each `repos` entry cloned from Forgejo
#                                   with the user's own PAT: `name` is
#                                   viktor/<name>, `owner/name` is that repo,
#                                   and either clones to ~/code/<name>.
#                                   A single-layout ~/code is auto-migrated.
#
# Optional per-user agent instructions (all tiers):
#   agents_repo: owner/name - the user's own PRIVATE Forgejo repo whose master
#                             holds their AGENTS.md. The provisioner installs it
#                             read-only as ~/.agents/AGENTS.md within the hour of
#                             a push. List it in `repos` too, so the user has a
#                             clone to edit it in. No agents_repo: the provisioner
#                             leaves ~/.agents alone (wizard's comes from chezmoi).
#
# Optional per-user parking (all tiers):
#   parked: false (default) - normal: all per-user daemons run
#   parked: true            - the account and everything on disk STAY, but none
#                             of the per-user daemons run: t3-serve@,
#                             playwright-mcp@, playwright-snapshot-refresh@ and
#                             claude-auth-sync@ (parked implies claude_auth:
#                             false). For someone who has an account here but is
#                             not using the box. The provisioner DISABLES these
#                             rather than skipping them, so an already-running
#                             instance actually stops. Fully reversible: set back
#                             to false and the next reconcile restores all of it.
#
# Optional per-user Claude auth (all tiers):
#   claude_auth: true (default) - enable claude-auth-sync@<user>.timer, which
#                                 validates the user's own Claude credential
#                                 every ~6h and backs it up to their Vault path
#   claude_auth: false          - do NOT run that timer for this user. Use when
#                                 someone has an account here but does not use
#                                 Claude on this box: the timer would validate a
#                                 credential that was never created, fail every
#                                 run, and raise WorkstationClaudeAuthInvalid
#                                 forever with nothing to fix. Reversible — the
#                                 provisioner disables the timer while false and
#                                 re-enables it when set back to true.
#
# Optional per-user T3 host (all tiers, 2026-11-01):
#   t3_port: 3773-3779 - pins the port of the user's t3-serve@ instance. Without
#                        it the provisioner picks the next free port and keeps it.
#   t3_host: <label>   - the user's T3 host, <label>.viktorbarzin.me: t3 for
#                        wizard, t3-<os_user> for everyone else. Needs t3_port.
#                        stacks/t3code builds the host (web via t3-dispatch,
#                        native apps straight to t3_port) and stacks/authentik
#                        admits only this row's authentik_user to it, both for
#                        rows that have the two fields. t3-dispatch serves the
#                        host only to its owner.
#   CI applies only the stacks whose own files changed, so a roster edit does
#   not reach the cluster by itself. After adding or changing these two fields:
#   add {"users": ["<authentik login>"]} for the host to
#   stacks/authentik/forward-auth-apps.json, then apply stacks/t3code and
#   stacks/authentik (homelab tf apply <stack>).
#
# wizard IS listed (as admin): the reconcile REGENERATES /etc/ttyd-user-map +
# dispatch.json from this file, so omitting him would drop his t3 instance. The
# provisioner skips account/group/clone mutations for already-existing users, so
# listing him is safe (he keeps his unlocked tree + cluster-admin untouched).
#
# ONE THING ONBOARDING NEEDS THAT IS NOT IN THIS FILE (2026-08-17): the web
# terminal's per-user sudo grant, terminal-lobby's devvm/sudoers.d-ttyd-users,
# is hand-maintained there by decision — this file says who exists, that file
# says which binaries may run as them. A user added here reaches the lobby and
# sees their sidebar, but every terminal attach fails until that file gains their
# line and terminal-lobby is deployed. The identity map itself is generated from
# here and from nowhere else: terminal-lobby carried a second copy until
# 2026-08-17, which its deploy installed over the generated one.
users:
  wizard:    {authentik_user: vbarzin,     k8s_user: wizard, tier: admin, t3_port: 3773, t3_host: t3}                                          # base config author + cluster-admin
  emo:       {authentik_user: emil.barzin, k8s_user: emo,    tier: power-user, code_layout: workspace, repos: [tv, ebarzin/agents, app-kit], agents_repo: ebarzin/agents, t3_port: 3774, t3_host: t3-emo}  # NET-NEW k8s_users entry (add as power-user before provisioning)
  #  tv (then f1-stream) added 2026-10-18 (Viktor: emo maintains it with him); the
  #  entry follows the 2026-11-01 rename to viktor/tv. He is an admin collaborator
  #  on Forgejo viktor/tv, granted through the API like his infra write access; the
  #  repo has no branch protection, so he pushes to master.
  #  ebarzin/agents added 2026-11-03, when the ~/code monorepo was dissolved: his
  #  AGENTS.md moved from its docs/agents/users/emo/ to this private repo, which
  #  he owns (Forgejo login ebarzin) and viktor is a collaborator on.
  #  app-kit added 2026-11-11 (Viktor: emo builds new apps on the default
  #  stack), so the org policy's ~/code/app-kit/docs/stack.md exists for him.
