# Promtail config for the devvm (10.0.10.10) — ships the systemd journal to cluster Loki.
#
# devvm is a standalone VM (NOT a k8s node), so its journal — including the t3
# stack (t3-dispatch, t3-serve@<user>) — was never in Loki. Added 2026-06-11 for
# t3 drop forensics: t3-dispatch now logs each /ws connection's open/close with
# duration + which side hung up (downstream_closed = client/CF/Traefik went away;
# upstream_closed = t3-serve closed/stalled; graceful = clean close). Joined with
# Traefik's per-/ws duration (already in Loki) this attributes every drop to a layer.
#
# NOT Terraform-managed (devvm is outside k8s) — same hand-deployed pattern as
# scripts/pve-promtail.* and the rpi-sofia promtail. This file is source-of-truth.
#
# Deploy (on devvm, as root via sudo):
#   sudo install -d -m 0755 /etc/promtail /var/lib/promtail
#   sudo install -m 0644 scripts/devvm-promtail.yaml    /etc/promtail/config.yml
#   sudo install -m 0644 scripts/devvm-promtail.service /etc/systemd/system/promtail.service
#   # Binary: grafana/loki v3.5.1 promtail-linux-amd64 -> /usr/local/bin/promtail (chmod 0755).
#   sudo systemctl daemon-reload && sudo systemctl enable --now promtail
#   # Loki reach: loki.viktorbarzin.lan (Technitium CNAME -> live Traefik LB; insecure cert).
#
# Streams produced:
#   {job="devvm-journal"}                     — full devvm journal
#   {job="devvm-journal", unit="t3-dispatch.service"}        — dispatch (ws open/close lines)
#   {job="devvm-journal", unit="t3-serve@wizard.service"}    — per-user t3 serve
#   {job="sshd-devvm"}                        — sshd auth lines (parity with sshd-pve)
#   {job="agent-api-trace"}                   — agent-api's request trace (JSONL, see below)
server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /var/lib/promtail/positions.yaml

clients:
  - url: https://loki.viktorbarzin.lan/loki/api/v1/push
    tls_config:
      insecure_skip_verify: true

scrape_configs:
  - job_name: journal
    journal:
      max_age: 12h
      json: false
      # path deliberately UNSET (2026-07-09): empty = sd_journal default open,
      # which follows BOTH /run/log/journal and /var/log/journal. A hardcoded
      # /var/log/journal silently shipped NOTHING from 2026-06-30 12:28 (the
      # code-oflt Storage=volatile drop-in moved the live journal to /run) until
      # 2026-07-09 — no errors anywhere; found only because the t3-watchdog
      # live-fire drill's alert never arrived. Dead-man alert: DevvmJournalSilent.
      labels:
        host: devvm
        job: devvm-journal
    relabel_configs:
      - source_labels: ['__journal__systemd_unit']
        target_label: unit
      # identifier ONLY for the allowlisted tags that Loki rules/forensics key on.
      # The old unconditional identifier + level labels made stream cardinality
      # identifier x level x unit — a busy dev box explodes that past Loki's
      # GLOBAL 5000-active-stream cap (shared single anonymous tenant), and Loki
      # then 429-rejects NEW streams for everyone ("maximum active stream limit
      # exceeded", seen 2026-07-09 during the 12h replay; also the likely source
      # of the historic 1M ingester_error drops). level is dropped entirely —
      # nothing queries it; grep the line text instead.
      - source_labels: ['__journal_syslog_identifier']
        # tl-session-watch added 2026-09-01: the session-loss rules in
        # stacks/monitoring/.../loki.tf select on identifier="tl-session-watch",
        # so without it here they match nothing and stay silent about it.
        # One identifier, so one or two extra streams against the global cap.
        regex: '(t3-.*|claude-auth-sync|sshd.*|sudo|kernel|earlyoom|promtail|tl-session-watch)'
        target_label: identifier
      # sshd auth lines -> job=sshd-devvm (parity with the pve shipper's sshd-pve).
      - source_labels: ['__journal_syslog_identifier']
        regex: 'sshd.*'
        target_label: job
        replacement: 'sshd-devvm'

  # agent-api's request trace. Every call a machine caller (Muse first) makes
  # to Terminal Lobby's machine-facing API is appended here as one JSON object
  # per line; the design is docs/plans/2026-09-14-muse-agent-broker-design.md.
  # Shipping it to Loki is what gives it cluster-wide search, 30 days of
  # history and a life beyond a rebuilt devvm. The local copy is bounded by
  # /etc/logrotate.d/agent-api, declared in playbooks/devvm.yml.
  #
  # LABELS ARE job AND host, DELIBERATELY, plus the `filename` promtail adds
  # for every file target — one path, so one stream. Every interesting field
  # in this file is unbounded — trace_id, task_id and conversation_id are
  # per-request ULIDs/UUIDs — so promoting any of them to a label mints a Loki
  # stream per request. The journal job above carries the note: this tenant
  # shares a GLOBAL 5000-active-stream cap, and once it is saturated Loki
  # 429-rejects NEW streams for EVERY shipper, not just the greedy one. The
  # fields stay in the line and are read at query time, which costs nothing:
  #   homelab logs query '{job="agent-api-trace"} | json | trace_id="01JB..."'
  #   homelab logs query '{job="agent-api-trace"} | json | actor="muse"' --since 24h
  #
  # File job, not journal: agent-api writes the trace itself rather than
  # logging it, because the trace is a replayable record and the journal is
  # volatile on this box (Storage=volatile since 2026-06-30).
  - job_name: agent-api-trace
    static_configs:
      - targets: ['localhost']
        labels:
          host: devvm
          job: agent-api-trace
          __path__: /var/log/agent-api/trace.jsonl
    pipeline_stages:
      # The only reason to parse the JSON here is to take the event's OWN
      # timestamp instead of the moment promtail read the line, so a replay
      # by trace_id comes back in the order the run happened. Nothing is
      # promoted to a label — see above.
      - json:
          expressions:
            ts: ts
      - timestamp:
          source: ts
          format: RFC3339Nano
          # Keyed to the `ts` field in the design doc. If agent-api ever
          # renames it or writes a different format, `fudge` keeps shipping
          # (last good timestamp + 1ns) rather than dropping lines, and
          # promtail logs the parse failure. Silent loss is the worse trade.
          action_on_failure: fudge
