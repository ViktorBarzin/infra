# Minimal iOS app used to prove the sideload path end to end: free-team
# signing, devicectl install, and launch on the rig phone. It is not a sample
# to copy from, it exists so `ios-rig install` has something to verify against.
name: RigTest
options:
  bundleIdPrefix: me.viktorbarzin
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  RigTest:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.viktorbarzin.rigtest
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
