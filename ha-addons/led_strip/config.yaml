name: LED strip
version: "1.7.0"
slug: led_strip
description: >-
  Plays light patterns on the WS2812 strip wired to GPIO10 (SPI) and lets
  Home Assistant control it over HTTP (light.livia).
image: ghcr.io/viktorbarzin/ha-addon-led-strip
url: https://forgejo.viktorbarzin.me/viktor/infra/src/branch/master/ha-addons/led_strip
arch:
  - aarch64
init: false
boot: auto
startup: application
devicetree: true
audio: true
devices:
  - /dev/spidev0.0
  - /dev/gpiomem
watchdog: tcp://[HOST]:[PORT:8099]
options:
  led_count: 150
  music_delay_ms: 0
schema:
  led_count: "int(1,1000)"
  music_delay_ms: "int(0,2000)"
