name: LED strip
version: "1.0.2"
slug: led_strip
description: >-
  Runs strandtest.py on the WS2812 strip wired to GPIO10 (SPI) and lets
  Home Assistant control it over HTTP (light.livia).
url: https://forgejo.viktorbarzin.me/viktor/infra/src/branch/master/ha-addons/led_strip
arch:
  - aarch64
init: false
boot: auto
startup: application
devicetree: true
devices:
  - /dev/spidev0.0
  - /dev/gpiomem
watchdog: tcp://[HOST]:[PORT:8099]
