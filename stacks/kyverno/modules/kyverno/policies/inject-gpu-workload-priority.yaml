apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: inject-gpu-workload-priority
  annotations:
    policies.kyverno.io/title: Inject GPU Workload Priority
    policies.kyverno.io/description: "Pods requesting nvidia.com/gpu get the gpu-workload PriorityClass (1,200,000)."
spec:
  failurePolicy: Ignore
  # No pod-controller variants. MutatingPolicy autogen is on by default for
  # pod policies, and it does not rewrite JSONPatch paths, so a variant would
  # write /spec/... onto the Deployment itself (seen with kyverno-cli 1.19.1).
  autogen:
    podControllers:
      controllers: []
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: ${gpu_exclude}
  matchConditions:
    - name: requests-a-gpu
      expression: >-
        object.spec.containers.exists(c,
          'nvidia.com/gpu' in c.?resources.?requests.orValue({}) ||
          'nvidia.com/gpu' in c.?resources.?limits.orValue({}))
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          [
            JSONPatch{op: 'add', path: '/spec/priorityClassName', value: 'gpu-workload'},
            JSONPatch{op: 'add', path: '/spec/priority', value: 1200000},
            JSONPatch{op: 'add', path: '/spec/preemptionPolicy', value: 'PreemptLowerPriority'}
          ]
