apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: crowdsec-agent-idempotent-register
  annotations:
    policies.kyverno.io/title: CrowdSec Agent Idempotent LAPI Registration
    policies.kyverno.io/description: "Replaces the crowdsec-agent wait-for-lapi-and-register init command with a variant that skips `cscli lapi register` when /tmp_config/local_api_credentials.yaml already exists (pod restart after a node reboot). The upstream chart re-registers unconditionally and LAPI 403s 'user already exist', wedging the agent."
spec:
  failurePolicy: Ignore
  # No pod-controller variants. MutatingPolicy autogen is on by default for
  # pod policies, and it does not rewrite JSONPatch paths, so a variant would
  # write /spec/... onto the Deployment itself (seen with kyverno-cli 1.19.1).
  autogen:
    podControllers:
      controllers: []
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: crowdsec
    objectSelector:
      matchLabels:
        k8s-app: crowdsec
        type: agent
  matchConditions:
    - name: has-register-init-container
      expression: "object.spec.?initContainers.orValue([]).exists(i, i.name == 'wait-for-lapi-and-register')"
  mutations:
    # command is an atomic list, so an ApplyConfiguration cannot replace it.
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          object.spec.initContainers.filter(i, i.name == 'wait-for-lapi-and-register').map(i,
            JSONPatch{
              op: 'replace',
              path: '/spec/initContainers/' + string(object.spec.initContainers.indexOf(i)) + '/command',
              value: ${command}
            })
