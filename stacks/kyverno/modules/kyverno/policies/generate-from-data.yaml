apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: ${name}
  annotations:
    policies.kyverno.io/title: "${title}"
spec:
  evaluation:
    generateExisting:
      enabled: true
    synchronize:
      enabled: true
    # Deleting this policy leaves the generated objects in place, so a future
    # policy migration does not strip them from every namespace.
    orphanDownstreamOnPolicyDelete:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [namespaces]
    objectSelector:
      matchExpressions: ${selector}
  matchConditions:
    - name: target-namespace
      expression: '${condition}'
  generate:
    - template:
        interpolate: cel
        value: |
          apiVersion: v1
          kind: ${kind}
          metadata:
            name: ${object_name}
            namespace: (( object.metadata.name ))
          spec: ${spec}
