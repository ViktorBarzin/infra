apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: ${name}
spec:
  evaluation:
    generateExisting:
      enabled: true
    synchronize:
      enabled: true
    # Deleting this policy leaves the copies in place, so a future policy
    # migration does not strip pull secrets and certificates from every
    # namespace.
    orphanDownstreamOnPolicyDelete:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [namespaces]
  matchConditions:
    - name: target-namespace
      expression: '${condition}'
  variables:
    - name: source
      expression: resource.Get("v1", "secrets", "kyverno", "${secret}")
  generate:
    - expression: generator.Apply(object.metadata.name, [variables.source])
