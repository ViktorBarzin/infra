# Infrastructure devices for the phpIPAM inventory (ADR-0032, "Devices").
#
# phpipam-import creates or updates one phpIPAM Device per entry, keyed by
# `name`, and links the listed addresses (and any address whose row carries one
# of the listed MACs) to it. Vendor, model and OS left out here are filled from
# Proxmox, Kubernetes or Home Assistant when one of them knows the device.
# Devices created in the phpIPAM UI and not listed here are left alone.
#
# Write only what is known. A blank field is better than a guessed model.
#
# type: one of Switch, Router, Firewall, Wireless, Server, Virtual machine,
#       Storage, Power, Management, Other.

