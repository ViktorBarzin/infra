# Source from https://github.com/kubernetes-sigs/descheduler/blob/master/charts/descheduler/values.yaml

# Default values for descheduler.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# CronJob or Deployment
kind: CronJob

image:
  repository: registry.k8s.io/descheduler/descheduler
  # Overrides the image tag whose default is the chart version
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets:
#   - name: container-registry-secret

resources:
  requests:
    cpu: 500m
    memory: 256Mi
  limits:
    memory: 256Mi

ports:
  - containerPort: 10258
    protocol: TCP

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  privileged: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

# podSecurityContext -- [Security context for pod](https://kubernetes.io/docs/tasks/configure-pod-container/security-context/)
podSecurityContext:
  {}
  # fsGroup: 1000

nameOverride: ""
fullnameOverride: ""

# -- Override the deployment namespace; defaults to .Release.Namespace
namespaceOverride: ""

# labels that'll be applied to all resources
commonLabels: {}

cronJobApiVersion: "batch/v1"
schedule: "0 * * * *"  # hourly (was */5; 2026-06-12 etcd-load-reduction — fewer list/evict cycles, rebalancing isn't time-critical)
suspend: false
# startingDeadlineSeconds: 200
successfulJobsHistoryLimit: 10
# failedJobsHistoryLimit: 1
# ttlSecondsAfterFinished 600
# timeZone: Etc/UTC

# Required when running as a Deployment
deschedulingInterval: 5m

# Specifies the replica count for Deployment
# Set leaderElection if you want to use more than 1 replica
# Set affinity.podAntiAffinity rule if you want to schedule onto a node
# only if that node is in the same zone as at least one already-running descheduler
replicas: 1

# Specifies whether Leader Election resources should be created
# Required when running as a Deployment
# NOTE: Leader election can't be activated if DryRun enabled
leaderElection: {}
#  enabled: true
#  leaseDuration: 15s
#  renewDeadline: 10s
#  retryPeriod: 2s
#  resourceLock: "leases"
#  resourceName: "descheduler"
#  resourceNamespace: "kube-system"

command:
  - "/bin/descheduler"

cmdOptions:
  v: 3

# Recommended to use the latest Policy API version supported by the Descheduler app version
deschedulerPolicyAPIVersion: "descheduler/v1alpha2"

# deschedulerPolicy contains the policies the descheduler will execute.
# To use policies stored in an existing configMap use:
# NOTE: The name of the cm should comply to {{ template "descheduler.fullname" . }}
# deschedulerPolicy: {}
deschedulerPolicy:
  # nodeSelector: "key1=value1,key2=value2"
  # maxNoOfPodsToEvictPerNode: 10
  maxNoOfPodsToEvictTotal: 10
  # maxNoOfPodsToEvictPerNamespace: 10
  # ignorePvcPods: true
  # evictLocalStoragePods: true
  # evictDaemonSetPods: true
  # tracing:
  #   collectorEndpoint: otel-collector.observability.svc.cluster.local:4317
  #   transportCert: ""
  #   serviceName: ""
  #   serviceNamespace: ""
  #   sampleRate: 1.0
  #   fallbackToNoOpProviderOnError: true

  metricsCollector:
    enabled: true
  profiles:
    - name: default
      pluginConfig:
        - name: DefaultEvictor
          args:
            ignorePvcPods: true
            evictLocalStoragePods: true
        - name: RemoveDuplicates
        - name: RemovePodsHavingTooManyRestarts
          args:
            podRestartThreshold: 2
            includingInitContainers: true
            states:
              - CrashLoopBackOff
        - name: RemovePodsViolatingNodeAffinity
          args:
            nodeAffinityType:
              - requiredDuringSchedulingIgnoredDuringExecution
        - name: RemovePodsViolatingNodeTaints
        - name: RemovePodsViolatingInterPodAntiAffinity
        - name: RemovePodsViolatingTopologySpreadConstraint
        - name: LowNodeUtilization
          args:
            evictableNamespaces:
              exclude:
                - "dbaas" # let's not meddle with the dbs
            thresholds:
              cpu: 50
              memory: 50
              # pods: 20
            targetThresholds:
              cpu: 80
              memory: 80
              # pods: 30
            metricsUtilization:
              metricsServer: true
        - name: PodLifeTime
          args:
            maxPodLifeTimeSeconds: 604800
            namespaces:
              exclude:
                - "dbaas" # let's not meddle with the dbs
                - "kube-system"
                - "calico-system"
                - "calico-apiserver"
                - "metallb-system"
                - "monitoring"
                - "authentik"
                - "wireguard" # evicting it drops every VPN tunnel and resets peer state
        - name: "RemoveFailedPods"
          args:
            reasons:
              - "CrashLoopBackOff"
              - "Error"
              - "ContainerStatusUnknown"
              - "ImagePullBackOff"
            # exitCodes:
            #   - 1
            includingInitContainers: true
            # minPodLifetimeSeconds: 0
      plugins:
        balance:
          enabled:
            - RemoveDuplicates
            - RemovePodsViolatingTopologySpreadConstraint
            - LowNodeUtilization
        deschedule:
          enabled:
            - RemovePodsHavingTooManyRestarts
            - RemovePodsViolatingNodeTaints
            - RemovePodsViolatingNodeAffinity
            - RemovePodsViolatingInterPodAntiAffinity
            - PodLifeTime
            - RemoveFailedPods
    # Bounds immich-machine-learning's onnxruntime VRAM ratchet by capping the
    # pod's lifetime at 24h (investigated 2026-09-01, see
    # docs/plans/2026-08-31-gpu-vram-admission-and-oom-observability.md).
    #
    # The four preloaded models (CLIP textual + visual, buffalo_l detection +
    # recognition) pin ~1,960 MiB and never unload — that is the intended
    # keep-smart-search-warm cost and it does not grow. The growth is OCR:
    # PP-OCRv5_mobile loads on demand and model_ttl unloads it after 600s, its
    # weights are freed, but the BFC arena keeps the workspace chunks it
    # extended, so the FLOOR ratchets while the peaks fall back:
    #   1964 fresh -> OCR 4790 -> unload 3426 -> OCR 4302 -> unload 3548
    # The peaks are large because OCR detection scales the SHORT edge to
    # maxResolution and leaves the long edge unbounded, so a 700x8464 scrolling
    # screenshot is fed whole at 5.9 Mpx against 0.7 for a normal photo. Eight
    # assets of 181,980 set the floor for the service. Reported upstream on
    # immich-app/immich#23462; no local patch is carried and maxResolution stays
    # at 736, so OCR accuracy is untouched.
    #
    # ignorePvcPods MUST be false here, unlike every other profile: immich-ml
    # mounts a PVC for its model cache, and the default true would make
    # DefaultEvictor skip it so this profile would silently do nothing. The
    # label selector and namespace confine that relaxation to this one
    # Deployment.
    #
    # The gpu-vram-watchdog (ADR-0016) already recycles this pod, but only under
    # contention. This is the unconditional floor. maxPodLifeTimeSeconds doubles
    # as the age guard: a pod restarted for any other reason is not evicted
    # again until it is 24h old. Cost is ~2m23s with no smart search or face
    # recognition, and the time of day drifts by up to an hour per eviction —
    # accepted in exchange for not maintaining a bespoke CronJob for this.
    - name: immich-ml-restart
      pluginConfig:
        - name: DefaultEvictor
          args:
            ignorePvcPods: false
            evictLocalStoragePods: true
        - name: PodLifeTime
          args:
            maxPodLifeTimeSeconds: 86400
            namespaces:
              include:
                - "immich"
            labelSelector:
              matchLabels:
                app: immich-machine-learning
      plugins:
        deschedule:
          enabled:
            - PodLifeTime
    - name: idrac-restart
      pluginConfig:
        - name: DefaultEvictor
          args:
            ignorePvcPods: true
            evictLocalStoragePods: true
        - name: PodLifeTime
          args:
            maxPodLifeTimeSeconds: 21600
            namespaces:
              include:
                - "monitoring"
            labelSelector:
              matchLabels:
                app: idrac-redfish-exporter
      plugins:
        deschedule:
          enabled:
            - PodLifeTime

priorityClassName: system-cluster-critical

nodeSelector: {}
#  foo: bar

affinity: {}
# nodeAffinity:
#   requiredDuringSchedulingIgnoredDuringExecution:
#     nodeSelectorTerms:
#     - matchExpressions:
#       - key: kubernetes.io/e2e-az-name
#         operator: In
#         values:
#         - e2e-az1
#         - e2e-az2
#  podAntiAffinity:
#    requiredDuringSchedulingIgnoredDuringExecution:
#      - labelSelector:
#          matchExpressions:
#            - key: app.kubernetes.io/name
#              operator: In
#              values:
#                - descheduler
#        topologyKey: "kubernetes.io/hostname"
topologySpreadConstraints: []
# - maxSkew: 1
#   topologyKey: kubernetes.io/hostname
#   whenUnsatisfiable: DoNotSchedule
#   labelSelector:
#     matchLabels:
#       app.kubernetes.io/name: descheduler
tolerations: []
# - key: 'management'
#   operator: 'Equal'
#   value: 'tool'
#   effect: 'NoSchedule'

rbac:
  # Specifies whether RBAC resources should be created
  create: true

serviceAccount:
  # Specifies whether a ServiceAccount should be created
  create: false
  # The name of the ServiceAccount to use.
  # If not set and create is true, a name is generated using the fullname template
  name: "descheduler-sa"
  # Specifies custom annotations for the serviceAccount
  annotations: {}

podAnnotations: {}

podLabels: {}

dnsConfig: {}

livenessProbe:
  failureThreshold: 3
  httpGet:
    path: /healthz
    port: 10258
    scheme: HTTPS
  initialDelaySeconds: 3
  periodSeconds: 10

service:
  enabled: false
  # @param service.ipFamilyPolicy [string], support SingleStack, PreferDualStack and RequireDualStack
  #
  ipFamilyPolicy: ""
  # @param service.ipFamilies [array] List of IP families (e.g. IPv4, IPv6) assigned to the service.
  # Ref: https://kubernetes.io/docs/concepts/services-networking/dual-stack/
  # E.g.
  # ipFamilies:
  #   - IPv6
  #   - IPv4
  ipFamilies: []

serviceMonitor:
  enabled: false
  # The namespace where Prometheus expects to find service monitors.
  # namespace: ""
  # Add custom labels to the ServiceMonitor resource
  additionalLabels:
    {}
    # prometheus: kube-prometheus-stack
  interval: ""
  # honorLabels: true
  insecureSkipVerify: true
  serverName: null
  metricRelabelings:
    []
    # - action: keep
    #   regex: 'descheduler_(build_info|pods_evicted)'
    #   sourceLabels: [__name__]
  relabelings:
    []
    # - sourceLabels: [__meta_kubernetes_pod_node_name]
    #   separator: ;
    #   regex: ^(.*)$
    #   targetLabel: nodename
    #   replacement: $1
    #   action: replace
