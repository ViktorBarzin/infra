server:
  enabled: true
  podAnnotations:
    reloader.stakater.com/search: "true"
  statefulSet:
    replicaCount: 1
  # NOTE: hostAliases is NOT exposed by the woodpecker Helm chart (3.5.1 and 3.7.5 verified) —
  # see main.tf null_resource.woodpecker_server_host_alias which applies the same
  # via `kubectl patch` post-helm. Pinned to the in-cluster Traefik LB
  # (10.0.20.200) so the forge-API fetch path never round-trips through
  # Cloudflare ("context deadline exceeded" was failing every Forgejo
  # pipeline trigger).
  image:
    registry: docker.io
    repository: woodpeckerci/woodpecker-server
    # Bumped 2026-05-07 from v3.13.0 → v3.14.0 to fix the
    # "could not load config from forge: context deadline exceeded"
    # issue when fetching .woodpecker.yml from Forgejo.
    # v3.14.1 since 2026-10-10: Keel had already moved the live pods to it, and
    # a helm upgrade from the old v3.14.0 here would roll them back.
    # v3.19.0 since 2026-10-12 (chart 3.7.5). The 3.17 and 3.18 migrations are
    # one-way (028-030: orgs.forge_id rewrite, duplicate log_entries deleted and
    # a UNIQUE(step_id,line) index added), so going back means restoring the
    # pre-upgrade pg_dump of the woodpecker database.
    tag: "v3.19.0"
  # Migrations run before the HTTP listener starts, and /healthz has no
  # startupProbe or initial delay: at the chart default (3 x 10s) a migration
  # longer than ~30s gets the server killed and restarted mid-migration. The
  # 3.18 log_entries migration walks ~4.5M rows here. 60 x 10s = 10 min, which
  # stays under the helm_release timeout in main.tf.
  probes:
    liveness:
      failureThreshold: 60
  extraSecretNamesForEnvFrom:
    - woodpecker-db-creds
  env:
    WOODPECKER_HOST: "https://ci.viktorbarzin.me"
    WOODPECKER_ADMIN: "${woodpecker_admins}"
    WOODPECKER_OPEN: "true"
    WOODPECKER_GITHUB: "true"
    WOODPECKER_GITHUB_URL: "https://github.com"
    WOODPECKER_GITHUB_CLIENT: "${github_client_id}"
    WOODPECKER_GITHUB_SECRET: "${github_client_secret}"
    WOODPECKER_AGENT_SECRET: "${agent_secret}"
    WOODPECKER_DATABASE_DRIVER: "postgres"
    WOODPECKER_PLUGINS_PRIVILEGED: "woodpeckerci/plugin-docker-buildx,plugins/docker"
    WOODPECKER_PLUGINS_TRUSTED_CLONE: "woodpeckerci/plugin-git,alpine"
    WOODPECKER_LOG_LEVEL: "info"
    WOODPECKER_FORGEJO: "true"
    WOODPECKER_FORGEJO_CLIENT: "${forgejo_client_id}"
    WOODPECKER_FORGEJO_SECRET: "${forgejo_client_secret}"
    WOODPECKER_FORGEJO_URL: "${forgejo_url}"
    # Default is 3s (cmd/server/flags.go @ default `--forge-timeout`).
    # Forgejo responses on this cluster spike to 1-2s under load and the
    # config-loader makes 4-6 sequential calls (.woodpecker dir, .woodpecker.yaml,
    # .woodpecker.yml, raw .woodpecker/build.yml, etc.); occasionally the cumulative
    # overhead trips the 3s deadline → "could not load config from forge: context
    # deadline exceeded" on every pipeline. 30s removes the false-positive timeouts
    # without regressing the legitimate-failure detection window meaningfully.
    WOODPECKER_FORGE_TIMEOUT: "30s"
    # Must stay below the agent's keepalive ping interval (agent.env
    # WOODPECKER_KEEPALIVE_TIME below, 10s). Unset, gRPC's server default of 5m
    # applies: an agent pinging every 10s on an otherwise quiet stream collects
    # ping strikes, the server answers GOAWAY ENHANCE_YOUR_CALM "too_many_pings"
    # and the agent drops its Next()/lease streams. 5s leaves margin for
    # network jitter.
    WOODPECKER_KEEPALIVE_MIN_TIME: "5s"
  service:
    type: ClusterIP
    port: 80
  # Disable built-in ingress (using ingress_factory)
  ingress:
    enabled: false
  # Disable PVC (using PostgreSQL instead of SQLite)
  # Note: the correct key is persistentVolume, not persistence
  persistentVolume:
    enabled: false

agent:
  enabled: true
  podAnnotations:
    reloader.stakater.com/search: "true"
  replicaCount: 2
  image:
    registry: docker.io
    repository: woodpeckerci/woodpecker-agent
    tag: "v3.19.0"
  env:
    WOODPECKER_BACKEND: "kubernetes"
    # Chart 3.6.1 (woodpecker-ci/helm#480) made boolean defaults render, so 3.7.5
    # sets this to "true" unless overridden (3.5.1 rendered it empty, i.e. RWO).
    # Step volumes land on local-path, whose nodePathMap provisioner refuses
    # ReadWriteMany; with "true" every pipeline PVC would stay Pending.
    WOODPECKER_BACKEND_K8S_STORAGE_RWX: "false"
    WOODPECKER_BACKEND_K8S_NAMESPACE: "woodpecker"
    WOODPECKER_BACKEND_K8S_PULL_SECRET_NAMES: "registry-credentials"
    WOODPECKER_MAX_WORKFLOWS: "2"
    WOODPECKER_AGENT_SECRET: "${agent_secret}"
    # The agent pings the server every 10s regardless of this value in v3.19.0:
    # cmd/agent/core/agent.go reads the flag as "grpc-keepalive-time" while
    # flags.go registers it as "keepalive-time", so the env var never arrives
    # and gRPC raises the resulting 0 to its 10s minimum. Set to the same 10s so
    # the pairing with the server's WOODPECKER_KEEPALIVE_MIN_TIME above still
    # holds once upstream fixes the flag name. Tracked upstream in
    # https://github.com/woodpecker-ci/woodpecker/issues/7350
    WOODPECKER_KEEPALIVE_TIME: "10s"
  persistence:
    enabled: false
  rbac:
    create: true
  serviceAccount:
    create: true
    name: "woodpecker-agent"
