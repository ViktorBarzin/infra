; supervisord program definition mounted OVER neko's stock
; /etc/neko/supervisord/google-chrome.conf, so the browser keeps
; chrome-service's own launch flags inside an unmodified upstream image.
;
; Deltas from upstream's version, all deliberate:
;   --user-data-dir=/profile/chromium-data  the existing warmed profile on the
;       encrypted PVC (upstream: /home/neko/.config/google-chrome). Both sides
;       run as uid 1000, so no chown and no migration.
;   --remote-debugging-port=9223            CDP for the five callers. Stock
;       Chrome ignores --remote-debugging-address, so it binds loopback and the
;       cdp-bridge sidecar republishes it on 0.0.0.0:9222 (files/cdp_bridge.py).
;   --remote-allow-origins=*                Chrome 111+ needs this for
;       non-loopback CDP origins.
;   --disable-blink-features=AutomationControlled, --autoplay-policy,
;   --password-store=basic, --use-mock-keychain, --disable-features=IsolateOrigins,…
;       carried over verbatim — the anti-bot posture the stack exists for.
;   DROPPED --bwsi ("browse without sign-in") and --disable-file-system: both
;       work against a persistent logged-in profile, which is the whole point of
;       this browser.
;   DROPPED --force-dark-mode: no behavioural reason, and it changes what
;       screenshot-based callers see.
;   KEPT --no-sandbox (this pod already ran Chrome that way), --disable-gpu and
;       --disable-software-rasterizer (encode is software x264 on CPU),
;       --disable-dev-shm-usage.
;
; /bin/entrypoint.sh is neko's own wrapper (sources /etc/neko/chrome.d, waits
; for the X display); keep it as the command prefix.
[program:google-chrome]
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s",DISPLAY="%(ENV_DISPLAY)s"
command=/bin/entrypoint.sh /usr/bin/google-chrome
  --no-sandbox
  --window-position=0,0
  --display=%(ENV_DISPLAY)s
  --user-data-dir=/profile/chromium-data
  --remote-debugging-port=9223
  --remote-allow-origins=*
  --no-first-run
  --no-default-browser-check
  --start-maximized
  --hide-crash-restore-bubble
  --disable-blink-features=AutomationControlled
  --disable-features=IsolateOrigins,site-per-process
  --autoplay-policy=no-user-gesture-required
  --password-store=basic
  --use-mock-keychain
  --disable-gpu
  --disable-software-rasterizer
  --disable-dev-shm-usage
stopsignal=INT
autorestart=true
priority=800
user=%(ENV_USER)s
stdout_logfile=/var/log/neko/google-chrome.log
stdout_logfile_maxbytes=100MB
stdout_logfile_backups=10
redirect_stderr=true
