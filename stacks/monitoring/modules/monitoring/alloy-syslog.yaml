# Syslog listener for devices outside the cluster (the London Flint 2 today).
# One replica behind a dedicated MetalLB IP, separate from the log-shipping
# DaemonSet so a DaemonSet roll never interrupts syslog. OpenWrt logd sends
# RFC3164 over UDP. Design: docs/plans/2026-09-27-london-flint-main-router.md.
crds:
  create: false
rbac:
  create: false
controller:
  type: deployment
  replicas: 1
alloy:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 256Mi
  extraPorts:
    - name: syslog-udp
      port: 514
      targetPort: 5514
      protocol: UDP
    - name: syslog-tcp
      port: 514
      targetPort: 5514
      protocol: TCP
  configMap:
    content: |-
      logging {
        level  = "info"
        format = "logfmt"
      }
      loki.source.syslog "devices" {
        listener {
          address       = "0.0.0.0:5514"
          protocol      = "udp"
          syslog_format = "rfc3164"
          labels        = { job = "syslog", host = "flint-london" }
        }
        listener {
          address       = "0.0.0.0:5514"
          protocol      = "tcp"
          syslog_format = "rfc3164"
          labels        = { job = "syslog", host = "flint-london" }
        }
        forward_to = [loki.write.default.receiver]
      }
      loki.write "default" {
        endpoint {
          url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
        }
      }
service:
  type: LoadBalancer
  annotations:
    metallb.io/loadBalancerIPs: "10.0.20.208"
