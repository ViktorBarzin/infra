# Syslog listener for devices outside the cluster (the London Flint 2 and the
# Mladost 3 router).
# One replica behind a dedicated MetalLB IP, separate from the log-shipping
# DaemonSet so a DaemonSet roll never interrupts syslog. OpenWrt logd sends
# RFC3164 over TCP (UDP lost most lines, 2026-09-28). Design: docs/plans/2026-09-27-london-flint-main-router.md.
crds:
  create: false
rbac:
  create: false
controller:
  type: deployment
  replicas: 1
alloy:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 256Mi
  extraPorts:
    - name: syslog-udp
      port: 514
      targetPort: 5514
      protocol: UDP
    - name: syslog-tcp
      port: 514
      targetPort: 5514
      protocol: TCP
  configMap:
    content: |-
      logging {
        level  = "info"
        format = "logfmt"
      }
      loki.source.syslog "devices" {
        listener {
          address       = "0.0.0.0:5514"
          protocol      = "udp"
          syslog_format = "rfc3164"
          labels        = { job = "syslog", host = "flint-london" }
        }
        listener {
          address       = "0.0.0.0:5514"
          protocol      = "tcp"
          syslog_format = "rfc3164"
          labels        = { job = "syslog", host = "flint-london" }
        }
        forward_to    = [loki.write.default.receiver]
        relabel_rules = loki.relabel.syslog.rules
      }
      // Keep the program name and severity the listener parses out of each
      // line, which are otherwise dropped with the other __ labels: without
      // them the router's kernel and Wi-Fi lines could only be told apart from
      // ~70k DNS query lines an hour by regex. Both sets are small (a few
      // dozen programs, eight severities). Added 2026-10-03.
      loki.relabel "syslog" {
        forward_to = []
        rule {
          source_labels = ["__syslog_message_app_name"]
          target_label  = "app"
        }
        rule {
          source_labels = ["__syslog_message_severity"]
          target_label  = "level"
        }
        // The listeners stamp host="flint-london" on everything. The Mladost 3
        // router identifies itself by hostname (its source address is not
        // reliable here: the LoadBalancer may SNAT it).
        rule {
          source_labels = ["__syslog_message_hostname"]
          regex         = "openwrt-mladost3"
          target_label  = "host"
          replacement   = "mladost3"
        }
      }
      loki.write "default" {
        endpoint {
          url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
        }
      }
service:
  type: LoadBalancer
  annotations:
    metallb.io/loadBalancerIPs: "10.0.20.208"
