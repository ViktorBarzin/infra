# netsec Vector (docs/architecture/network-security-monitoring.md): receives
# what the network IDS records and writes it to the netsec database on the
# claude-sessions ClickHouse.
#
#   OPNsense syslog-ng, raw EVE JSON lines --TCP 5140--> opnsense --> eve
#   goflow2 sidecar Vector ------------vector 6000----> shippers --> flows
#   node Alloy, node-cache + tetragon lines --OTLP 4318--> otlp --> dns, tetragon
#
# Kept apart from rybbit's event-pipeline on purpose: a netsec fault or a
# NetFlow burst must not stop app analytics (plan decision 10).
#
# Unit tests at the bottom run with `vector test` (docs/runbooks/network-ids.md).

data_dir: /var/lib/vector

# Vector 0.61 does not interpolate environment variables unless started with
# --dangerously-allow-env-var-interpolation; an unresolved reference is sent as
# literal text. The writer password comes from a mounted file instead.
secret:
  k8s:
    type: directory
    path: /etc/vector/secrets

api:
  enabled: false

sources:
  # Phase 2: syslog-ng on OPNsense tails eve-meta.json and sends each line as is.
  # Bytes, not the json codec: the socket source writes its own `timestamp`
  # field, which would collide with EVE's.
  opnsense:
    type: socket
    mode: tcp
    address: 0.0.0.0:5140
    decoding:
      codec: bytes
    framing:
      method: newline_delimited
      newline_delimited:
        max_length: 1048576

  # Other Vectors forward here: the goflow2 sidecar now; later shippers set
  # netsec_kind to say which table they feed.
  shippers:
    type: vector
    address: 0.0.0.0:6000

  # Phase 4: NodeLocal DNSCache logs each external query (node-cache `log`
  # plugin, stacks/nodelocal-dns); the node's Alloy keeps the netsec-dns lines
  # out of Loki and sends them here over OTLP/HTTP. gRPC is bound because the
  # source requires both; nothing sends to it. NetworkPolicy: Alloy pods only.
  otlp:
    type: opentelemetry
    grpc:
      address: 0.0.0.0:4317
    http:
      address: 0.0.0.0:4318

  internal:
    type: internal_metrics

transforms:
  route_shippers:
    type: route
    inputs: [shippers]
    # A shipper with an unknown netsec_kind is a bug in that shipper; drop it.
    reroute_unmatched: false
    route:
      flow: '.netsec_kind == "flow"'

  # goflow2 JSON (with the in_bytes/in_packets mapping from
  # stacks/monitoring goflow2-mapping.yaml) to netsec.flows.
  flows:
    type: remap
    inputs: [route_shippers.flow]
    drop_on_abort: true
    source: |
      d = object!(parse_json!(string!(.message)))
      end_ns = int(d.time_flow_end_ns) ?? 0
      start_ns = int(d.time_flow_start_ns) ?? end_ns
      recv_ns = int(d.time_received_ns) ?? 0
      if end_ns <= 0 { end_ns = recv_ns }
      if end_ns <= 0 { abort }
      . = {
        "ts": from_unix_timestamp!(end_ns, unit: "nanoseconds"),
        "ts_start": from_unix_timestamp!(start_ns, unit: "nanoseconds"),
        "received": from_unix_timestamp!(recv_ns, unit: "nanoseconds"),
        "exporter": string(d.sampler_address) ?? "",
        "src_ip": string(d.src_addr) ?? "::",
        "dst_ip": string(d.dst_addr) ?? "::",
        "src_port": int(d.src_port) ?? 0,
        "dst_port": int(d.dst_port) ?? 0,
        "proto": string(d.proto) ?? "",
        "etype": string(d.etype) ?? "",
        "bytes": int(d.in_bytes) ?? int(d.bytes) ?? 0,
        "packets": int(d.in_packets) ?? int(d.packets) ?? 0,
        "tcp_flags": int(d.tcp_flags) ?? 0,
        "in_if": int(d.in_if) ?? 0,
        "out_if": int(d.out_if) ?? 0,
        "next_hop": string(d.next_hop) ?? "",
        "src_net": string(d.src_net) ?? "",
        "dst_net": string(d.dst_net) ?? ""
      }

  # Suricata EVE (any event type) to netsec.eve: common fields typed, the whole
  # event in payload.
  eve:
    type: remap
    inputs: [opnsense]
    drop_on_abort: true
    source: |
      e = object(parse_json(string!(.message)) ?? null) ?? {}
      if !exists(e.event_type) { abort }
      ts = parse_timestamp(string(e.timestamp) ?? "", "%Y-%m-%dT%H:%M:%S%.f%z") ?? now()
      alert = object(e.alert) ?? {}
      . = {
        "ts": ts,
        "event_type": string(e.event_type) ?? "",
        "in_iface": string(e.in_iface) ?? "",
        "src_ip": string(e.src_ip) ?? "::",
        "dest_ip": string(e.dest_ip) ?? "::",
        "src_port": int(e.src_port) ?? 0,
        "dest_port": int(e.dest_port) ?? 0,
        "proto": string(e.proto) ?? "",
        "app_proto": string(e.app_proto) ?? "",
        "flow_id": int(e.flow_id) ?? 0,
        "community_id": string(e.community_id) ?? "",
        "signature_id": int(alert.signature_id) ?? 0,
        "signature": string(alert.signature) ?? "",
        "category": string(alert.category) ?? "",
        "severity": int(alert.severity) ?? 0,
        "dns_rrname": string(e.dns.queries[0].rrname) ?? string(e.dns.rrname) ?? "",
        "tls_sni": string(e.tls.sni) ?? "",
        "http_hostname": string(e.http.hostname) ?? "",
        "payload": e
      }

  # node-cache log line: "[INFO] netsec-dns <pod ip> <qtype> <name> <rcode>".
  # The cluster.local and reverse zones never log (only the Corefile's .:53
  # block has the log plugin); the suffix check is a second guard. The log
  # plugin runs before the cache, so cache hits are rows too. Answers are not
  # in the log line; the answers column stays empty for these rows.
  dns:
    type: remap
    inputs: [otlp.logs]
    drop_on_abort: true
    source: |
      line = string(.message) ?? ""
      p = parse_regex(line, r'netsec-dns (?P<ip>\S+) (?P<qtype>\S+) (?P<name>\S+) (?P<rcode>\S+)') ?? null
      if p == null { abort }
      name = downcase(string!(p.name))
      if ends_with(name, ".cluster.local.") || ends_with(name, ".in-addr.arpa.") || ends_with(name, ".ip6.arpa.") { abort }
      ts = timestamp(.timestamp) ?? now()
      . = {
        "ts": ts,
        "client_ip": string!(p.ip),
        "qname": replace(name, r'\.$', ""),
        "qtype": string!(p.qtype),
        "rcode": string!(p.rcode),
        "answers": []
      }

  # Phase 4b: Tetragon JSON export lines (stacks/tetragon), printed by its
  # export-stdout sidecar; the node's Alloy keeps them out of Loki and sends
  # them here. Process starts (exec) and tcp_connect to internet addresses
  # (connect). Other lines on the OTLP input (node-cache) abort here.
  tetragon:
    type: remap
    inputs: [otlp.logs]
    drop_on_abort: true
    source: |
      # The body can arrive as the bare JSON line, with a leading container-log
      # prefix, or already decoded; take the object from any of them.
      e = object(.message) ?? {}
      if e == {} {
        line = string(.message) ?? ""
        start = int(find(line, "{")) ?? -1
        if start < 0 { abort }
        e = object(parse_json(slice!(line, start)) ?? null) ?? {}
      }
      kind = "exec"
      ev = object(e.process_exec) ?? null
      if ev == null {
        kind = "connect"
        ev = object(e.process_kprobe) ?? null
      }
      if ev == null { abort }
      if kind == "connect" && (string(ev.function_name) ?? "") != "tcp_connect" { abort }
      p = object(ev.process) ?? {}
      sock = object(ev.args[0].sock_arg) ?? {}
      ts = parse_timestamp(string(e.time) ?? "", "%+") ?? now()
      . = {
        "ts": ts,
        "node": string(e.node_name) ?? "",
        "event_type": kind,
        "namespace": string(p.pod.namespace) ?? "",
        "pod": string(p.pod.name) ?? "",
        "container": string(p.pod.container.name) ?? "",
        "binary": string(p.binary) ?? "",
        "arguments": string(p.arguments) ?? "",
        "parent_binary": string(ev.parent.binary) ?? "",
        "dst_ip": string(sock.daddr) ?? "::",
        "dst_port": int(sock.dport) ?? 0,
        "payload": {
          "exec_id": string(p.exec_id) ?? "",
          "parent_exec_id": string(p.parent_exec_id) ?? "",
          "pid": int(p.pid) ?? 0,
          "uid": int(p.uid) ?? 0,
          "cwd": string(p.cwd) ?? "",
          "image": string(p.pod.container.image.name) ?? "",
          "workload": string(p.pod.workload) ?? "",
          "workload_kind": string(p.pod.workload_kind) ?? "",
          "parent_arguments": string(ev.parent.arguments) ?? "",
          "policy": string(ev.policy_name) ?? "",
          "family": string(sock.family) ?? "",
          "saddr": string(sock.saddr) ?? "",
          "sport": int(sock.sport) ?? 0
        }
      }

sinks:
  flows_ch:
    type: clickhouse
    inputs: [flows]
    endpoint: http://clickhouse.claude-sessions.svc.cluster.local:8123
    database: netsec
    table: flows
    auth:
      strategy: basic
      user: netsec_writer
      password: "SECRET[k8s.netsec_writer_password]"
    date_time_best_effort: true
    skip_unknown_fields: true
    compression: gzip
    batch:
      max_events: 20000
      timeout_secs: 10
    # Memory buffers: a disk buffer held writes without the sink reading them
    # on 0.61.0 (stacks/rybbit, 2026-11-09). Full means ClickHouse is down or
    # slow; blocking pushes back on the goflow2 sidecar, which drops.
    buffer:
      type: memory
      max_events: 50000
      when_full: block

  eve_ch:
    type: clickhouse
    inputs: [eve]
    endpoint: http://clickhouse.claude-sessions.svc.cluster.local:8123
    database: netsec
    table: eve
    auth:
      strategy: basic
      user: netsec_writer
      password: "SECRET[k8s.netsec_writer_password]"
    date_time_best_effort: true
    skip_unknown_fields: true
    compression: gzip
    batch:
      max_events: 10000
      timeout_secs: 10
    # Blocking holds the TCP connection, so syslog-ng on OPNsense queues.
    buffer:
      type: memory
      max_events: 20000
      when_full: block

  dns_ch:
    type: clickhouse
    inputs: [dns]
    endpoint: http://clickhouse.claude-sessions.svc.cluster.local:8123
    database: netsec
    table: dns_queries
    auth:
      strategy: basic
      user: netsec_writer
      password: "SECRET[k8s.netsec_writer_password]"
    date_time_best_effort: true
    skip_unknown_fields: true
    compression: gzip
    batch:
      max_events: 10000
      timeout_secs: 10
    # Full drops rather than blocks: a slow ClickHouse must not back up Alloy,
    # which also ships every pod log to Loki.
    buffer:
      type: memory
      max_events: 20000
      when_full: drop_newest

  tetragon_ch:
    type: clickhouse
    inputs: [tetragon]
    endpoint: http://clickhouse.claude-sessions.svc.cluster.local:8123
    database: netsec
    table: tetragon
    auth:
      strategy: basic
      user: netsec_writer
      password: "SECRET[k8s.netsec_writer_password]"
    date_time_best_effort: true
    skip_unknown_fields: true
    compression: gzip
    batch:
      max_events: 10000
      timeout_secs: 10
    # Drops rather than blocks, like dns_ch: Alloy must not back up.
    buffer:
      type: memory
      max_events: 20000
      when_full: drop_newest

  metrics:
    type: prometheus_exporter
    inputs: [internal]
    address: 0.0.0.0:9598

tests:
  - name: goflow2 record maps to a flows row with in_bytes
    inputs:
      - insert_at: route_shippers
        type: log
        log_fields:
          netsec_kind: flow
          message: '{"type":"NETFLOW_V9","time_received_ns":1794321988919615153,"sampler_address":"10.0.20.100","time_flow_start_ns":1794321972000000000,"time_flow_end_ns":1794321975000000000,"bytes":0,"packets":0,"in_bytes":1502,"in_packets":11,"src_addr":"10.0.20.101","dst_addr":"2001:470:5a7f:20::1","etype":"IPv4","proto":"TCP","src_port":30145,"dst_port":443,"in_if":3,"out_if":5,"tcp_flags":27,"next_hop":"192.168.1.1","src_net":"10.0.20.0/24","dst_net":"0.0.0.0/0"}'
    outputs:
      - extract_from: flows
        conditions:
          - type: vrl
            source: |
              assert_eq!(.bytes, 1502)
              assert_eq!(.packets, 11)
              assert_eq!(.src_ip, "10.0.20.101")
              assert_eq!(.dst_ip, "2001:470:5a7f:20::1")
              assert_eq!(.dst_port, 443)
              assert_eq!(.proto, "TCP")
              assert_eq!(.exporter, "10.0.20.100")
              assert_eq!(to_unix_timestamp(timestamp!(.ts), unit: "milliseconds"), 1794321975000)
              assert_eq!(to_unix_timestamp(timestamp!(.ts_start), unit: "milliseconds"), 1794321972000)
              assert!(!exists(.message))
              assert!(!exists(.netsec_kind))

  - name: a record without a flow end time falls back to the receive time
    inputs:
      - insert_at: route_shippers
        type: log
        log_fields:
          netsec_kind: flow
          message: '{"time_received_ns":1794321988919615153,"time_flow_end_ns":0,"src_addr":"10.0.20.1","dst_addr":"10.0.20.2"}'
    outputs:
      - extract_from: flows
        conditions:
          - type: vrl
            source: |
              assert_eq!(to_unix_timestamp(timestamp!(.ts), unit: "milliseconds"), 1794321988919)
              assert_eq!(.bytes, 0)

  - name: Suricata alert maps typed columns and keeps the event in payload
    inputs:
      - insert_at: eve
        type: log
        log_fields:
          message: '{"timestamp":"2026-11-10T16:23:06.123456+0200","flow_id":123,"in_iface":"vtnet1","event_type":"alert","src_ip":"10.0.10.10","src_port":40000,"dest_ip":"10.0.10.1","dest_port":53,"proto":"UDP","app_proto":"dns","community_id":"1:abc","alert":{"signature_id":2054169,"signature":"ET INFO External IP Lookup Domain in DNS Lookup (icanhazip .com)","category":"Device Retrieving External IP Address Detected","severity":2},"dns":{"version":3,"type":"request","queries":[{"rrname":"icanhazip.com","rrtype":"A"}]}}'
    outputs:
      - extract_from: eve
        conditions:
          - type: vrl
            source: |
              assert_eq!(.event_type, "alert")
              assert_eq!(.signature_id, 2054169)
              assert_eq!(.severity, 2)
              assert_eq!(.in_iface, "vtnet1")
              assert_eq!(.dns_rrname, "icanhazip.com")
              assert_eq!(.src_ip, "10.0.10.10")
              assert_eq!(to_unix_timestamp(timestamp!(.ts), unit: "microseconds"), 1794320586123456)
              assert_eq!(.payload.alert.signature_id, 2054169)
              assert!(!exists(.message))

  - name: Suricata tls event fills tls_sni and leaves alert columns empty
    inputs:
      - insert_at: eve
        type: log
        log_fields:
          message: '{"timestamp":"2026-11-10T16:23:06.000001+0200","event_type":"tls","src_ip":"10.0.20.103","dest_ip":"185.199.110.133","src_port":5,"dest_port":443,"proto":"TCP","tls":{"sni":"release-assets.githubusercontent.com","ja4":"t13d"}}'
    outputs:
      - extract_from: eve
        conditions:
          - type: vrl
            source: |
              assert_eq!(.tls_sni, "release-assets.githubusercontent.com")
              assert_eq!(.signature_id, 0)
              assert_eq!(.signature, "")
              assert_eq!(.dns_rrname, "")

  - name: a line that is not EVE JSON is dropped
    inputs:
      - insert_at: eve
        type: log
        log_fields:
          message: 'not json'
    no_outputs_from: [eve]

  - name: a node-cache netsec-dns line maps to a dns_queries row
    inputs:
      - insert_at: dns
        type: vrl
        source: |
          . = {
            "message": "[INFO] netsec-dns 10.10.3.17 A Icanhazip.com. NOERROR",
            "timestamp": t'2026-11-10T16:23:06.123456Z',
            "attributes": {"namespace": "kube-system", "container": "node-cache"}
          }
    outputs:
      - extract_from: dns
        conditions:
          - type: vrl
            source: |
              assert_eq!(.client_ip, "10.10.3.17")
              assert_eq!(.qname, "icanhazip.com")
              assert_eq!(.qtype, "A")
              assert_eq!(.rcode, "NOERROR")
              assert_eq!(.answers, [])
              assert_eq!(to_unix_timestamp(timestamp!(.ts), unit: "microseconds"), 1794327786123456)
              assert!(!exists(.message))
              assert!(!exists(.attributes))

  - name: an IPv6 pod and an NXDOMAIN keep their values
    inputs:
      - insert_at: dns
        type: vrl
        source: |
          . = {"message": "[INFO] netsec-dns fd62:f088:7d06:100::5 AAAA no-such.example. NXDOMAIN", "timestamp": t'2026-11-10T16:23:06Z'}
    outputs:
      - extract_from: dns
        conditions:
          - type: vrl
            source: |
              assert_eq!(.client_ip, "fd62:f088:7d06:100::5")
              assert_eq!(.qtype, "AAAA")
              assert_eq!(.rcode, "NXDOMAIN")

  - name: other node-cache lines and cluster-internal names are dropped
    inputs:
      - insert_at: dns
        type: vrl
        source: |
          . = {"message": "[INFO] Reloading complete", "timestamp": t'2026-11-10T16:23:06Z'}
      - insert_at: dns
        type: vrl
        source: |
          . = {"message": "[INFO] netsec-dns 10.10.3.17 A clickhouse.claude-sessions.svc.cluster.local. NOERROR", "timestamp": t'2026-11-10T16:23:06Z'}
    no_outputs_from: [dns]

  - name: a tetragon exec line maps to a tetragon row
    inputs:
      - insert_at: tetragon
        type: vrl
        source: |
          . = {"message": "{\"process_exec\":{\"process\":{\"exec_id\":\"azhzOjE=\",\"pid\":4242,\"uid\":0,\"cwd\":\"/\",\"binary\":\"/usr/bin/curl\",\"arguments\":\"-s https://example.com\",\"pod\":{\"namespace\":\"matrix\",\"name\":\"tet-test\",\"container\":{\"name\":\"tet-test\",\"image\":{\"name\":\"docker.io/library/alpine:3.22\"}},\"workload\":\"tet-test\",\"workload_kind\":\"Pod\"},\"parent_exec_id\":\"azhzOjA=\"},\"parent\":{\"binary\":\"/bin/sh\",\"arguments\":\"-c curl\"}},\"node_name\":\"k8s-node1\",\"time\":\"2026-11-10T19:00:01.123456789Z\"}", "timestamp": t'2026-11-10T19:00:02Z'}
    outputs:
      - extract_from: tetragon
        conditions:
          - type: vrl
            source: |
              assert_eq!(.event_type, "exec")
              assert_eq!(.node, "k8s-node1")
              assert_eq!(.namespace, "matrix")
              assert_eq!(.pod, "tet-test")
              assert_eq!(.container, "tet-test")
              assert_eq!(.binary, "/usr/bin/curl")
              assert_eq!(.parent_binary, "/bin/sh")
              assert_eq!(.dst_ip, "::")
              assert_eq!(.dst_port, 0)
              assert_eq!(.payload.image, "docker.io/library/alpine:3.22")
              assert_eq!(.payload.pid, 4242)
              assert_eq!(to_unix_timestamp(timestamp!(.ts), unit: "microseconds"), 1794337201123456)

  - name: a tetragon tcp_connect line keeps the destination
    inputs:
      - insert_at: tetragon
        type: vrl
        source: |
          . = {"message": "{\"process_kprobe\":{\"process\":{\"binary\":\"/usr/bin/curl\",\"arguments\":\"-s https://example.com\",\"pod\":{\"namespace\":\"matrix\",\"name\":\"tet-test\",\"container\":{\"name\":\"tet-test\"}}},\"parent\":{\"binary\":\"/bin/sh\"},\"function_name\":\"tcp_connect\",\"args\":[{\"sock_arg\":{\"family\":\"AF_INET\",\"saddr\":\"10.10.108.9\",\"daddr\":\"93.184.215.14\",\"sport\":40112,\"dport\":443}}],\"policy_name\":\"netsec-external-connect\"},\"node_name\":\"k8s-node1\",\"time\":\"2026-11-10T19:00:01Z\"}"}
    outputs:
      - extract_from: tetragon
        conditions:
          - type: vrl
            source: |
              assert_eq!(.event_type, "connect")
              assert_eq!(.dst_ip, "93.184.215.14")
              assert_eq!(.dst_port, 443)
              assert_eq!(.payload.saddr, "10.10.108.9")
              assert_eq!(.payload.policy, "netsec-external-connect")

  - name: node-cache lines and other kprobes are not tetragon rows
    inputs:
      - insert_at: tetragon
        type: vrl
        source: |
          . = {"message": "[INFO] netsec-dns 10.10.3.17 A icanhazip.com. NOERROR"}
      - insert_at: tetragon
        type: vrl
        source: |
          . = {"message": "{\"process_kprobe\":{\"function_name\":\"fd_install\",\"process\":{}},\"node_name\":\"k8s-node1\"}"}
      - insert_at: tetragon
        type: vrl
        source: |
          . = {"message": "{\"process_exit\":{\"process\":{}},\"node_name\":\"k8s-node1\"}"}
    no_outputs_from: [tetragon]

  - name: a tetragon line with a container-log prefix or already decoded still maps
    inputs:
      - insert_at: tetragon
        type: vrl
        source: |
          . = {"message": "2026-11-10T19:05:57.670Z stdout F {\"process_exec\":{\"process\":{\"binary\":\"/bin/sh\",\"pod\":{\"namespace\":\"matrix\",\"name\":\"a\"}}},\"node_name\":\"k8s-node1\",\"time\":\"2026-11-10T19:05:57Z\"}"}
      - insert_at: tetragon
        type: vrl
        source: |
          . = {"message": {"process_exec": {"process": {"binary": "/bin/sh", "pod": {"namespace": "matrix", "name": "b"}}}, "node_name": "k8s-node1", "time": "2026-11-10T19:05:57Z"}}
    outputs:
      - extract_from: tetragon
        conditions:
          - type: vrl
            source: |
              assert_eq!(.binary, "/bin/sh")
              assert_eq!(.namespace, "matrix")
