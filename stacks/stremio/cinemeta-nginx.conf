# Cinemeta reverse-proxy (infra#80 follow-up) — see main.tf "cinemeta proxy" block.
#
# Re-serves Stremio's Cinemeta addon through cinemeta.viktorbarzin.me so it works
# on Viktor's Meta-managed Mac, whose endpoint firewall (uberAgent) blocks
# *.strem.io. The Stremio web client fetches catalogs/meta CLIENT-SIDE, so the
# browser must reach a non-strem.io host; this nginx (in-cluster, behind Traefik)
# fetches v3-cinemeta.strem.io itself and FOLLOWS Cinemeta's catalog 307 to
# cinemeta-catalogs.strem.io server-side, so the browser never touches strem.io.
#
# In-cluster (not a CF Worker) specifically so the host resolves BOTH ways:
# publicly via the CF `*` wildcard -> tunnel -> Traefik -> here, AND internally
# via Technitium's ingress-DNS-sync (cinemeta -> apex -> Traefik -> here). A CF
# Worker only lives at the edge, so internal clients (home LAN on Technitium) got
# NXDOMAIN — and since the account's protected com.linvo.cinemeta was removed in
# favour of this proxy, EVERY device depends on it resolving. See infra#80.
#
# Reliability (2026-10-09). Measured against the live upstream: v3-cinemeta
# answers a cold search in 0.2-22s, and 7 of 48 cold searches failed on the
# first try (520 in ~0.2s, or 504 after ~26s); every one of the 7 succeeded on
# one immediate retry. Traefik gives a backend 30s to send headers
# (serversTransport responseHeaderTimeout). So: first attempt 18s, one retry of
# up to 9s, and a local cache that serves the last good answer while strem.io
# is failing.

# Last good answers, keyed by the client's URI so a catalog stored by @follow is
# the same entry `location /` falls back to when v3-cinemeta itself is down.
proxy_cache_path /var/cache/nginx/cinemeta levels=1:2 keys_zone=cinemeta:10m
                 max_size=256m inactive=7d use_temp_path=off;

log_format cinemeta '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                    'rt=$request_time ups=$upstream_status urt=$upstream_response_time '
                    'cache=$upstream_cache_status "$http_user_agent"';

server {
  listen 8080;
  server_name _;
  access_log /var/log/nginx/access.log cinemeta;
  # In-cluster resolver = kube-dns; resolves the external strem.io upstreams
  # (CoreDNS forwards non-cluster names upstream). ipv6=off: proxy over IPv4.
  resolver 10.96.0.10 ipv6=off valid=30s;
  resolver_timeout 5s;

  # Forward NONE of the client's request headers to strem.io. nginx passes them
  # all by default, and requests arriving through our Cloudflare carry
  # Cf-Connecting-Ip: strem.io's Cloudflare then answers 403 "error 1000: DNS
  # points to prohibited IP" (it reads the header as a proxy loop). That broke
  # catalogs, meta and search for some clients and kept the Uptime Kuma probe at
  # 403. It also kept the browser's cookies from leaving for a third party.
  # Host stays nginx's default ($proxy_host), which is right for both the
  # v3-cinemeta pass and the @follow pass to cinemeta-catalogs.
  proxy_pass_request_headers off;
  proxy_set_header Accept "application/json";
  proxy_set_header User-Agent "cinemeta-proxy (+https://cinemeta.viktorbarzin.me)";
  # Plain bodies from upstream: sub_filter needs them, and the cache then holds
  # one copy per URI. nginx gzips towards the client instead.
  proxy_set_header Accept-Encoding "";
  gzip on;
  gzip_proxied any;
  gzip_types application/json;

  proxy_ssl_server_name on;
  proxy_connect_timeout 5s;
  # Retrying across strem.io's resolved addresses would stack read timeouts past
  # Traefik's 30s; connection errors only. The 5xx retry is @retry below.
  proxy_next_upstream error;

  proxy_cache cinemeta;
  proxy_cache_key $request_uri;
  # Only 200s are stored, and upstream cache headers are ignored so a 307 can
  # never be cached and replayed to a browser that cannot reach strem.io.
  proxy_ignore_headers Cache-Control Expires X-Accel-Expires Set-Cookie Vary;
  proxy_cache_valid 200 1h;
  proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
  proxy_cache_background_update on;
  proxy_cache_lock on;

  # Cinemeta's upstreams ALREADY send Access-Control-Allow-Origin: * themselves.
  # If we also add_header our own, the response carries the header TWICE, and
  # browsers REJECT that ("The 'Access-Control-Allow-Origin' header contains
  # multiple values '*, *', but only one is allowed") -> the cross-origin fetch
  # dies as net::ERR_FAILED / stremio-core "Failed to fetch". (curl does NOT
  # enforce CORS, so this only shows in a real browser.) Hide the upstream CORS
  # headers so our single add_header below is authoritative. No location sets
  # its own proxy_hide_header or add_header, so these server-level sets apply
  # everywhere (a location-level one would REPLACE them, not merge).
  proxy_hide_header Access-Control-Allow-Origin;
  proxy_hide_header Access-Control-Allow-Methods;
  proxy_hide_header Access-Control-Allow-Headers;
  proxy_hide_header content-security-policy;
  add_header Access-Control-Allow-Origin  "*" always;
  add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
  add_header Access-Control-Allow-Headers "*" always;
  add_header X-Cache-Status $upstream_cache_status always;
  if ($request_method = OPTIONS) { return 204; }

  set $cinemeta "v3-cinemeta.strem.io";

  # Local liveness/readiness target — 200 without touching the external upstream,
  # so a transient strem.io blip never restarts the proxy pods.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # manifest: rewrite id/name so Stremio installs this as a DISTINCT addon from
  # the official com.linvo.cinemeta (kept consistent with the account entry
  # com.viktorbarzin.cinemeta-proxy already set via addonCollectionSet). No
  # @retry here: it would serve the manifest without the rewrite.
  location = /manifest.json {
    proxy_pass https://$cinemeta/manifest.json;
    sub_filter_types application/json;
    sub_filter_once off;
    sub_filter "com.linvo.cinemeta"   "com.viktorbarzin.cinemeta-proxy";
    sub_filter "\"name\":\"Cinemeta\"" "\"name\":\"Cinemeta (proxied)\"";
  }

  # catalog / meta / addon_catalog: proxy to v3-cinemeta and follow its catalog
  # 307 (-> cinemeta-catalogs.strem.io) generically, so every catalog shape
  # (top, pagination skip=, genre=, search) works without hardcoding the target.
  # Search is answered by v3-cinemeta itself (the catalogs host ignores the
  # search term), which is the slow and flaky path the retry exists for.
  location / {
    proxy_pass https://$cinemeta;
    proxy_read_timeout 18s;
    proxy_intercept_errors on;
    error_page 301 302 307 308 = @follow;
    error_page 500 502 503 504 520 521 522 523 524 = @retry;
  }

  # One more attempt, short enough to finish inside Traefik's 30s. Its own
  # failure goes to the client as-is (with CORS), so stremio-core reports an
  # HTTP status instead of an opaque "Failed to fetch".
  location @retry {
    proxy_pass https://$cinemeta$request_uri;
    proxy_read_timeout 9s;
    proxy_intercept_errors on;
    recursive_error_pages on;
    error_page 301 302 307 308 = @follow;
  }

  location @follow {
    set $redir $upstream_http_location;       # full URL from the upstream Location header
    proxy_pass $redir;
    proxy_read_timeout 9s;
  }
}
