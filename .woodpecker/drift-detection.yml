# Daily drift detection — runs terraform plan on all stacks and alerts on drift.
# Triggered by Woodpecker cron schedule "drift-detection" (must be registered in Woodpecker UI/API).

when:
  event: cron
  cron: drift-detection

clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      partial: false
      depth: 1
      attempts: 3

steps:
  - name: detect-drift
    image: ghcr.io/viktorbarzin/infra-ci:latest
    pull: true
    backend_options:
      kubernetes:
        resources:
          requests:
            memory: 2Gi
          limits:
            memory: 4Gi
    environment:
      SLACK_WEBHOOK:
        from_secret: slack_webhook
    commands:
      # ── git-crypt unlock ──
      - |
        SA_TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
        curl -sk "https://10.0.20.100:6443/api/v1/namespaces/woodpecker/configmaps/git-crypt-key" \
          -H "Authorization:Bearer $SA_TOKEN" | jq -r .data.key | base64 -d > /tmp/key
        git-crypt unlock /tmp/key && rm /tmp/key

      # ── Vault auth ──
      - |
        SA_TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
        export VAULT_ADDR=http://vault-active.vault.svc.cluster.local:8200
        export VAULT_TOKEN=$(curl -s -X POST "$VAULT_ADDR/v1/auth/kubernetes/login" \
          -d "{\"role\":\"ci\",\"jwt\":\"$SA_TOKEN\"}" | jq -r .auth.client_token)

      # ── Generate kubeconfig from projected SA token ──
      # See default.yml for rationale. terragrunt.hcl injects
      # `-var kube_config_path=<repo>/config` for every terraform invocation,
      # so we need a kubeconfig file at that path. The woodpecker default SA
      # is cluster-admin, so the projected token is sufficient.
      - |
        cat > config <<'EOF'
        apiVersion: v1
        kind: Config
        clusters:
          - name: kubernetes
            cluster:
              server: https://10.0.20.100:6443
              certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        contexts:
          - name: ci
            context:
              cluster: kubernetes
              user: ci
        current-context: ci
        users:
          - name: ci
            user:
              tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
        EOF
        chmod 600 config
        kubectl --kubeconfig=config get ns kube-system -o name >/dev/null

      # ── Run terraform plan on all stacks ──
      # Emits two timestamps per drifted stack so the Pushgateway/Prometheus
      # side can compute drift-age-hours via `time() - drift_stack_first_seen`.
      - |
        NOW=$(date +%s)
        # Per-stack results and metrics accumulate in files rather than shell
        # variables — see the summary block below for why.
        RESULTS=$(mktemp)
        METRICS_FILE=$(mktemp)

        for stack_dir in stacks/*/; do
          stack=$(basename "$stack_dir")
          [ -f "$stack_dir/terragrunt.hcl" ] || continue

          # Tier-0 `vault` is human-applied via OIDC; the CI `ci` Vault role lacks
          # Vault-admin perms (sys/mounts + sys/policies/acl), so `terragrunt plan`
          # on it ERRORs (detailed-exitcode 1) and fails the whole nightly drift
          # run. Skip it — drift on Tier-0 vault is caught at human apply time.
          # (2026-06-27)
          [ "$stack" = "vault" ] && continue

          # `_template` is the new-stack scaffold, not a deployed stack: it ships
          # a terragrunt.hcl (so it passes the guard above) but only a
          # main.tf.example, so there is nothing to plan. It also sorts FIRST
          # under `stacks/*/` in the C locale ('_' < 'a'), so planning it took
          # down the whole nightly run before a single real stack was checked —
          # the 2026-08-08 logs end at "[_template] planning..." with no
          # per-stack results and nothing pushed to the Pushgateway. Skip every
          # underscore-prefixed scaffold directory. (2026-08-08)
          case "$stack" in _*) continue ;; esac

          echo -n "[$stack] planning... "
          # Plan through scripts/tg, NOT terragrunt directly. Tier-1 stacks keep
          # their state in the PG backend and read the connection string from
          # PG_CONN_STR, which only scripts/tg knows how to build (it fetches
          # database/static-creds/pg-terraform-state from Vault). Calling
          # terragrunt bare left conn_str empty, so terraform fell back to
          # localhost and every Tier-1 stack died in `Initializing the backend`
          # with `dial tcp [::1]:5432: connect: connection refused` — 150-odd
          # stacks, invisible because the run aborted at the first one. tg also
          # handles Tier-0 SOPS state decrypt, and takes no advisory lock for a
          # non-mutating verb, so a nightly plan cannot block an apply.
          #
          # `|| EXIT=$?` is load-bearing. Woodpecker runs step commands under
          # `set -e`, and a bare `OUTPUT=$(...)` assignment carries the exit
          # status of the command substitution — so any non-zero exit killed the
          # whole step right here. `-detailed-exitcode` returns non-zero for BOTH
          # outcomes we care about (1 = error, 2 = drift), which left `EXIT=$?`
          # and the case block below unreachable for anything but a clean stack.
          # Skipping the offending stack (vault 2026-06-27, _template
          # 2026-08-08) only ever moved the abort to the next one in sort order.
          EXIT=0
          OUTPUT=$(cd "$stack_dir" && ../../scripts/tg plan -detailed-exitcode -input=false 2>&1) || EXIT=$?
          echo "$stack $EXIT" >> "$RESULTS"

          case $EXIT in
            0)
              echo "OK (no changes)"
              # drift_stack_state=0 means clean; age-hours irrelevant so we
              # still push 0 so per-stack gauges don't go stale.
              printf 'drift_stack_state{stack="%s"} 0\n' "$stack" >> "$METRICS_FILE"
              printf 'drift_stack_age_hours{stack="%s"} 0\n' "$stack" >> "$METRICS_FILE"
              ;;
            1)
              echo "ERROR"
              # $OUTPUT was previously captured and never printed, so a failing
              # stack left nothing to debug from. Tail it: enough to identify
              # the error without dumping a full plan into the log.
              echo "--- [$stack] plan error (last 30 lines) ---"
              echo "$OUTPUT" | tail -30
              echo "--- end [$stack] ---"
              printf 'drift_stack_state{stack="%s"} 2\n' "$stack" >> "$METRICS_FILE"
              ;;
            2)
              echo "DRIFT DETECTED"
              # Log which resources moved. Until the `set -e` fix above, exit 2
              # aborted the run too, so a drifted stack was never actually
              # reported — this is the first run shape where this branch runs.
              # Terragrunt prefixes every terraform line with a timestamp and
              # "STDOUT terraform: ", so anchoring on the bare terraform format
              # matched nothing and this printed an empty diff on the first run
              # that reached it. Match the resource/summary lines wherever they
              # sit on the line instead.
              echo "$OUTPUT" | grep -E 'terraform: +(# .* will be| *# .* must be|Plan: )' | head -20
              # Fetch first-seen timestamp from Pushgateway (preserve across runs).
              FIRST_SEEN=$(curl -s "http://prometheus-prometheus-pushgateway.monitoring:9091/metrics" \
                | awk -v s="$stack" '$1 == "drift_stack_first_seen{stack=\""s"\"}" {print $2; exit}')
              if [ -z "$FIRST_SEEN" ] || [ "$FIRST_SEEN" = "0" ]; then
                FIRST_SEEN=$NOW
              fi
              AGE_HOURS=$(( (NOW - FIRST_SEEN) / 3600 ))
              printf 'drift_stack_state{stack="%s"} 1\n' "$stack" >> "$METRICS_FILE"
              printf 'drift_stack_first_seen{stack="%s"} %s\n' "$stack" "$FIRST_SEEN" >> "$METRICS_FILE"
              printf 'drift_stack_age_hours{stack="%s"} %s\n' "$stack" "$AGE_HOURS" >> "$METRICS_FILE"
              ;;
          esac
        done

        # Summary counters, derived from the results file. Woodpecker expands
        # dollar-brace references in this YAML before the shell ever sees it, so
        # the previous braced METRICS accumulator expanded to nothing and only
        # the LAST assignment survived — the 2026-08-14 push carried just
        # drift_detection_last_run_timestamp and no per-stack series at all, and
        # the summary read "Errors: none" after 150 errors. Files avoid both
        # that and any subshell-scoping question; keep $VAR unbraced below.
        CLEAN=$(awk '$2 == 0' "$RESULTS" | wc -l)
        DRIFT_COUNT=$(awk '$2 == 2' "$RESULTS" | wc -l)
        ERROR_COUNT=$(awk '$2 == 1' "$RESULTS" | wc -l)
        DRIFTED=$(awk '$2 == 2 { printf " %s", $1 }' "$RESULTS")
        ERRORS=$(awk '$2 == 1 { printf " %s", $1 }' "$RESULTS")

        printf 'drift_stack_count %s\n' "$DRIFT_COUNT" >> "$METRICS_FILE"
        printf 'drift_error_count %s\n' "$ERROR_COUNT" >> "$METRICS_FILE"
        printf 'drift_clean_count %s\n' "$CLEAN" >> "$METRICS_FILE"
        printf 'drift_detection_last_run_timestamp %s\n' "$NOW" >> "$METRICS_FILE"

        # ── Push to Pushgateway ──
        # One batched push keeps the run atomic: either all metrics land or none.
        curl -s --data-binary @"$METRICS_FILE" \
          http://prometheus-prometheus-pushgateway.monitoring:9091/metrics/job/drift-detection \
          || echo "(pushgateway unavailable, metrics lost for this run)"

        # Braced variable references are deliberately avoided in this block for
        # the Woodpecker-interpolation reason above; the old default-value form
        # one form that survived, but keeping one style is less error-prone.
        DRIFTED_TEXT=" none"
        ERRORS_TEXT=" none"
        [ -n "$DRIFTED" ] && DRIFTED_TEXT="$DRIFTED"
        [ -n "$ERRORS" ] && ERRORS_TEXT="$ERRORS"

        echo ""
        echo "=== Drift Detection Summary ==="
        echo "Clean: $CLEAN stacks"
        echo "Drift:$DRIFTED_TEXT"
        echo "Errors:$ERRORS_TEXT"

        # ── Slack only when something is WRONG (drift or errors) ──
        # All-clean runs are silent (Viktor 2026-07-02: CI notifies on
        # failed/actionable runs only; clean is the daily normal).
        if [ -n "$DRIFTED" ]; then
          curl -s -X POST -H 'Content-type: application/json' \
            --data "{\"channel\":\"general\",\"text\":\":warning: Drift detected in:$DRIFTED_TEXT\nClean: $CLEAN stacks. Errors:$ERRORS_TEXT\"}" \
            "$SLACK_WEBHOOK" || true
        elif [ -n "$ERRORS" ]; then
          curl -s -X POST -H 'Content-type: application/json' \
            --data "{\"channel\":\"general\",\"text\":\":red_circle: Drift detection had errors:$ERRORS_TEXT (clean: $CLEAN)\"}" \
            "$SLACK_WEBHOOK" || true
        fi

  # Hard-failure catch: the in-script posts above never run if the step
  # itself crashes early — this step is the only signal for that case.
  - name: notify-failure
    image: curlimages/curl
    commands:
      - |
        curl -s -X POST -H 'Content-type: application/json' \
          --data "{\"channel\":\"general\",\"text\":\":red_circle: Drift-detection pipeline FAILED (crashed before reporting)\"}" \
          "$SLACK_WEBHOOK" || true
    environment:
      SLACK_WEBHOOK:
        from_secret: slack_webhook
    when:
      status: [failure]
