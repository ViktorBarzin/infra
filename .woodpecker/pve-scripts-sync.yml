# Sync infra/scripts/{lvm-pvc-snapshot,daily-backup,offsite-sync-backup} and
# their systemd units to the PVE host on change.
#
# Modelled on pve-nfs-exports-sync.yml, which moved the "scp by hand from a
# runbook" deploy for /etc/exports into CI. These three backup scripts had the
# same shape: docs/architecture/backup-dr.md carried the scp invocation and a
# person had to remember to run it, so a committed change could sit undeployed.
#
# Verified before first landing (2026-09-03, code-kpk0): all nine files are
# byte-identical between the repo and the host, so the first run is a no-op.
#
# Trigger: push to master touching any of the nine files below.
#
# Credentials:
#   - pve_ssh_key: Woodpecker repo-secret, the same ed25519 keypair
#     pve-nfs-exports-sync uses. Public key in /root/.ssh/authorized_keys on
#     the PVE host, private key mirrored in Vault `secret/woodpecker/pve_ssh_key`.

when:
  - event: push
    branch: master
    path:
      - scripts/lvm-pvc-snapshot.sh
      - scripts/lvm-pvc-snapshot.service
      - scripts/lvm-pvc-snapshot.timer
      - scripts/daily-backup.sh
      - scripts/daily-backup.service
      - scripts/daily-backup.timer
      - scripts/offsite-sync-backup.sh
      - scripts/offsite-sync-backup.service
      - scripts/offsite-sync-backup.timer
    # A bare `event: manual` matches EVERY manual pipeline, so a trigger meant
    # for another workflow would run this one too. Same guard the sibling
    # pipelines carry. An undefined variable compares as empty, so a bare
    # manual run (no variables) still enters here.
  - event: manual
    evaluate: 'PIPELINE == "" || PIPELINE == "pve-scripts-sync"'

clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      partial: false
      depth: 1
      attempts: 3

steps:
  - name: deploy
    image: alpine:3.20
    environment:
      PVE_SSH_KEY:
        from_secret: pve_ssh_key
    commands:
      - apk add --no-cache openssh-client
      - mkdir -p ~/.ssh && chmod 700 ~/.ssh
      - printf '%s\n' "$PVE_SSH_KEY" > ~/.ssh/id_ed25519
      - chmod 600 ~/.ssh/id_ed25519
      # Pin host key — CI's ~/.ssh/known_hosts is ephemeral.
      - ssh-keyscan -t ed25519 192.168.1.127 >> ~/.ssh/known_hosts 2>/dev/null
      # Diff first, so the pipeline log shows the intended change even when the
      # scp that follows is a no-op.
      - |
        echo '---diff---'
        for n in lvm-pvc-snapshot daily-backup offsite-sync-backup; do
          ssh -o BatchMode=yes root@192.168.1.127 "cat /usr/local/bin/$n" > /tmp/remote.$n 2>/dev/null || true
          diff -u /tmp/remote.$n "scripts/$n.sh" && echo "$n.sh: unchanged" || true
          for u in service timer; do
            ssh -o BatchMode=yes root@192.168.1.127 "cat /etc/systemd/system/$n.$u" > /tmp/remote.$n.$u 2>/dev/null || true
            diff -u /tmp/remote.$n.$u "scripts/$n.$u" && echo "$n.$u: unchanged" || true
          done
        done
      - |
        echo '---applying---'
        for n in lvm-pvc-snapshot daily-backup offsite-sync-backup; do
          scp -o BatchMode=yes "scripts/$n.sh" "root@192.168.1.127:/usr/local/bin/$n"
          ssh -o BatchMode=yes root@192.168.1.127 "chmod 755 /usr/local/bin/$n && bash -n /usr/local/bin/$n"
          scp -o BatchMode=yes "scripts/$n.service" "scripts/$n.timer" root@192.168.1.127:/etc/systemd/system/
        done
      - |
        echo '---reloading---'
        ssh -o BatchMode=yes root@192.168.1.127 "systemctl daemon-reload"
        ssh -o BatchMode=yes root@192.168.1.127 "systemctl list-timers --no-pager lvm-pvc-snapshot.timer daily-backup.timer offsite-sync-backup.timer"
      - echo '---done---'

  - name: slack
    image: curlimages/curl:8.11.0
    environment:
      SLACK_WEBHOOK:
        from_secret: slack_webhook
    commands:
      - |
        curl -s -X POST -H 'Content-type: application/json' \
          --data "{\"channel\":\"general\",\"text\":\":red_circle: PVE backup-scripts sync FAILED\"}" \
          "$SLACK_WEBHOOK" || true
    when:
      # Failure-only (Viktor 2026-07-02): CI notifies on failed runs only.
      status: [failure]
