# promtool unit tests for the Cloud alert group (stacks/monitoring
# prometheus_chart_values.tpl, "- name: Cloud"). tests/cloud-deploy.test.sh
# cuts the group out into cloud.rules.yml and runs these with promtool.
# Labels on the scraped series are the ones the kubernetes-service-endpoints
# job adds (namespace, service). That job sets honor_labels: true, so the
# Postgres series keep their own `service` label (the Cloud Service name)
# over the Kubernetes Service name. Series are 2 minutes apart, the global
# scrape_interval, and rules are evaluated every minute, as in production.
rule_files:
  - cloud.rules.yml

evaluation_interval: 1m

tests:
  # The reconciler is down, or never came up (no series at all): page.
  - interval: 2m
    input_series:
      - series: 'up{job="kubernetes-service-endpoints", namespace="cloud", service="cloud-reconciler", instance="10.0.0.1:9090"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 10m
        alertname: CloudReconcilerDown
        exp_alerts: []
      - eval_time: 20m
        alertname: CloudReconcilerDown
        exp_alerts:
          - exp_labels: {severity: critical, subsystem: cloud}
  - interval: 2m
    input_series:
      - series: 'up{job="kubernetes-service-endpoints", namespace="monitoring", service="other", instance="10.0.0.2:9090"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: CloudReconcilerDown
        exp_alerts:
          - exp_labels: {severity: critical, subsystem: cloud}
  - interval: 2m
    input_series:
      - series: 'up{job="kubernetes-service-endpoints", namespace="cloud", service="cloud-reconciler", instance="10.0.0.1:9090"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: CloudReconcilerDown
        exp_alerts: []

  # Jobs wait and none finishes: page. Jobs finishing: quiet, even with a
  # queue. A reconciler that never finished a job has no
  # cloud_reconcile_total series at all, and still pages.
  - interval: 2m
    input_series:
      - series: 'cloud_reconcile_queue_depth{namespace="cloud", service="cloud-reconciler"}'
        values: '3x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: CloudReconcileQueueStuck
        exp_alerts: []
      - eval_time: 35m
        alertname: CloudReconcileQueueStuck
        exp_alerts:
          - exp_labels: {severity: critical, subsystem: cloud}
  - interval: 2m
    input_series:
      - series: 'cloud_reconcile_queue_depth{namespace="cloud", service="cloud-reconciler"}'
        values: '3x30'
      - series: 'cloud_reconcile_total{namespace="cloud", service="cloud-reconciler", result="done"}'
        values: '0+1x30'
    alert_rule_test:
      - eval_time: 35m
        alertname: CloudReconcileQueueStuck
        exp_alerts: []
  - interval: 2m
    input_series:
      - series: 'cloud_reconcile_queue_depth{namespace="cloud", service="cloud-reconciler"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 35m
        alertname: CloudReconcileQueueStuck
        exp_alerts: []
  # The first job after a restart finishes at 20m and its series starts at 1:
  # that counts as a finished job, so the pending alert resets.
  - interval: 2m
    input_series:
      - series: 'cloud_reconcile_queue_depth{namespace="cloud", service="cloud-reconciler"}'
        values: '3x30'
      - series: 'cloud_reconcile_total{namespace="cloud", service="cloud-reconciler", result="done"}'
        values: '_x9 1x20'
    alert_rule_test:
      - eval_time: 35m
        alertname: CloudReconcileQueueStuck
        exp_alerts: []
  # A 10-minute scrape gap (40m to 50m) does not make the old series count
  # as a finished job: the queue, stuck since 20m, still pages.
  - interval: 2m
    input_series:
      - series: 'cloud_reconcile_queue_depth{namespace="cloud", service="cloud-reconciler"}'
        values: '0x10 3x10 _x5 3x60'
      - series: 'cloud_reconcile_total{namespace="cloud", service="cloud-reconciler", result="done"}'
        values: '5x20 _x5 5x60'
    alert_rule_test:
      - eval_time: 1h40m
        alertname: CloudReconcileQueueStuck
        exp_alerts:
          - exp_labels: {severity: critical, subsystem: cloud}

  # A job failed after all its attempts: warning, no page, for as long as the
  # failure is inside the 15-minute window. Retries alone are quiet.
  - interval: 2m
    input_series:
      - series: 'cloud_reconcile_total{namespace="cloud", service="cloud-reconciler", result="failed"}'
        values: '0+1x20'
      - series: 'cloud_reconcile_total{namespace="cloud", service="cloud-reconciler", result="retry"}'
        values: '0+1x20'
    alert_rule_test:
      - eval_time: 5m
        alertname: CloudReconcileFailing
        exp_alerts:
          - exp_labels: {severity: warning, subsystem: cloud}
  - interval: 2m
    input_series:
      - series: 'cloud_reconcile_total{namespace="cloud", service="cloud-reconciler", result="retry"}'
        values: '0+1x20'
      - series: 'cloud_reconcile_total{namespace="cloud", service="cloud-reconciler", result="done"}'
        values: '0+1x20'
    alert_rule_test:
      - eval_time: 35m
        alertname: CloudReconcileFailing
        exp_alerts: []
  # One failure at 10m fires at once and clears once it leaves the window.
  - interval: 2m
    input_series:
      - series: 'cloud_reconcile_total{namespace="cloud", service="cloud-reconciler", result="failed"}'
        values: '0x4 1x25'
    alert_rule_test:
      - eval_time: 8m
        alertname: CloudReconcileFailing
        exp_alerts: []
      - eval_time: 12m
        alertname: CloudReconcileFailing
        exp_alerts:
          - exp_labels: {severity: warning, subsystem: cloud}
      - eval_time: 20m
        alertname: CloudReconcileFailing
        exp_alerts:
          - exp_labels: {severity: warning, subsystem: cloud}
      - eval_time: 30m
        alertname: CloudReconcileFailing
        exp_alerts: []
  # The first failure after a restart: the series starts at 1 at 12m.
  - interval: 2m
    input_series:
      - series: 'cloud_reconcile_total{namespace="cloud", service="cloud-reconciler", result="failed"}'
        values: '_x6 1x23'
    alert_rule_test:
      - eval_time: 14m
        alertname: CloudReconcileFailing
        exp_alerts:
          - exp_labels: {severity: warning, subsystem: cloud}
      - eval_time: 20m
        alertname: CloudReconcileFailing
        exp_alerts:
          - exp_labels: {severity: warning, subsystem: cloud}
      - eval_time: 30m
        alertname: CloudReconcileFailing
        exp_alerts: []
  # Failures 20 minutes apart (10m and 30m) fire each time.
  - interval: 2m
    input_series:
      - series: 'cloud_reconcile_total{namespace="cloud", service="cloud-reconciler", result="failed"}'
        values: '0x4 1x9 2x15'
    alert_rule_test:
      - eval_time: 12m
        alertname: CloudReconcileFailing
        exp_alerts:
          - exp_labels: {severity: warning, subsystem: cloud}
      - eval_time: 28m
        alertname: CloudReconcileFailing
        exp_alerts: []
      - eval_time: 32m
        alertname: CloudReconcileFailing
        exp_alerts:
          - exp_labels: {severity: warning, subsystem: cloud}
  # An old failure, then a 10-minute scrape gap (40m to 50m) with no new
  # failure: quiet, before and after the gap.
  - interval: 2m
    input_series:
      - series: 'cloud_reconcile_total{namespace="cloud", service="cloud-reconciler", result="failed"}'
        values: '1x20 _x5 1x30'
    alert_rule_test:
      - eval_time: 1h4m
        alertname: CloudReconcileFailing
        exp_alerts: []
      - eval_time: 1h20m
        alertname: CloudReconcileFailing
        exp_alerts: []

  # A Project 30 minutes behind its desired version: warning per Project.
  # A Project that is not converging has no series.
  - interval: 2m
    input_series:
      - series: 'cloud_project_converging_seconds{namespace="cloud", service="cloud-reconciler", project="slow"}'
        values: '1500+120x10'
      - series: 'cloud_project_converging_seconds{namespace="cloud", service="cloud-reconciler", project="fine"}'
        values: '60+120x10'
    alert_rule_test:
      - eval_time: 3m
        alertname: CloudProjectStuckConverging
        exp_alerts: []
      - eval_time: 14m
        alertname: CloudProjectStuckConverging
        exp_alerts:
          - exp_labels: {severity: warning, subsystem: cloud, project: slow}

  # A database past 80% of its Size for 15 minutes: warning per database.
  - interval: 2m
    input_series:
      - series: 'cloud_postgres_database_bytes{namespace="cloud", project="a", service="x"}'
        values: '900x15'
      - series: 'cloud_postgres_database_limit_bytes{namespace="cloud", project="a", service="x"}'
        values: '1000x15'
      - series: 'cloud_postgres_database_bytes{namespace="cloud", project="b", service="y"}'
        values: '500x15'
      - series: 'cloud_postgres_database_limit_bytes{namespace="cloud", project="b", service="y"}'
        values: '1000x15'
    alert_rule_test:
      - eval_time: 10m
        alertname: CloudPostgresDatabaseNearSize
        exp_alerts: []
      - eval_time: 20m
        alertname: CloudPostgresDatabaseNearSize
        exp_alerts:
          - exp_labels: {severity: warning, subsystem: cloud, project: a, service: x}

  # A database the reconciler cannot measure for 15 minutes: warning.
  - interval: 2m
    input_series:
      - series: 'cloud_postgres_database_unmeasured{namespace="cloud", project="a", service="x"}'
        values: '1x15'
      - series: 'cloud_postgres_database_unmeasured{namespace="cloud", project="b", service="y"}'
        values: '0x15'
    alert_rule_test:
      - eval_time: 10m
        alertname: CloudPostgresDatabaseUnmeasured
        exp_alerts: []
      - eval_time: 20m
        alertname: CloudPostgresDatabaseUnmeasured
        exp_alerts:
          - exp_labels: {severity: warning, subsystem: cloud, project: a, service: x}

  # A database whose disk limit the reconciler could not enforce for three
  # passes (30 minutes): warning per database. One failed pass that the next
  # one fixes stays quiet.
  - interval: 2m
    input_series:
      - series: 'cloud_postgres_disk_enforcement_failed{namespace="cloud", project="a", service="x"}'
        values: '1x25'
      - series: 'cloud_postgres_disk_enforcement_failed{namespace="cloud", project="b", service="y"}'
        values: '0x4 1x5 0x15'
    alert_rule_test:
      - eval_time: 25m
        alertname: CloudPostgresDiskEnforcementFailed
        exp_alerts: []
      - eval_time: 35m
        alertname: CloudPostgresDiskEnforcementFailed
        exp_alerts:
          - exp_labels: {severity: warning, subsystem: cloud, project: a, service: x}

  # A database at its Size's disk and read-only for 10 minutes: info per
  # database, no page.
  - interval: 2m
    input_series:
      - series: 'cloud_postgres_database_read_only{namespace="cloud", project="a", service="x"}'
        values: '1x15'
      - series: 'cloud_postgres_database_read_only{namespace="cloud", project="b", service="y"}'
        values: '0x15'
    alert_rule_test:
      - eval_time: 5m
        alertname: CloudPostgresReadOnly
        exp_alerts: []
      - eval_time: 15m
        alertname: CloudPostgresReadOnly
        exp_alerts:
          - exp_labels: {severity: info, subsystem: cloud, project: a, service: x}

  # Build minutes past 70% of the account allowance: warning.
  - interval: 2m
    input_series:
      - series: 'cloud_build_minutes_used{namespace="cloud", service="cloud"}'
        values: '1300+40x10'
      - series: 'cloud_build_minutes_allowance{namespace="cloud", service="cloud"}'
        values: '2000x10'
    alert_rule_test:
      - eval_time: 2m
        alertname: CloudBuildMinutesHigh
        exp_alerts: []
      - eval_time: 15m
        alertname: CloudBuildMinutesHigh
        exp_alerts:
          - exp_labels: {severity: warning, subsystem: cloud}

  # An email waiting over 15 minutes, for 10 minutes: warning, no page. A
  # webhook that waits as long alerts nothing (the User's endpoint).
  - interval: 2m
    input_series:
      - series: 'cloud_notification_oldest_pending_seconds{namespace="cloud", service="cloud-reconciler", kind="email"}'
        values: '0+120x20'
      - series: 'cloud_notification_oldest_pending_seconds{namespace="cloud", service="cloud-reconciler", kind="webhook"}'
        values: '0+120x20'
      - series: 'cloud_notification_pass_last_success_timestamp_seconds{namespace="cloud", service="cloud-reconciler"}'
        values: '0+120x20'
    alert_rule_test:
      - eval_time: 20m
        alertname: CloudNotificationsStuck
        exp_alerts: []
      - eval_time: 30m
        alertname: CloudNotificationsStuck
        exp_alerts:
          - exp_labels: {severity: warning, subsystem: cloud}
  - interval: 2m
    input_series:
      - series: 'cloud_notification_oldest_pending_seconds{namespace="cloud", service="cloud-reconciler", kind="email"}'
        values: '0x20'
      - series: 'cloud_notification_oldest_pending_seconds{namespace="cloud", service="cloud-reconciler", kind="webhook"}'
        values: '0+120x20'
      - series: 'cloud_notification_pass_last_success_timestamp_seconds{namespace="cloud", service="cloud-reconciler"}'
        values: '0+120x20'
    alert_rule_test:
      - eval_time: 40m
        alertname: CloudNotificationsStuck
        exp_alerts: []

  # The loop stops succeeding: the age stays 0, but the last pass grows old.
  - interval: 2m
    input_series:
      - series: 'cloud_notification_oldest_pending_seconds{namespace="cloud", service="cloud-reconciler", kind="email"}'
        values: '0x20'
      - series: 'cloud_notification_pass_last_success_timestamp_seconds{namespace="cloud", service="cloud-reconciler"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 20m
        alertname: CloudNotificationsStuck
        exp_alerts: []
      - eval_time: 30m
        alertname: CloudNotificationsStuck
        exp_alerts:
          - exp_labels: {severity: warning, subsystem: cloud}

  # Postgres tasks (cloud B28b): Kubernetes refusing a task's Job fires at
  # once, with its kind and result; a task that ended done stays quiet.
  # Every kind and result series starts at 0 (src/reconciler/metrics.ts).
  - interval: 2m
    input_series:
      - series: 'cloud_postgres_tasks_total{namespace="cloud", service="cloud-reconciler", kind="backups", result="job_refused"}'
        values: '0x5 1x20'
      - series: 'cloud_postgres_tasks_total{namespace="cloud", service="cloud-reconciler", kind="backup", result="done"}'
        values: '0+1x25'
    alert_rule_test:
      - eval_time: 8m
        alertname: CloudPostgresTasksFailing
        exp_alerts: []
      - eval_time: 14m
        alertname: CloudPostgresTasksFailing
        exp_alerts:
          - exp_labels: {severity: warning, subsystem: cloud, kind: backups, result: job_refused}
      - eval_time: 50m
        alertname: CloudPostgresTasksFailing
        exp_alerts: []
  # A kind's own failure fires only when it repeats: 3 in an hour.
  - interval: 2m
    input_series:
      - series: 'cloud_postgres_tasks_total{namespace="cloud", service="cloud-reconciler", kind="export", result="task_failed"}'
        values: '0x5 1x20'
      - series: 'cloud_postgres_tasks_total{namespace="cloud", service="cloud-reconciler", kind="restore", result="task_failed"}'
        values: '0x5 1 2 3x20'
      - series: 'cloud_postgres_tasks_total{namespace="cloud", service="cloud-reconciler", kind="restore", result="database_not_empty"}'
        values: '0+1x25'
    alert_rule_test:
      - eval_time: 20m
        alertname: CloudPostgresTasksFailing
        exp_alerts:
          - exp_labels: {severity: warning, subsystem: cloud, kind: restore, result: task_failed}

  # Builds that fail for Cloud's reasons: one dispatch_failed fires; one
  # runner_unavailable waits for a second; a build_failed is the User's.
  - interval: 2m
    input_series:
      - series: 'cloud_build_failures_total{namespace="cloud", service="cloud-reconciler", failure="dispatch_failed"}'
        values: '0x5 1x20'
      - series: 'cloud_build_failures_total{namespace="cloud", service="cloud-reconciler", failure="build_failed"}'
        values: '0+1x25'
    alert_rule_test:
      - eval_time: 14m
        alertname: CloudBuildsFailingForCloud
        exp_alerts:
          - exp_labels: {severity: warning, subsystem: cloud, failure: dispatch_failed}
  - interval: 2m
    input_series:
      - series: 'cloud_build_failures_total{namespace="cloud", service="cloud-reconciler", failure="runner_unavailable"}'
        values: '0x5 1x10 2x20'
    alert_rule_test:
      - eval_time: 20m
        alertname: CloudBuildsFailingForCloud
        exp_alerts: []
      - eval_time: 40m
        alertname: CloudBuildsFailingForCloud
        exp_alerts:
          - exp_labels: {severity: warning, subsystem: cloud, failure: runner_unavailable}

  # Reconciler loops: a loop whose last good pass is older than its
  # threshold, for 5 minutes, fires with its name. A fresh loop is quiet.
  # The size pass, which has its own timestamp, joins as postgres_size.
  # Timestamps are Unix seconds; the test clock starts at 0.
  - interval: 2m
    input_series:
      # health_watch stops succeeding at 2 minutes.
      - series: 'cloud_reconciler_loop_last_success_timestamp_seconds{namespace="cloud", service="cloud-reconciler", loop="health_watch"}'
        values: '0 120x20'
      # cron_watch keeps succeeding.
      - series: 'cloud_reconciler_loop_last_success_timestamp_seconds{namespace="cloud", service="cloud-reconciler", loop="cron_watch"}'
        values: '0+120x20'
      # builds stops at 0: quiet until 15 minutes, then 5 more.
      - series: 'cloud_reconciler_loop_last_success_timestamp_seconds{namespace="cloud", service="cloud-reconciler", loop="builds"}'
        values: '0x20'
      - series: 'cloud_postgres_size_pass_last_success_timestamp_seconds{namespace="cloud", service="cloud-reconciler"}'
        values: '0+120x20'
    alert_rule_test:
      - eval_time: 8m
        alertname: CloudReconcilerLoopStalled
        exp_alerts: []
      - eval_time: 14m
        alertname: CloudReconcilerLoopStalled
        exp_alerts:
          - exp_labels: {severity: warning, subsystem: cloud, loop: health_watch}
      - eval_time: 22m
        alertname: CloudReconcilerLoopStalled
        exp_alerts:
          - exp_labels: {severity: warning, subsystem: cloud, loop: health_watch}
          - exp_labels: {severity: warning, subsystem: cloud, loop: builds}
  - interval: 2m
    input_series:
      - series: 'cloud_postgres_size_pass_last_success_timestamp_seconds{namespace="cloud", service="cloud-reconciler"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: CloudReconcilerLoopStalled
        exp_alerts: []
      - eval_time: 36m
        alertname: CloudReconcilerLoopStalled
        exp_alerts:
          - exp_labels: {severity: warning, subsystem: cloud, loop: postgres_size}

  # run_failed (the builder stopped before it finished) is Cloud's too,
  # and fires at the second in 2 hours, like runner_unavailable.
  - interval: 2m
    input_series:
      - series: 'cloud_build_failures_total{namespace="cloud", service="cloud-reconciler", failure="run_failed"}'
        values: '0x5 1x10 2x20'
    alert_rule_test:
      - eval_time: 20m
        alertname: CloudBuildsFailingForCloud
        exp_alerts: []
      - eval_time: 40m
        alertname: CloudBuildsFailingForCloud
        exp_alerts:
          - exp_labels: {severity: warning, subsystem: cloud, failure: run_failed}
