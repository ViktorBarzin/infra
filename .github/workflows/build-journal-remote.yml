name: Build journal-remote

# ADR-0002: infra-owned image built off-infra on GHA -> ghcr (public).
# systemd-journal-remote for the alloy-journal receiver in stacks/monitoring.
# Tag = images/journal-remote/VERSION; bump it for every change and point
# alloy-journal.yaml at the new tag.
on:
  push:
    branches: [master]
    paths:
      - 'images/journal-remote/**'
      - '.github/workflows/build-journal-remote.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the version
        id: v
        run: |
          echo "version=$(tr -d '[:space:]' < images/journal-remote/VERSION)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: images/journal-remote
          platforms: linux/amd64
          provenance: false
          push: true
          labels: |
            org.opencontainers.image.source=https://github.com/ViktorBarzin/infra
          tags: |
            ghcr.io/viktorbarzin/journal-remote:${{ steps.v.outputs.version }}
            ghcr.io/viktorbarzin/journal-remote:latest
