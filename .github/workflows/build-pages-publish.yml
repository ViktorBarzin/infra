name: Build pages-publish

# ADR-0002: infra-owned image built off-infra on GHA → ghcr (public).
# Build context is the stack dir (stacks/pages-publish); .dockerignore trims the
# .tf/tests noise. Keel polls ghcr:latest and rolls the deployment.
on:
  push:
    branches: [master]
    paths:
      - 'stacks/pages-publish/app/**'
      - 'stacks/pages-publish/Dockerfile'
      - 'stacks/pages-publish/requirements.txt'
      - '.github/workflows/build-pages-publish.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: vars
        run: echo "sha8=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: stacks/pages-publish
          platforms: linux/amd64
          provenance: false
          push: true
          tags: |
            ghcr.io/viktorbarzin/pages-publish:latest
            ghcr.io/viktorbarzin/pages-publish:${{ steps.vars.outputs.sha8 }}
