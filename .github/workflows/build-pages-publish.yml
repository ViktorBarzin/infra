name: Build pages-publish

# ADR-0002: infra-owned image built off-infra on GHA → ghcr, deployed by Keel
# (the deployment is keel.sh/policy=force + match-tag=true + poll @every 5m, so a
# fresh :latest digest rolls automatically — no Woodpecker deploy step needed.
# match-tag is load-bearing: without it Keel watches for new TAGS, which this
# repo never grows, and nothing deploys — see the annotation comment in
# stacks/pages-publish/main.tf). Source lives
# in-repo at stacks/pages-publish/ (app + Dockerfile), identical on both git
# remotes, so the github checkout builds the current image.
on:
  push:
    branches: [master]
    paths:
      - 'stacks/pages-publish/app/**'
      - 'stacks/pages-publish/Dockerfile'
      - 'stacks/pages-publish/requirements.txt'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: stacks/pages-publish
          platforms: linux/amd64
          provenance: false
          push: true
          tags: |
            ghcr.io/viktorbarzin/pages-publish:latest
            ghcr.io/viktorbarzin/pages-publish:${{ github.sha }}
