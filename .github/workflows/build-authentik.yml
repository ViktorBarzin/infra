name: Build Custom Authentik Image

# ADR-0002: infra-owned image built off-infra on GHA → ghcr.
# Thin old-browser overlay over the official authentik server: serves authentik's
# no-JS Simplified Flow Executor to old WebKit / iOS<=16.3 instead of a blank
# login (see stacks/authentik/Dockerfile). The overlay's other patch, SLOW-1a,
# went upstream and shipped in 2026.8.1, so the whole overlay is now
# patch-compat-sfe.py. On every authentik bump, edit the FROM tag + the patchN
# suffix here + the image tag in modules/authentik/values.yaml together.
on:
  push:
    branches: [master]
    paths:
      # BOTH files: the overlay is now the patch script, so a script-only edit
      # must rebuild too (it previously did not, and needed a workflow_dispatch).
      - 'stacks/authentik/Dockerfile'
      - 'stacks/authentik/patch-compat-sfe.py'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: stacks/authentik
          platforms: linux/amd64
          provenance: false
          push: true
          tags: |
            ghcr.io/viktorbarzin/authentik-server:2026.8.1-patch4
            ghcr.io/viktorbarzin/authentik-server:latest
