name: Build ha-london journal upload add-on

# ADR-0002: built off-infra on GHA; the Pi only pulls it (never build on
# ha-london, a Pi 3 with 903 MB RAM). arm64 for ha-london, amd64 so the same
# add-on can run on an x86 HAOS later.
# Tag = `version` in ha-addons/journal_upload/config.yaml (the Supervisor pulls
# <image>:<version>), so bump the version for every change.
on:
  push:
    branches: [master]
    paths:
      - 'ha-addons/journal_upload/**'
      - '.github/workflows/build-ha-addon-journal-upload.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the add-on version
        id: v
        run: |
          echo "version=$(sed -n 's/^version: "\(.*\)"/\1/p' ha-addons/journal_upload/config.yaml)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ha-addons/journal_upload
          platforms: linux/arm64,linux/amd64
          provenance: false
          push: true
          labels: |
            org.opencontainers.image.source=https://github.com/ViktorBarzin/infra
          tags: |
            ghcr.io/viktorbarzin/ha-addon-journal-upload:${{ steps.v.outputs.version }}
            ghcr.io/viktorbarzin/ha-addon-journal-upload:latest
