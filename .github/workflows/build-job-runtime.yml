name: Build job-runtime

# ADR-0002 + ADR-0018: infra-owned image built off-infra on GHA → ghcr (public).
# Shared runtime for the frequent CronJobs (curl, jq, sqlite, ssh, python libs)
# so their pods do not install packages on every start.
# Rebuilds are rare (pins only change deliberately) → dispatch + path.
# Security note: no untrusted event inputs are interpolated anywhere (only
# github.actor / github.sha / GITHUB_TOKEN — same shape as the other
# build-*.yml workflows in this repo).
on:
  push:
    branches: [master]
    paths:
      - 'images/job-runtime/**'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: images/job-runtime
          platforms: linux/amd64
          provenance: false
          push: true
          tags: |
            ghcr.io/viktorbarzin/job-runtime:latest
            ghcr.io/viktorbarzin/job-runtime:${{ github.sha }}
