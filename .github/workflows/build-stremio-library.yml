name: Build stremio-library

# ADR-0002 + ADR-0018: infra-owned image built off-infra on GHA → ghcr (public).
# Runtime of the "Our server" Stremio addon (stacks/stremio/library.tf):
# Python with ffmpeg and ffsubsync for subtitles timed to the sound.
# Rebuilds are rare (pins only change deliberately) → dispatch + path.
# Security note: no untrusted event inputs are interpolated anywhere (only
# github.actor / github.sha / GITHUB_TOKEN — same shape as the other
# build-*.yml workflows in this repo).
on:
  push:
    branches: [master]
    paths:
      - 'images/stremio-library/**'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: images/stremio-library
          platforms: linux/amd64
          provenance: false
          push: true
          tags: |
            ghcr.io/viktorbarzin/stremio-library:latest
            ghcr.io/viktorbarzin/stremio-library:${{ github.sha }}
