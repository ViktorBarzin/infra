---
# playbooks/pfsense-haproxy.yml
#
# The pfSense HAProxy package and the ports it owns:
#   - scripts/pfsense-haproxy-bootstrap.php declares the package config: the
#     IPv4 mail frontends and the SNI-routed internal :443, all send-proxy-v2.
#     It also deletes the six public IPv6 frontends on the HE tunnel address
#     (2001:470:6e:43d::2) that ran from 2026-11-02 to 2026-11-03.
#   - playbooks/files/pfsense-ipv6-ingress-config.php keeps the webConfigurator
#     HTTP redirect off, so pfSense's nginx never listens on port 80, and
#     removes the hooks of the standalone IPv6 bridge retired on 2026-11-02.
#
# Public IPv6 no longer touches HAProxy: since 2026-11-03 the cluster is
# dual-stack and pfSense routes IPv6 to Traefik's VIP 2001:470:5a7f:20::203 and
# to mailserver-v6 (playbooks/pfsense-k8s-ipv6.yml,
# docs/plans/2026-11-02-cluster-dual-stack.md). History of the bridge:
# docs/research/2026-11-02-reliable-ipv6-ingress.md.
#
# External check: gatus on mx2, edge group "ipv6 vip: *"
# (stacks/backup-mx/cloud-init.yaml.tftpl), pages Slack after ~3 min.
#
# RUN (from repo root; claim presence first:
#      presence claim host:pfsense --purpose "pfsense haproxy"):
#   dry-run : ansible-playbook -i playbooks/inventory.ini playbooks/pfsense-haproxy.yml --check --diff
#   apply   : ansible-playbook -i playbooks/inventory.ini playbooks/pfsense-haproxy.yml
#
# Both configurators leave pfSense config history entries
# ("ansible (pfsense-haproxy)"), restorable from
# Diagnostics > Backup & Restore > Config History.

- name: pfSense HAProxy package and IPv6 ingress
  hosts: pfsense
  gather_facts: false
  vars:
    bootstrap_remote: /tmp/pfsense-haproxy-bootstrap.php
    ingress_cfg_remote: /tmp/pfsense-ipv6-ingress-config.php
    tunnel_ipv6: "2001:470:6e:43d::2"
    legacy_rc: /usr/local/etc/rc.d/ipv6proxy

  tasks:
    - name: Ship the HAProxy package configurator
      ansible.builtin.copy:
        src: ../scripts/pfsense-haproxy-bootstrap.php
        dest: "{{ bootstrap_remote }}"
        mode: "0700"
        owner: root
      # The scripts are the idempotency boundary; see pfsense-tailscale.yml.
      changed_when: false
      check_mode: false

    - name: Ship the IPv6 ingress configurator
      ansible.builtin.copy:
        src: files/pfsense-ipv6-ingress-config.php
        dest: "{{ ingress_cfg_remote }}"
        mode: "0700"
        owner: root
      changed_when: false
      check_mode: false

    # ── check mode ─────────────────────────────────────────────────────────
    - name: HAProxy package changes (check mode)
      ansible.builtin.command: /usr/local/bin/php -f {{ bootstrap_remote }} -- --check
      changed_when: false
      check_mode: false
      register: hap_check
      when: ansible_check_mode

    - name: IPv6 ingress config.xml changes (check mode)
      ansible.builtin.command: /usr/local/bin/php -f {{ ingress_cfg_remote }} -- --check
      changed_when: false
      check_mode: false
      register: ing_check
      when: ansible_check_mode

    - name: Report what check mode would change
      ansible.builtin.debug:
        msg:
          haproxy: "{{ (hap_check.stdout | from_json).changes }}"
          config_xml: "{{ (ing_check.stdout | from_json).changes }}"
      when: ansible_check_mode

    # ── apply ──────────────────────────────────────────────────────────────
    - name: Stop the retired standalone IPv6 bridge if it is still installed
      ansible.builtin.shell: |
        if [ -x {{ legacy_rc }} ]; then {{ legacy_rc }} onestop; echo stopped; fi
      register: legacy_stop
      changed_when: "'stopped' in legacy_stop.stdout"
      when: not ansible_check_mode

    - name: Apply the HAProxy package configuration
      ansible.builtin.command: /usr/local/bin/php -f {{ bootstrap_remote }} --
      register: hap_apply
      changed_when: (hap_apply.stdout_lines[-1] | from_json).changed | bool
      when: not ansible_check_mode

    - name: Report HAProxy package changes
      ansible.builtin.debug:
        var: (hap_apply.stdout_lines[-1] | from_json)
      when: not ansible_check_mode

    # HAProxy only: ntpd listens on every address, the tunnel's included (UDP
    # 123, blocked inbound by the HE_IPv6 rules).
    - name: HAProxy no longer listens on the HE tunnel address
      ansible.builtin.shell: |
        held=$(sockstat -6 -l | awk -v a="{{ tunnel_ipv6 }}:" '$2 == "haproxy" && index($6, a) == 1 {print $6}')
        [ -z "$held" ] || { echo "haproxy still listening: $held"; exit 1; }
        echo "haproxy holds nothing on {{ tunnel_ipv6 }}"
      retries: 5
      delay: 3
      register: tunnel_free
      until: tunnel_free.rc == 0
      changed_when: false
      when: not ansible_check_mode

    - name: Apply the IPv6 ingress config.xml settings
      ansible.builtin.command: /usr/local/bin/php -f {{ ingress_cfg_remote }} --
      register: ing_apply
      changed_when: (ing_apply.stdout | from_json).changed | bool
      when: not ansible_check_mode

    - name: Report IPv6 ingress config.xml changes
      ansible.builtin.debug:
        var: (ing_apply.stdout | from_json).changes
      when: not ansible_check_mode

    - name: Find files of the retired standalone bridge
      ansible.builtin.find:
        paths: [/usr/local/etc, /usr/local/etc/rc.d]
        patterns:
          - "ipv6_proxy.sh*"
          - "ipv6_proxy_watchdog.sh"
          - "ipv6-haproxy.cfg*"
          - "ipv6proxy*"
      register: legacy_files

    - name: Remove files of the retired standalone bridge
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ legacy_files.files }}"
      loop_control:
        label: "{{ item.path }}"
