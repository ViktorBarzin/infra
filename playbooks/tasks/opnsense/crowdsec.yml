# CrowdSec on OPNsense (os-crowdsec). The box is a BOUNCER and an AGENT of our
# cluster LAPI, reached at the crowdsec-lapi-edge LoadBalancer
# (10.0.20.210:8080, stacks/crowdsec, which admits only 10.0.20.1). Its own
# local LAPI is off. The agent reads the filter, GUI and audit logs (port
# scans, SSH and GUI brute force) and pushes alerts as machine opnsense-edge
# (password: Vault secret/opnsense crowdsec_agent_password). A remote agent's
# alerts skip the cluster agents' parser whitelist, so the LAPI's own
# "trusted-infra" allowlist (stacks/crowdsec lapi_allowlist) keeps our
# addresses from being banned.
#
# lapi_manual_configuration keeps the plugin's reconfigure from rewriting the
# bouncer's api_url; the url and key below are what it then uses.
#
# The plugin's own rules block in and out on every interface. At cutover that
# would cut every client off from what the cluster LAPI lists, including the
# static Meta and proxy ASN lists that Traefik applies with webhook exemptions.
# So the plugin rules are off, the bouncer takes only CAPI, local scenario and
# manual (cscli) decisions, and filter.yml blocks them inbound on WAN and the
# HE tunnel (aliases crowdsec_blocklists / crowdsec6_blocklists, the tables the
# bouncer fills). The static lists stay at Traefik (origin cscli-import).
#
# Network IDS phase 3 (docs/plans/2026-11-10-network-ids.md): the agent also
# reads Suricata's eve.json (crowdsecurity/suricata), and every scenario here
# ran in simulation until Viktor's review on 2026-11-11; it enforces since (simulation.yaml). abuse.ch C2 hits
# are re-labelled by a local parser so their decision targets the C2 address
# (scenario viktor/abusech-c2-destination, LAPI decision type c2-block, served
# to the crowdsec_c2 alias by the C2 blocklist mirror, never to this bouncer,
# which takes type ban only).
- name: CrowdSec plugin settings (bouncer only)
  opnsense_mvc:
    mode: settings
    controller: crowdsec/general
    item_root: general
    settings:
      agent_enabled: true
      lapi_enabled: false
      firewall_bouncer_enabled: true
      lapi_manual_configuration: true
      rules_enabled: false
  register: opn_crowdsec_settings

- name: Bouncer talks to the cluster LAPI
  ansible.builtin.lineinfile:
    path: /usr/local/etc/crowdsec/bouncers/crowdsec-firewall-bouncer.yaml
    regexp: "^{{ item.key }}:"
    line: "{{ item.key }}: {{ item.value }}"
  loop:
    - { key: api_url, value: "http://10.0.20.210:8080/" }
    - { key: origins, value: "[crowdsec, CAPI, cscli]" }
    - { key: api_key, value: "{{ lookup('pipe', 'vault kv get -field=crowdsec_bouncer_key secret/opnsense') }}" }
  loop_control:
    label: "{{ item.key }}"
  no_log: true
  register: opn_crowdsec_bouncer_cfg

- name: Agent logs in to the cluster LAPI
  ansible.builtin.lineinfile:
    path: /usr/local/etc/crowdsec/local_api_credentials.yaml
    regexp: "^{{ item.key }}:"
    line: "{{ item.key }}: {{ item.value }}"
  loop:
    - { key: url, value: "http://10.0.20.210:8080/" }
    - { key: login, value: opnsense-edge }
    - { key: password, value: "{{ lookup('pipe', 'vault kv get -field=crowdsec_agent_password secret/opnsense') }}" }
  loop_control:
    label: "{{ item.key }}"
  no_log: true
  register: opn_crowdsec_agent_cfg

- name: CrowdSec agent files (simulation, Suricata acquisition, C2 parser and scenario)
  ansible.builtin.copy:
    src: "files/opnsense/crowdsec/{{ item.src }}"
    dest: "/usr/local/etc/crowdsec/{{ item.dest }}"
    owner: root
    group: wheel
    mode: "0644"
  loop:
    - { src: simulation.yaml, dest: simulation.yaml }
    - { src: acquis-suricata.yaml, dest: acquis.d/suricata.yaml }
    - { src: viktor-abusech-c2.yaml, dest: parsers/s02-enrich/viktor-abusech-c2.yaml }
    - { src: viktor-suricata-replies.yaml, dest: parsers/s02-enrich/viktor-suricata-replies.yaml }
    - { src: viktor-abusech-c2-destination.yaml, dest: scenarios/viktor-abusech-c2-destination.yaml }
  loop_control:
    label: "{{ item.dest }}"
  register: opn_crowdsec_agent_files

- name: Read the installed CrowdSec collections
  ansible.builtin.command: cscli collections list -o raw
  check_mode: false
  changed_when: false
  register: opn_crowdsec_collections

- name: Install the Suricata collection
  ansible.builtin.command: cscli collections install crowdsecurity/suricata
  when: >-
    not ansible_check_mode and
    not (opn_crowdsec_collections.stdout_lines | select('match', '^crowdsecurity/suricata,') | list)
  register: opn_crowdsec_suricata_collection

- name: Apply CrowdSec settings
  ansible.builtin.uri:
    url: "{{ opn_api_url }}/crowdsec/service/reconfigure"
    method: POST
    body_format: json
    body: {}
  when: >-
    (opn_crowdsec_settings is changed or opn_crowdsec_bouncer_cfg is changed or opn_crowdsec_agent_cfg is changed)
    and not ansible_check_mode

- name: Restart the bouncer when its config changed
  ansible.builtin.command: service crowdsec_firewall restart
  when: opn_crowdsec_bouncer_cfg is changed and not ansible_check_mode

- name: Restart the agent when its credentials, files or collections changed
  ansible.builtin.command: service crowdsec restart
  when: >-
    not ansible_check_mode and
    (opn_crowdsec_agent_cfg is changed or opn_crowdsec_agent_files is changed
     or opn_crowdsec_suricata_collection is changed)

- name: Read the agent's simulation state
  ansible.builtin.command: cscli simulation status
  check_mode: false
  changed_when: false
  register: opn_crowdsec_simulation

- name: The agent enforces its decisions (global simulation off)
  ansible.builtin.assert:
    that: "'global simulation: disabled' in (opn_crowdsec_simulation.stdout + opn_crowdsec_simulation.stderr)"
    fail_msg: "CrowdSec global simulation is not off on OPNsense: {{ opn_crowdsec_simulation.stdout }}"
  when: not ansible_check_mode
