# Tailscale (os-tailscale) against our Headscale. Plan decision 12: in staging
# the box joins as its own node with no advertised routes, no exit node and
# accept-DNS off, so it cannot take any of pfSense's routes. The pre-auth key
# is one-time and untagged (Vault secret/opnsense tailscale_preauth_key); the
# node keeps its identity across the cutover.
#
# Production advertises pfSense's seven routes and the exit node
# (tailscale.yml). Headscale serves a route only once it is also approved
# there; the cutover approves the same routes pfSense's node has and tags the
# node tag:infra (docs/runbooks/opnsense.md), so the box never needs a new key.
- name: Read tailscale.yml
  ansible.builtin.set_fact:
    opn_ts: "{{ lookup('file', opn_dir + '/tailscale.yml') | from_yaml }}"

- name: Tailscale profile values
  ansible.builtin.set_fact:
    opn_ts_routes: >-
      {{ opn_ts.advertised_routes if opn_ts.profiles[opnsense_profile].advertised_routes == 'as above'
         else opn_ts.profiles[opnsense_profile].advertised_routes }}
    opn_ts_exit: "{{ opn_ts.profiles[opnsense_profile].advertise_exit_node }}"

- name: Tailscale authentication (Headscale)
  opnsense_mvc:
    mode: settings
    controller: tailscale/authentication
    item_root: authentication
    settings:
      loginServer: https://headscale.viktorbarzin.me
      preAuthKey: "{{ lookup('pipe', 'vault kv get -field=tailscale_preauth_key secret/opnsense') }}"
  no_log: true

- name: Tailscale advertised routes
  opnsense_mvc:
    controller: tailscale/settings
    item: subnet
    item_root: subnet4
    match_key: subnet
    items: >-
      {%- set out = [] -%}
      {%- for r in opn_ts_routes -%}
      {%-   set _ = out.append({'subnet': r.route, 'description': r.description}) -%}
      {%- endfor -%}
      {{ out }}
    prune: true
  register: opn_ts_subnets

- name: Tailscale settings
  opnsense_mvc:
    mode: settings
    controller: tailscale/settings
    item_root: settings
    settings:
      enabled: true
      acceptDNS: "{{ opn_ts.profiles[opnsense_profile].accept_dns }}"
      advertiseExitNode: "{{ opn_ts_exit }}"
      acceptSubnetRoutes: false
      enableSSH: false
  register: opn_ts_settings

- name: Apply Tailscale
  ansible.builtin.uri:
    url: "{{ opn_api_url }}/tailscale/service/reconfigure"
    method: POST
    body_format: json
    body: {}
  when: not ansible_check_mode and (opn_ts_subnets is changed or opn_ts_settings is changed)
