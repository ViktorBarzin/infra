# Root's SSH keys: the Ansible key from Vault plus the public keys in
# authorized_keys.yml (the Proxmox host's backup key). OPNsense stores the
# field base64-encoded; the API takes it as text.
- name: Root SSH authorized keys
  opnsense_mvc:
    # The user controller's actions carry no item suffix (search, get, set...).
    search: auth/user/search
    get: auth/user/get
    add: auth/user/add
    set: auth/user/set
    delete: auth/user/del
    item_root: user
    match_key: name
    items:
      - name: root
        authorizedkeys: >-
          {{ ([lookup('pipe', 'vault kv get -field=ssh_public_key secret/opnsense')]
              + (lookup('file', opn_dir + '/authorized_keys.yml') | from_yaml).root) | join(opn_newline) }}
    prune: false
  vars:
    # A real newline: '\n' inside the folded block above reaches Jinja as a
    # backslash and an n, and the box then sees one long key line.
    opn_newline: "\n"
  register: opn_root_keys

# The user API stores the keys but does not rewrite /root/.ssh/authorized_keys;
# local_user_set() is what the GUI calls on save.
- name: Write root's authorized_keys from the config
  ansible.builtin.shell: |
    cat > /tmp/opn-rootkeys.php <<'PHP'
    <?php
    require_once("config.inc"); require_once("auth.inc"); global $config;
    $us = $config['system']['user']; if (isset($us['name'])) $us = [$us];
    foreach ($us as $u) { if ($u['name'] === 'root') { local_user_set($u); } }
    PHP
    php /tmp/opn-rootkeys.php; rm -f /tmp/opn-rootkeys.php
  when: opn_root_keys is changed and not ansible_check_mode

# pfSense's own client key (Vault secret/opnsense outbound_ssh_private_key):
# the OpenWrt site routers trust it, and phpIPAM's import logs in here and
# hops to them (stacks/phpipam/files/fetch_sources.sh).
- name: Root's outbound SSH key (pfSense's, trusted by the site routers)
  ansible.builtin.copy:
    dest: /root/.ssh/id_ed25519
    content: "{{ lookup('pipe', 'vault kv get -field=outbound_ssh_private_key secret/opnsense') }}\n"
    owner: root
    group: wheel
    mode: "0600"
  no_log: true

# Homepage's OPNsense widget (stacks/reverse-proxy, module "opnsense"): a
# user with only the two pages the widget reads (Homepage docs), no usable
# password, and one API key kept in Vault secret/opnsense homepage_api_key /
# homepage_api_secret. The key is created once; OPNsense shows the secret
# only at creation, so a rerun leaves an existing key alone.
# scrambled_password is a create-time switch (it reads back as 0), so it is
# sent only when the user does not exist yet.
- name: Read the local users
  ansible.builtin.uri:
    url: "{{ opn_api_url }}/auth/user/search"
    method: POST
    body_format: json
    body: {current: 1, rowCount: -1, searchPhrase: ""}
  register: opn_users
  check_mode: false

- name: Homepage widget user (read-only)
  opnsense_mvc:
    search: auth/user/search
    get: auth/user/get
    add: auth/user/add
    set: auth/user/set
    delete: auth/user/del
    item_root: user
    match_key: name
    items:
      - >-
        {{ {'name': 'homepage', 'descr': 'Homepage dashboard widget (API only)',
            'priv': 'page-diagnostics-system-activity,page-status-trafficgraph'}
           | combine({} if 'homepage' in (opn_users.json.rows | map(attribute='name'))
                     else {'scrambled_password': true}) }}
    prune: false

- name: Read the Homepage user's API keys
  ansible.builtin.uri:
    url: "{{ opn_api_url }}/auth/user/search_api_key"
    method: POST
    body_format: json
    body: {current: 1, rowCount: -1, searchPhrase: ""}
  register: opn_hp_keys
  check_mode: false

- name: Create the Homepage API key and keep it in Vault
  when: >-
    not ansible_check_mode and
    (opn_hp_keys.json.rows | selectattr('username', 'equalto', 'homepage') | list | length) == 0
  block:
    - name: Create the Homepage API key
      ansible.builtin.uri:
        url: "{{ opn_api_url }}/auth/user/add_api_key/homepage"
        method: POST
        body_format: json
        body: {}
      register: opn_hp_newkey
      failed_when: opn_hp_newkey.json.result != 'ok'
      no_log: true

    # Values go in on stdin, never in argv (the devvm is shared).
    - name: Store the Homepage API key in Vault
      ansible.builtin.command:
        argv: [vault, kv, patch, secret/opnsense, "{{ item.field }}=-"]
        stdin: "{{ item.value }}"
        stdin_add_newline: false
      loop:
        - {field: homepage_api_key, value: "{{ opn_hp_newkey.json.key }}"}
        - {field: homepage_api_secret, value: "{{ opn_hp_newkey.json.secret }}"}
      delegate_to: localhost
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
      no_log: true
