[keyserver]
192.168.1.127 ansible_user=root ansible_ssh_private_key_file=~/.ssh/id_ed25519

# pfSense (VMID 101). The admin account is uid 0, but its login shell is
# /etc/rc.initial (the console menu), so ansible_shell_executable must be
# forced to /bin/sh or module invocation lands in the menu. python3.11 is
# present on the box (a package dependency), which is what the copy/command
# modules need.
[pfsense]
10.0.20.1 ansible_user=admin ansible_python_interpreter=/usr/local/bin/python3.11 ansible_shell_executable=/bin/sh ansible_shell_type=sh

# devvm (VMID 102), the shared Claude Code workstation. Targeted by devvm.yml,
# which builds a blank Ubuntu VM into a working machine. Runs against the live
# box too, where it should be a no-op once converged — check --diff first.
[devvm]
10.0.10.10 ansible_user=wizard ansible_become=true


# Kubernetes nodes. Targeted by k8s-node-tuning.yml, which declares the
# machine-wide network sysctls the cluster ingress path depends on. The nodes
# are otherwise built by kubeadm and not managed from here, so keep this group
# to host-level kernel settings rather than cluster state.
[k8s_nodes]
10.0.20.100 ansible_user=wizard ansible_become=true  # k8s-master
10.0.20.101 ansible_user=wizard ansible_become=true  # k8s-node1
10.0.20.102 ansible_user=wizard ansible_become=true  # k8s-node2
10.0.20.103 ansible_user=wizard ansible_become=true  # k8s-node3
10.0.20.104 ansible_user=wizard ansible_become=true  # k8s-node4
10.0.20.105 ansible_user=wizard ansible_become=true  # k8s-node5
