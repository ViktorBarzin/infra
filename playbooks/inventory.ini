[keyserver]
192.168.1.127 ansible_user=root ansible_ssh_private_key_file=~/.ssh/id_ed25519

# pfSense (VMID 101). The admin account is uid 0, but its login shell is
# /etc/rc.initial (the console menu), so ansible_shell_executable must be
# forced to /bin/sh or module invocation lands in the menu. python3.11 is
# present on the box (a package dependency), which is what the copy/command
# modules need.
[pfsense]
10.0.20.1 ansible_user=admin ansible_python_interpreter=/usr/local/bin/python3.11 ansible_shell_executable=/bin/sh ansible_shell_type=sh

# devvm (VMID 102), the shared Claude Code workstation. Targeted by devvm.yml,
# which builds a blank Ubuntu VM into a working machine. Runs against the live
# box too, where it should be a no-op once converged — check --diff first.
[devvm]
10.0.10.10 ansible_user=wizard ansible_become=true


# Kubernetes nodes. Targeted by k8s-node-tuning.yml, which declares the
# machine-wide network sysctls the cluster ingress path depends on plus the
# kubelet and containerd settings kubeadm does not carry. The nodes are
# otherwise built by kubeadm and not managed from here.
#
# k8s_node_name is the Kubernetes node name for the IP. k8s-node-tuning.yml uses
# it to read that node's live kubelet feature gates through the apiserver proxy
# before it writes any config, so keep it accurate — a wrong name makes the
# pre-flight gate check fail closed rather than pass wrongly.
[k8s_nodes]
10.0.20.100 ansible_user=wizard ansible_become=true k8s_node_name=k8s-master
10.0.20.101 ansible_user=wizard ansible_become=true k8s_node_name=k8s-node1
10.0.20.102 ansible_user=wizard ansible_become=true k8s_node_name=k8s-node2
10.0.20.103 ansible_user=wizard ansible_become=true k8s_node_name=k8s-node3
10.0.20.104 ansible_user=wizard ansible_become=true k8s_node_name=k8s-node4
10.0.20.105 ansible_user=wizard ansible_become=true k8s_node_name=k8s-node5


# The LAN pull-through registry cache VM (VMID 200, hostname docker-registry).
# Five registry:2 pull-through caches behind one nginx, wired into every k8s
# node's /etc/containerd/certs.d as a mirror with upstream as the fallback host.
# Targeted by registry-cache.yml, which brings /opt/registry under declaration:
# the compose file, the six registry configs, nginx, the maintenance scripts and
# the cron schedule. Config lives in git; htpasswd, the TLS pair and the Docker
# Hub pull credentials come from Vault at apply time.
#
# Not scraped by Prometheus until registry-cache.yml is applied, which is the
# larger half of why a full disk went unnoticed for 45 days: /v2/ and /healthz
# are both storage-free probes and answer 200 while content requests 500 under
# ENOSPC.
#
# The host key in ~/.ssh/known_hosts is stale (an old ECDSA entry; the host now
# presents ED25519 SHA256:HbCKsw4vkop9H8+SBUeojo72QeIfoWi9K3D0QhmqhcM), so ssh
# prints REMOTE HOST IDENTIFICATION HAS CHANGED. Pubkey auth still succeeds.
# Refresh the entry before running against it, or Ansible's ssh will refuse:
#   ssh-keygen -R 10.0.20.10 && ssh-keyscan -t ed25519 10.0.20.10 >> ~/.ssh/known_hosts
[registry_cache]
10.0.20.10 ansible_user=wizard ansible_become=true
