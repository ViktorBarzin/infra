# Managed by playbooks/devvm.yml -- edit there, not here.
#
# The kernel already counts IO per cgroup on this box, because the `io`
# controller is delegated into system.slice and user.slice, so every cgroup
# has a populated io.stat whatever this setting says. What DefaultIOAccounting
# adds is systemd surfacing those counters as unit properties, so
# `systemctl show <unit> -p IOReadBytes -p IOWriteBytes` answers for any unit
# rather than needing a walk of /sys/fs/cgroup, and so units whose parent does
# not already delegate `io` get the controller too.
#
# Takes effect for units started after a `systemctl daemon-reexec`; units
# already running keep whatever they were started with.
[Manager]
DefaultIOAccounting=yes
