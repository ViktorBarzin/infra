# Sweep hourly instead of daily.
#
# The stock timer is OnBootSec=15min / OnUnitActiveSec=1d. With the 24h
# retention in /etc/tmpfiles.d/claude-scratch.conf, a daily sweep lets a dead
# Claude session directory live 24-48h, and a day's dead sessions measured
# 2,184 MiB on 2026-09-06 against an 8G RAM-backed /tmp. Hourly narrows that to
# 24-25h and keeps the steady state near one day's worth.
#
# Sweeping more often does not change WHICH entries are eligible: every
# tmpfiles.d rule keeps its own age threshold, so the 10d rule on /tmp stays a
# 10d rule. It only shortens the lag between an entry becoming eligible and
# being removed.
[Timer]
OnUnitActiveSec=1h
