# Bound the Claude Code per-session scratch under /tmp, which is a RAM-backed
# tmpfs on this box.
#
# Layout: /tmp/claude-<uid>/<project-slug>/<session-uuid>/, one directory per
# Claude Code session, holding its scratchpad, tool-result spill files and
# background-task output. Claude Code creates these and never removes them, so
# on 2026-09-06 there were 246 of them holding 4.7 GiB, /tmp was 8.0G of 8.0G
# full, and background commands started dying with ENOSPC on their stdout.
#
# /tmp is `size=8G` tmpfs (/etc/systemd/system/tmp.mount), so every byte here is
# unswappable RAM on a 31.3 GiB box, and those pages are charged to the pane
# that wrote them, against the 6G per-pane cap this playbook sets. A full /tmp
# is therefore a memory problem, not a disk problem, which is why the fix is a
# shorter retention rather than a bigger tmpfs. Moving the scratch to disk was
# considered and rejected: the root filesystem is 96% full with 11 GiB free.
#
# 24h, measured rather than picked: at the time of writing, session directories
# older than a day held 2,184 MiB across 130 dead sessions, while everything
# from the last day was 2,486 MiB across 116. A day also keeps a session
# resumable the next morning with its scratchpad intact.
#
# mM: restricts the age check to modification time, for files and directories.
# The default (abcmABM) also counts access and creation time, which makes the
# rule fire on nothing predictable, since merely reading a file defers its own
# cleanup. Verified 2026-09-06 against a sandbox tree: a session directory whose
# own mtime is 3 days old but which contains ONE recently written file keeps
# that file and both its parent directories, because tmpfiles removes a
# directory only once it is empty. A live session cannot lose recent work.
e /tmp/claude-*/* - - - mM:24h
