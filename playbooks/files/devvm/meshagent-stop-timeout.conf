# Drop-in for meshagent.service (installed by MeshCentral, not this repo).
# meshagent ignores SIGTERM for the whole default 90s stop timeout (measured
# 2026-10-02), so every restart, including the nightly one from
# meshagent-restart.timer, took a minute and a half. 20s, then SIGKILL.
[Service]
TimeoutStopSec=20
