# Managed by playbooks/devvm.yml. Local edits are overwritten.
#
# Overrides /usr/lib/tmpfiles.d/tmp.conf (same basename in /etc replaces it).
#
# WHY 10d instead of the shipped 30d: on 2026-08-17 /tmp held 39,341 entries,
# ~38,400 of them tripit test fixtures up to 26 days old. They were only 1.7 MB
# of data but ~150 MB of tmpfs pages (4K page per file) and had filled the tmpfs
# to 100%, blocking deploys. 10d is the age Ubuntu normally ships for /tmp.
#
# WHY THE EXCLUSIONS: cleaning is by timestamp, and a unix socket's mtime does
# NOT move when it is used — so an actively-attached tmux server whose socket
# dir is older than the age would have its socket unlinked, cutting every client
# off from sessions that are still running. /tmp/tmux-0 and /tmp/tmux-1002 were
# already 22 days old when this was written. systemd's own PrivateTmp roots get
# the same treatment for the same reason.
#
# /tmp is a tmpfs (/etc/systemd/system/tmp.mount, size=8G) so it is empty after a
# reboot regardless; this is what keeps it tidy BETWEEN reboots, via the daily
# systemd-tmpfiles-clean.timer.
x /tmp/tmux-*
x /tmp/systemd-private-*
x /tmp/.X11-unix
x /tmp/.ICE-unix
x /tmp/.font-unix
x /tmp/.XIM-unix
x /tmp/.Test-unix
D /tmp 1777 root root 10d
