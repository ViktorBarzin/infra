# vm.swappiness for the devvm (declared 2026-09-12).
#
# The value is unchanged at 10. What changed is that it is now declared. It had
# been living in two byte-identical files under /etc/sysctl.d/ dated 23 May and
# 8 June, neither of which appeared in any repository and neither of which any
# commit referenced. This file replaces both.
#
# Why 10 and not the kernel's 60: it biases reclaim towards evicting file pages
# rather than swapping anonymous ones, and on this box swap is bounded at 4 GiB
# per user and sits on the same 7200rpm spindle as everything else. Raising it
# would push pressure onto a swap budget that both active users already sit
# pinned against, with two million failed swapout attempts between them.
#
# Known tension, recorded rather than hidden: file eviction is exactly the
# mechanism behind the refaults this work is meant to reduce (609 GiB of file
# refaults against 196 MiB of anon since boot). The floors in
# 50-devvm-resource.conf address that by changing WHOSE pages get evicted. If
# the failed-swapout counts stay in the millions after the floors land, raising
# the per-user swap ceiling is the next lever, with evidence.
vm.swappiness = 10
