# The two devvm locks of the tv app (formerly f1-stream), shared by every user.
# Installed by infra playbooks/devvm.yml.
#
# tv-apk-build.lock serialises TV app (APK) builds: android/scripts/build-apk.sh
# in the tv repo takes it with flock when the file exists, so two builds never
# share one Gradle volume.
#
# tv-release.lock lets one `homelab deploy tv` run at a time (infra
# cli/cmd_deploy_release.go). Two releases at once could push two images or two
# TV builds under one versionCode.
#
# Root-owned and 0666 because /run/lock is a sticky, world-writable directory
# and fs.protected_regular=2 refuses an O_CREAT open of a file there that
# belongs to another user, unless the directory's owner (root) owns it. A
# lock one user created in /var/tmp could not be opened by anyone else.
f /run/lock/tv-apk-build.lock 0666 root root -
f /run/lock/tv-release.lock 0666 root root -
