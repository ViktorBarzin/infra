# Per-task block-IO delay accounting, read by devvm-io-guard from field 42 of
# /proc/<pid>/stat. It ranks scanners by how long they wait on the disk, not
# only by bytes: `du -s` on a cold tree read 7 MB but made 6,100 IOs over 38 s.
# Off by default since kernel 5.14 for its small scheduler overhead.
kernel.task_delayacct = 1
