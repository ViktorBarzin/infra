# The lock that lets one `homelab deploy f1-stream` run at a time across every
# user on the devvm (infra cli/cmd_deploy_release.go). Two releases at once
# could push two images or two TV builds under one versionCode. Installed by
# infra playbooks/devvm.yml.
#
# Root-owned and 0666 for the same reason as f1tv-apk-build.conf: /run/lock is
# sticky and world-writable, and fs.protected_regular=2 refuses an O_CREAT open
# of a file there that another user owns.
f /run/lock/f1-stream-release.lock 0666 root root -
