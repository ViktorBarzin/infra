# Bound the shared playwright-mcp browsers (infra bead code-r725).
#
# On 2026-06-12 a headless Chrome launched by the playwright-shared MCP wedged
# its swiftshader-webgl gpu-process at about 10.5 cores for 6.5 hours on a
# blank page. It dominated this box and the Proxmox host underneath it, and
# starved etcd. The MCP's own browser_close did nothing, because page.close
# does not reach a stuck GPU process; it took an OS-level kill.
#
# CPUQuota is the absolute bound and the reaper (playwright-reaper.timer) is
# the cleanup. The quota alone would have left the box usable through that
# incident but still burning 8 cores indefinitely, and the reaper alone would
# have let it hold 10.5 cores until the next timer tick. Together the damage
# is bounded immediately and cleared within minutes.
#
# 800% of 32 cores is a quarter of the machine. Headless page rendering is
# bursty and rarely needs more than two or three cores even mid-load, so this
# is roughly 3x the observed working peak and well under the 10.5 that caused
# the incident. It is shared by every user's MCP browser, deliberately: the
# thing worth bounding is total damage to the box, and per-user quotas would
# each have to be large enough to be useless.
#
# CPUWeight sits below the default 100 so that under contention this slice
# yields to everything else in system.slice (which itself runs at 200 via
# 50-devvm-priority.conf). The quota is the ceiling; the weight decides who
# loses first when the machine is busy.
[Slice]
CPUAccounting=yes
CPUQuota=800%
CPUWeight=50
