# Parent memory floor for user.slice (2026-09-12).
#
# MemoryLow on a child is capped by what its parent has to give. cgroup v2
# distributes protection downwards, so leaving user.slice at the default 0 would
# pin every user-<uid>.slice to an effective floor of 0 no matter what the
# per-user drop-in declares. This file is what makes 50-devvm-resource.conf
# mean anything.
#
# Sized as the sum of the ACTIVE users' floors, not the enrolled ones: 2 x 8.5
# GiB. That is deliberate and self-balancing. If more users become active than
# the parent budget covers, the kernel scales every child's protection down
# proportionally, which is still an equal share of what protection exists. The
# alternative, summing all four enrolled accounts, would reserve 34 GiB on a
# 31 GiB box and dilute the floors to nothing.
[Slice]
MemoryAccounting=yes
MemoryLow=17G
