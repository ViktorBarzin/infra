# Managed by playbooks/devvm.yml ("Keep the journal in RAM"). Local edits are
# overwritten.
#
# The journal lives in /run, capped at 512M, and is gone after a reboot. Set
# by hand on 2026-06-30 and declared 2026-11-11: the devvm's disk is throttled
# and its IO budget on the Proxmox host is shared with etcd, and promtail ships
# every unit's log to Loki, which is where history is read from.
[Journal]
Storage=volatile
RuntimeMaxUse=512M
Compress=yes
