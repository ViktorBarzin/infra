# Keep the box's nervous system responsive under contention (setup-devvm.sh §10).
#
# MemoryLow added 2026-09-12, and it is not optional once the user slices have
# floors. Protection is relative: protecting the user slices makes everything
# unprotected into the preferred reclaim target, and this slice holds sshd,
# tmux, t3-serve and t3-dispatch. Without a floor here, giving users floors
# would make the way back into the box the first thing evicted. 2 GiB is a
# little under what it currently holds (2.69 GiB).
[Slice]
MemoryAccounting=yes
MemoryLow=2G
CPUAccounting=yes
CPUWeight=200
IOAccounting=yes
IOWeight=200
