# Keep /tmp/jiti a root-owned directory that no other user can write.
#
# pi compiles its extensions through jiti, and jiti caches the compiled code in
# /tmp/jiti. It trusts a cached file by the source hash at the end of the
# file's name, so anyone who can write to that directory can plant code that
# another user's pi then runs as that user. On 2026-09-25 the directory was
# drwxrwxr-x wizard:wizard, left by whichever process happened to create it.
#
# With the directory unwritable, jiti skips its cache and the extension still
# loads; a reviewer checked that before this landed. Anything else on the box
# that uses jiti loses its cache as well, which costs one transpile per start.
#
# Having its own line here also keeps /tmp/jiti out of the 10-day age sweep of
# /tmp in tmp.conf, because tmpfiles skips any path that has an entry of its
# own. Without that, the sweep would eventually remove the empty directory and
# the next user to run jiti would create it again as their own.
#
# systemd-tmpfiles-setup applies this at every boot, before anyone logs in, and
# playbooks/devvm.yml applies it when the playbook runs.
d /tmp/jiti 0755 root root -
