# Managed by playbooks/devvm.yml. Local edits are overwritten.
#
# Build caches under /tmp, aged by modification time only.
#
# /tmp is an 8G tmpfs (tmp.mount). On 2026-11-15 /tmp/node-compile-cache held
# 2.7G in 194,516 files, 141,141 of them with an mtime older than a day: Vite's
# bin calls module.enableCompileCache() with the default directory,
# os.tmpdir()/node-compile-cache, and every fresh clone adds entries for its
# whole node_modules. tmp.conf's 10d rule counts access time too, so an entry
# that is read never ages out. Cloud's round-9 end-to-end test hit ENOSPC in
# the template's Playwright install because of it.
#
# app-kit's export-template made /tmp/app-template-* (about 600M each) and
# never removed them; since round 9 it removes its own, so this catches a run
# that was killed. The emptied directory itself stays until the next boot,
# because tmp.conf skips a path that has its own rule.
#
# mM: modification time only, as in claude-scratch.conf. A lost cache entry
# costs one recompile. The cache stays on the tmpfs on purpose: on disk its IO
# would land on the disk etcd shares. The hourly sweep
# (tmpfiles-clean-hourly.conf) applies it.
e /tmp/node-compile-cache - - - mM:1d
e /tmp/app-template-* - - - mM:1d
