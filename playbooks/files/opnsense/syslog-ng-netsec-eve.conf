# Installed as /usr/local/etc/syslog-ng.conf.d/netsec-eve.conf by
# playbooks/tasks/opnsense/netsec_eve.yml (docs/runbooks/network-ids.md).
# OPNsense's syslog template writes only its own four files in this directory,
# so this one survives a syslog reconfigure.
#
# Tails Suricata's eve-meta.json and sends each line unchanged over TCP to the
# netsec Vector (stacks/netsec, LoadBalancer 10.0.20.211:5140). Reading the file
# directly avoids the 8 KB limit of syslog(3).
#
# Its own source and log path, without flow-control: when Vector is down the
# lines queue in the destination's fifo (100,000 messages) and the oldest are
# dropped after that. The other log paths (Alloy, CrowdSec) never wait on it.

source s_netsec_eve {
    file("/var/log/suricata/eve-meta.json"
        follow-freq(1)
        flags(no-parse)
        log-msg-size(1048576)
        persist-name("netsec_eve_meta")
    );
};

destination d_netsec_vector {
    network("10.0.20.211"
        transport("tcp")
        port(5140)
        ip-protocol(4)
        template("${MSG}\n")
        log-fifo-size(100000)
        time-reopen(10)
        persist-name("netsec_vector")
    );
};

log {
    source(s_netsec_eve);
    destination(d_netsec_vector);
};
