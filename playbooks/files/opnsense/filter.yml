# Generated from pfSense config.xml on 2026-11-04 by scripts/pfsense-to-opnsense.py, then reviewed;
# edit this file, do not regenerate.
# Filter rules in pfSense evaluation order. Semantics follow pfSense:
# - interface rules are quick; floating rules are quick only when quick: true
# - an empty pfSense type became action: pass, a missing ipprotocol became inet
# - source/destination: any | net (interface subnet) | ip (interface address, e.g. wanip)
#   | address | alias | self, with optional port and not
# - linked_nat_rule: pfSense generated this rule from a port forward. On OPNsense a
#   linked rule is created by the port forward (associated_rule: linked), so the
#   playbook should not create these a second time
# - managed_by: the pfSense playbook that owned the rule; profile: production means
#   the rule is not rendered in staging (opt2 WireGuard, opt3 HE gif)

rules:
# Not from pfSense: CrowdSec bans inbound (tasks/opnsense/crowdsec.yml); C2 blocks outbound below.
- description: CrowdSec bans in from WAN (IPv4)
  interface: wan
  floating: false
  direction: in
  action: block
  quick: true
  ipprotocol: inet
  protocol: any
  source:
    alias: crowdsec_blocklists
  destination:
    any: true
  log: false
  disabled: false
- description: CrowdSec bans in from the HE tunnel (IPv6)
  interface: opt3
  floating: false
  direction: in
  action: block
  quick: true
  ipprotocol: inet6
  protocol: any
  source:
    alias: crowdsec6_blocklists
  destination:
    any: true
  log: false
  disabled: false
  profile: production
# Not from pfSense: outbound blocks to abuse.ch botnet C2 addresses our hosts
# reached (network IDS plan, decision 4). Alias crowdsec_c2 is a URL table
# from the C2 blocklist mirror (stacks/crowdsec), which serves only CrowdSec
# decisions of type c2-block. Logged, so a block shows in the filter log.
- description: Block our hosts reaching CrowdSec C2 blocks (VLAN 10)
  interface: lan
  floating: false
  direction: in
  action: block
  quick: true
  ipprotocol: inet46
  protocol: any
  source:
    any: true
  destination:
    alias: crowdsec_c2
  log: true
  disabled: false
- description: Block our hosts reaching CrowdSec C2 blocks (VLAN 20)
  interface: opt1
  floating: false
  direction: in
  action: block
  quick: true
  ipprotocol: inet46
  protocol: any
  source:
    any: true
  destination:
    alias: crowdsec_c2
  log: true
  disabled: false
# Not from pfSense: opted-in machines (alias opted_in, network IDS plan phase 5)
# may not use QUIC, so browsers fall back to TCP 443, which Squid intercepts
# (nat_port_forwards.yml). Rejected rather than dropped so they fall back at once.
- description: Opted-in machines may not use QUIC (VLAN 10)
  interface: lan
  floating: false
  direction: in
  action: reject
  quick: true
  ipprotocol: inet46
  protocol: udp
  source:
    alias: opted_in
  destination:
    any: true
    port: '443'
  log: false
  disabled: false
- description: Opted-in machines may not use QUIC (VLAN 20)
  interface: opt1
  floating: false
  direction: in
  action: reject
  quick: true
  ipprotocol: inet46
  protocol: udp
  source:
    alias: opted_in
  destination:
    any: true
    port: '443'
  log: false
  disabled: false
