# Installed as /usr/local/etc/syslog-ng.conf.d/netsec-proxy.conf by
# playbooks/tasks/opnsense/squid.yml (docs/runbooks/network-ids.md).
#
# Tails Squid's netsec.json (squid-netsec-log.conf) and sends each line unchanged
# over TCP to the netsec Vector (stacks/netsec, 10.0.20.211:5140), which routes
# lines starting {"netsec_kind":"proxy" to netsec.proxy. Its own source,
# destination and log path, without flow-control, like netsec-eve.conf.

source s_netsec_proxy {
    file("/var/log/squid/netsec.json"
        follow-freq(1)
        flags(no-parse)
        log-msg-size(65536)
        persist-name("netsec_proxy_json")
    );
};

destination d_netsec_vector_proxy {
    network("10.0.20.211"
        transport("tcp")
        port(5140)
        ip-protocol(4)
        template("${MSG}\n")
        log-fifo-size(20000)
        time-reopen(10)
        persist-name("netsec_vector_proxy")
    );
};

log {
    source(s_netsec_proxy);
    destination(d_netsec_vector_proxy);
};
