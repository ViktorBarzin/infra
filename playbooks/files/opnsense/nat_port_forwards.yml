# Not from pfSense: Squid's transparent intercept (network IDS plan phase 5).
# Only sources in alias opted_in (empty = nobody) are redirected to Squid's
# loopback listeners: 3129 bumps TLS, 3128 plain HTTP. The linked pass rules
# admit exactly that redirected traffic. No NAT reflection: the redirect is
# only for traffic arriving on VLAN 10 or 20. tasks/opnsense/squid.yml.
- description: Squid intercept HTTPS from opted-in machines (VLAN 10, inet)
  interface: lan
  ipprotocol: inet
  protocol: tcp
  source:
    alias: opted_in
  destination:
    any: true
    port: '443'
  target:
    address: '127.0.0.1'
  local_port: '3129'
  natreflection: disable
  associated_rule: linked
  disabled: false
