# Installed as /usr/local/etc/syslog-ng.conf.d/netsec-haproxy.conf by
# playbooks/tasks/opnsense/haproxy.yml (docs/runbooks/network-ids.md).
#
# HAProxy's mail frontends log one JSON line per connection (log-format in
# playbooks/files/opnsense/haproxy.yml) to syslog-ng's s_all source, which
# OPNsense's own path also writes to /var/log/haproxy/. This path sends those
# lines unchanged over TCP to the netsec Vector (stacks/netsec,
# 10.0.20.211:5140), which routes lines starting {"netsec_kind": "haproxy" to
# netsec.haproxy. Its own destination, without flow-control, like
# netsec-eve.conf.

filter f_netsec_haproxy {
    program("haproxy") and message('^\{"netsec_kind": "haproxy"');
};

destination d_netsec_vector_haproxy {
    network("10.0.20.211"
        transport("tcp")
        port(5140)
        ip-protocol(4)
        template("${MSG}\n")
        log-fifo-size(20000)
        time-reopen(10)
        persist-name("netsec_vector_haproxy")
    );
};

log {
    source(s_all);
    filter(f_netsec_haproxy);
    destination(d_netsec_vector_haproxy);
};
