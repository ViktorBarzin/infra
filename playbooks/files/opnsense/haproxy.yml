# Generated from pfSense config.xml on 2026-11-04 by scripts/pfsense-to-opnsense.py, then reviewed;
# edit this file, do not regenerate.
# HAProxy (os-haproxy). The :2525 test frontend and its pool are left out.
# Bind addresses that were firewall literals are placeholders.

enabled: true
max_connections: 1000
frontends:
- name: mailserver_proxy_25
  description: code-yiu Phase 4/5 - external SMTP (:25) via PROXY v2 -> pod :2525 postscreen
  enabled: true
  mode: tcp
  binds:
  - address: '{{ fw.opt1 }}'
    port: 25
  default_backend: mailserver_nodes_smtp
  acls: []
  actions: []
  # One JSON line per connection, shipped to netsec.haproxy (ClickHouse) by
  # syslog-ng-netsec-haproxy.conf; the clients' real addresses are only here.
  advanced: &netsec_log |-
    log-format "%{+json}o %(netsec_kind)[str(haproxy)] %(ts)[date(0,ms)] %(client_ip)ci %(client_port)cp %(frontend_ip)fi %(frontend_port)fp %(frontend)f %(backend)b %(server)s %(connect_ms)Tc %(duration_ms)Tt %(bytes_in)U %(bytes_out)B %(termination)ts"
- name: mailserver_proxy_465
  description: code-yiu Phase 4/5 - external SMTPS (:465) via PROXY v2 -> pod :4465 smtpd
  enabled: true
  mode: tcp
  binds:
  - address: '{{ fw.opt1 }}'
    port: 465
  default_backend: mailserver_nodes_smtps
  acls: []
  actions: []
  advanced: *netsec_log
- name: mailserver_proxy_587
  description: code-yiu Phase 4/5 - external submission (:587) via PROXY v2 -> pod :5587 smtpd
  enabled: true
  mode: tcp
  binds:
  - address: '{{ fw.opt1 }}'
    port: 587
  default_backend: mailserver_nodes_sub
  acls: []
  actions: []
  advanced: *netsec_log
- name: mailserver_proxy_993
  description: code-yiu Phase 4/5 - external IMAPS (:993) via PROXY v2 -> pod :10993 Dovecot
  enabled: true
  mode: tcp
  binds:
  - address: '{{ fw.opt1 }}'
    port: 993
  default_backend: mailserver_nodes_imaps
  acls: []
  actions: []
  advanced: *netsec_log
- name: internal_https_443
  description: 'SNI-routed internal 443: hostname->Traefik (proxy-v2), no-SNI/pfsense.*->webgui:8443'
  enabled: true
  mode: tcp
  binds:
  - address: '{{ fw.opt1 }}'
    port: 443
  - address: '{{ fw.lan }}'
    port: 443
  default_backend: pfsense_webgui_8443
  acls:
  - name: sni_pfsense
    expression: custom
    value: req.ssl_sni -i -m str pfsense.viktorbarzin.lan pfsense.viktorbarzin.me opnsense.viktorbarzin.lan opnsense.viktorbarzin.me
  - name: sni_any
    expression: custom
    value: req.ssl_sni -m found
  actions:
  - action: use_backend
    backend: pfsense_webgui_8443
    acl: sni_pfsense
  - action: use_backend
    backend: webgui_traefik_443
    acl: sni_any
  advanced: |-
    tcp-request inspect-delay 5s
      tcp-request content accept if { req.ssl_hello_type 1 } || !{ req.ssl_hello_type 1 }
