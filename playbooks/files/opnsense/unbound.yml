# Generated from pfSense config.xml on 2026-11-04 by scripts/pfsense-to-opnsense.py, then reviewed;
# edit this file, do not regenerate.
# Unbound DNS resolver. Interfaces are pfSense keys, so the addresses follow the profile.

enabled: true
port: 53
listen_interfaces:
- lan
- opt1
- wan
- lo0
outgoing_interfaces:
- all
dnssec: true
harden_dnssec_stripped: true
serve_expired: true
serve_expired_ttl: 259200
prefetch: true
prefetch_key: true
hide_identity: true
hide_version: true
register_dhcp_leases: true
register_dhcp_static: false
dns_rebind_protection: false
forwarding:
  enabled: true
  use_tls: true
  servers:
  - address: 1.1.1.1
    tls_hostname: cloudflare-dns.com
  - address: 1.0.0.1
    tls_hostname: cloudflare-dns.com
host_overrides: []
domain_overrides:
- domain: viktorbarzin.me
  server: 10.0.20.201
  description: 'Forward zone to Technitium internal split-horizon (serves live Traefik IP for ingress hosts; no per-client DNS config needed). 2026-06-10, runbook: pfsense-unbound.md'
  forward_tls_upstream: false
private_domains:
- viktorbarzin.me
insecure_domains:
- viktorbarzin.me
system_domain_local_zone_type: transparent
access_lists:
- name: WireGuard
  action: allow
  description: WireGuard Unbound ACL (DO NOT EDIT/DELETE!)
  networks:
  - 10.3.0.1/32
  profile: production
auth_zone:
  name: viktorbarzin.lan
  primary: 10.0.20.201
  zonefile: viktorbarzin.lan.zone
  url: null
  allow_notify: 10.0.20.201
  fallback_enabled: true
  for_downstream: true
  for_upstream: true
advanced:
  msgcachesize_mb: 256
  outgoing_num_tcp: 10
  incoming_num_tcp: 10
  edns_buffer_size: auto
  num_queries_per_thread: 512
  jostle_timeout: 200
  cache_max_ttl: 604800
  cache_min_ttl: 60
  infra_host_ttl: 900
  infra_cache_numhosts: 200000
  infra_keep_probing: true
  unwanted_reply_threshold: disabled
  sock_queue_timeout: 0
  log_verbosity: 1
custom_server_options: {}
