# Installed as /usr/local/etc/squid/post-auth/netsec-log.conf by
# playbooks/tasks/opnsense/squid.yml (docs/runbooks/network-ids.md). The os-squid
# template includes post-auth/*.conf and only ever writes dummy.conf there.
#
# One JSON line per request for opted-in machines, read by syslog-ng and sent
# to the netsec Vector (netsec.proxy). No Referer, no cookies; %ru has its query
# string stripped (strip_query_terms, on by default; a bare "?" stays). The %"
# codes escape quotes and backslashes in the value (they do not add the
# surrounding quotes), so a header with quotes cannot break the JSON.
# The plugin's own access log is off (logging.enable.accessLog 0), which makes
# the template add "access_log none" further down; this line comes first, and
# Squid logs to every access_log line it meets before a "none".
# Squid wants one plain forward-proxy port next to the intercept ports (it logs
# "No forward-proxy ports configured" otherwise, and builds error-page URLs on
# it). Loopback only, so nothing on the network can use Squid as a proxy.
http_port 127.0.0.1:3130

logformat netsec {"netsec_kind":"proxy","ts":%ts.%03tu,"client_ip":"%>a","method":"%rm","host":"%">rd","url":"%"ru","sni":"%"ssl::>sni","bump_mode":"%ssl::bump_mode","status":%>Hs,"bytes":%<st,"duration_ms":%tr,"squid_status":"%Ss","server_ip":"%<a","user_agent":"%"{User-Agent}>h"}
access_log daemon:/var/log/squid/netsec.json netsec
