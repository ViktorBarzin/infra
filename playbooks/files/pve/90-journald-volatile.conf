# Managed by playbooks/pve-host.yml -- edit there, not here.
#
# journald in RAM, 2026-09-13. Measured on this host: 258.9 GB written over
# 57.6 days of uptime = 4.5 GB/day, confirmed by two live samples at 4.6 and
# 6.1 GB/day, with 3.9 GB sitting in /var/log/journal. Those writes land on
# pve-root, which is on sdc, the contended spindle. In a live 60-second sample
# pve-root was 30 writes/s, 15% of the whole thin pool.
#
# The same change was made to the k8s nodes on 2026-06-30 under bead code-oflt
# and cut node5's OS-disk writes by about 94%. The PVE host itself was never
# included, so it has been the last persistent journal on the box.
#
# Safe because the journal is already shipped to Loki: the `pve-journal` job
# gives 30 days of searchable history, far more than the 3.9 GB ring buffer
# held locally. The trade is that a hard crash loses whatever had not shipped
# yet, which is the same trade already accepted on every node.
#
# Sized at 200M to match the nodes. It matters more here than there: snoopy,
# the execve auditor loaded through /etc/ld.so.preload with an empty
# filter_chain, writes 8,862 of this host's 11,646 journal lines per hour, 76%
# of the total. That volume now costs RAM rather than sdc, and RuntimeMaxUse
# is the ceiling that keeps it bounded.
[Journal]
Storage=volatile
RuntimeMaxUse=200M
Compress=yes
