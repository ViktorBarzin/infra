            proxy_set_header Host $host;
            proxy_set_header Connection "";

            proxy_cache off;

            proxy_read_timeout 900;
            proxy_send_timeout 900;
        }

        location @upstream_error {
            return 502 "upstream error";
        }

        # See the :5000 block for why this is a manifest fetch and not /v2/.
        # A pinned immutable tag on a repo the cluster actually pulls; this exact
        # request was the one measured returning 500 under ENOSPC and 200 after
