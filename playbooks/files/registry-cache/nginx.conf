worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    proxy_cache_path /var/cache/nginx/registry
        levels=1:2
        keys_zone=registry:500m
        max_size=50g
        inactive=24h
        use_temp_path=off;

    log_format registry '$remote_addr [$time_local] "$request" '
                        '$status $body_bytes_sent '
                        'upstream=$upstream_addr time=$upstream_response_time '
                        'cache=$upstream_cache_status';

    access_log /var/log/nginx/access.log registry;

    # --- Upstreams ---

    upstream dockerhub {
        server registry-dockerhub:5000;
        keepalive 32;
    }

    upstream ghcr {
        server registry-ghcr:5000;
        keepalive 32;
    }

    # Added 2026-09-02. These three backends have been running healthy since
    # 2026-07-18 with no route to them: docker-compose publishes 5020, 5030 and
    # 5040, iptables DNATs all three, and node4 and node5 both list
    # 10.0.20.10:5020 (quay.io) and :5030 (registry.k8s.io) in their
    # /etc/containerd/certs.d. nginx had no upstream and no server block, so every
    # one of those pulls hit a refused connection, waited, then fell back to the
    # internet. registry-quay logged 130,476 requests since 2026-07-18, every one
    # from its own healthcheck. That is why an alertmanager quay.io pull measured
    # four minutes.
    upstream quay {
        server registry-quay:5000;
        keepalive 32;
    }

    upstream k8sgcr {
        server registry-k8s:5000;
        keepalive 32;
    }

    upstream kyverno {
        server registry-kyverno:5000;
        keepalive 32;
    }

    # The dockerhub container's debug listener, for /healthz/storage. Declared in
    # config-dockerhub.yml as `http.debug.addr: ":5001"`; docker-compose also
    # publishes it as 5001 on the host, which is what `curl
    # http://10.0.20.10:5001/debug/health` hits.
    upstream dockerhub_debug {
        server registry-dockerhub:5001;
        keepalive 4;
    }

    # `upstream private` removed in Phase 4 of forgejo-registry-consolidation
    # 2026-05-07. The /v2/ private registry is now Forgejo at
    # forgejo.viktorbarzin.me/viktor/.

    # --- Docker Hub (port 5000) ---

    server {
        listen 5000;
        server_name _;

        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering on;

        # Blobs are content-addressed (sha256) — immutable, safe to cache aggressively
        location ~ /v2/.*/blobs/ {
            proxy_pass http://dockerhub;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";

            # Reject truncated upstream responses
            proxy_intercept_errors on;
            error_page 502 503 504 = @upstream_error;

            proxy_cache registry;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 5m;
            proxy_cache_lock_age 5m;
            proxy_cache_use_stale updating;
            proxy_cache_valid 200 24h;
            proxy_cache_valid any 0;
            proxy_cache_min_uses 2;
            proxy_cache_methods GET;

            proxy_read_timeout 900;
            proxy_send_timeout 900;
        }

        # Manifests are mutable (tags can change) — no cache, pass through to registry
        location /v2/ {
            proxy_pass http://dockerhub;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";

            proxy_cache off;

            proxy_read_timeout 900;
            proxy_send_timeout 900;
        }

        location @upstream_error {
            return 502 "upstream error";
        }

        # A REAL content request, not a storage-free one.
        #
        # This used to be `proxy_pass http://dockerhub/v2/;`, and /v2/ answers 200
        # without touching the storage driver. That is why this VM sat at 100%
        # disk for 45 days with nothing noticing. Proven live 2026-09-02: with 0
        # bytes free, a manifest GET returned 500 carrying
        #   {"Op":"write","Path":".../_manifests/tags/latest/...","Err":28}
        # (errno 28 = ENOSPC) while /v2/ AND the old /healthz on the same port
        # both returned 200. A manifest fetch through a pull-through cache writes
        # a tag link, so it exercises storage — which is the whole point.
        #
        # A pinned TAG rather than a pinned digest, on purpose: a digest can be
        # garbage-collected out from under the probe and then 404s forever, while
        # a tag miss is simply re-fetched from upstream. To change what is probed,
        # edit this line and its :5010 twin below; nothing else references them.
        location = /healthz {
            proxy_pass http://dockerhub/v2/library/alpine/manifests/latest;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header Accept "application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json";
            proxy_read_timeout 15s;
            proxy_connect_timeout 3s;
            access_log off;
        }

        # Second, cheaper storage probe: the registry's own storagedriver health
        # check, which writes and reads a file and so fails under ENOSPC. Already
        # enabled by `health.storagedriver` in config-dockerhub.yml, exposed on
        # that container's debug listener (`http.debug.addr: ":5001"`). Returns
        # 200 with `{}` when every check passes, 503 naming the failing check
        # otherwise. Verified 200 `{}` live 2026-09-02.
        #
        # There is no :5010 twin because config-ghcr.yml has no `http.debug`
        # section. Adding one there would give ghcr the same probe; it was left
        # alone so the six config-*.yml files stay a faithful copy of the box.
        location = /healthz/storage {
            proxy_pass http://dockerhub_debug/debug/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_read_timeout 10s;
            proxy_connect_timeout 3s;
            access_log off;
        }

        location / {
            return 200 'ok';
            add_header Content-Type text/plain;
        }
    }

    # --- GHCR (port 5010) ---

    server {
        listen 5010;
        server_name _;

        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering on;

        # Cloud App images, ghcr.io/viktorbarzin/cloud-<project>_<app> (cloud
        # backlog B36). They are private, so registry-ghcr-cloud holds Cloud's
        # read:packages token. That token reads EVERY private package of the
        # account, so these two locations are the only way to it: only this
        # name shape, only GET and HEAD, only references by digest, and only
        # from the six k8s nodes. Anyone else gets 403, and a node then falls
        # back to ghcr.io with the pod's own pull secret.
        #
        # The node addresses do not tell tenants apart: the kubelet pulls for
        # every pod on its node, so any namespace on the cluster could ask for
        # a Cloud App image. What keeps them out is the digest: a manifest is
        # served only by sha256, which nobody outside Cloud knows (Cloud runs
        # every App by digest), while tags are commit shas, public for a
        # public repo. Project pods never get here: stacks/cloud's egress
        # floor denies them 10.0.0.0/8.
        #
        # Regex locations are matched in order, so these come before the
        # generic blob location below. A regex with braces must be quoted, and
        # \z (not $) ends it, so a decoded newline in the path cannot match.
        # proxy_pass sends the normalised $uri, never the raw request line, so
        # the path the registry sees is the path matched here. The backend is
        # a variable resolved at request time (Docker's DNS, 127.0.0.11), so
        # nginx starts and serves every other mirror even when
        # registry-ghcr-cloud is missing or unhealthy; these paths then answer
        # 502 and the node falls back to ghcr.io.
        location ~ "^/v2/viktorbarzin/cloud-[a-z0-9-]+_[a-z0-9-]+/blobs/sha256:[0-9a-f]{64}\z" {
            allow 10.0.20.100;
            allow 10.0.20.101;
            allow 10.0.20.102;
            allow 10.0.20.103;
            allow 10.0.20.104;
            allow 10.0.20.105;
            deny all;
            limit_except GET HEAD { deny all; }

            resolver 127.0.0.11 valid=30s ipv6=off;
            set $ghcr_cloud registry-ghcr-cloud:5000;
            proxy_pass http://$ghcr_cloud$uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";

            proxy_intercept_errors on;
            error_page 502 503 504 = @upstream_error;

            proxy_cache registry;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 5m;
            proxy_cache_lock_age 5m;
            proxy_cache_use_stale updating;
            proxy_cache_valid 200 24h;
            proxy_cache_valid any 0;
            proxy_cache_min_uses 2;
            proxy_cache_methods GET;

            proxy_read_timeout 900;
            proxy_send_timeout 900;
        }

        location ~ "^/v2/viktorbarzin/cloud-[a-z0-9-]+_[a-z0-9-]+/manifests/sha256:[0-9a-f]{64}\z" {
            allow 10.0.20.100;
            allow 10.0.20.101;
            allow 10.0.20.102;
            allow 10.0.20.103;
            allow 10.0.20.104;
            allow 10.0.20.105;
            deny all;
            limit_except GET HEAD { deny all; }

            resolver 127.0.0.11 valid=30s ipv6=off;
            set $ghcr_cloud registry-ghcr-cloud:5000;
            proxy_pass http://$ghcr_cloud$uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";

            proxy_cache off;

            proxy_read_timeout 900;
            proxy_send_timeout 900;
        }

        # Any other path of an App image name (a manifest by tag, tags/list,
        # odd references) reaches neither ghcr registry. Names without "_", such as Cloud's
        # own ghcr.io/viktorbarzin/cloud-reconciler, are not App images and
        # stay on the generic locations below.
        location ~ ^/v2/viktorbarzin/cloud-[^/]*_ {
            return 403;
        }

        # Blobs are content-addressed (sha256) — immutable, safe to cache aggressively
        location ~ /v2/.*/blobs/ {
            proxy_pass http://ghcr;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";

            # Reject truncated upstream responses
            proxy_intercept_errors on;
            error_page 502 503 504 = @upstream_error;

            proxy_cache registry;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 5m;
            proxy_cache_lock_age 5m;
            proxy_cache_use_stale updating;
            proxy_cache_valid 200 24h;
            proxy_cache_valid any 0;
            proxy_cache_min_uses 2;
            proxy_cache_methods GET;

            proxy_read_timeout 900;
            proxy_send_timeout 900;
        }

        # Manifests are mutable (tags can change) — no cache, pass through to registry
        location /v2/ {
            proxy_pass http://ghcr;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";

            proxy_cache off;

            proxy_read_timeout 900;
            proxy_send_timeout 900;
        }

        location @upstream_error {
            return 502 "upstream error";
        }

        # See the :5000 block for why this is a manifest fetch and not /v2/.
        # A pinned immutable tag on a repo the cluster actually pulls. This probed
        # an immich manifest until 2026-09-03, which only worked because this
        # cache was misconfigured to front ghcr.io; on reg.kyverno.io that path
        # does not exist, so it now names an image the cluster really runs.
        location = /healthz {
            proxy_pass http://ghcr/v2/immich-app/immich-machine-learning/manifests/v3.1.0-cuda;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header Accept "application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json";
            proxy_read_timeout 15s;
            proxy_connect_timeout 3s;
            access_log off;
        }

        location / {
            return 200 'ok';
            add_header Content-Type text/plain;
        }
    }

    # quay.io. Same shape as the ghcr block: blobs are content-addressed so they
    # cache, manifests are mutable so they pass through.
    server {
        listen 5020;
        server_name _;

        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering on;

        # Blobs are content-addressed (sha256) — immutable, safe to cache aggressively
        location ~ /v2/.*/blobs/ {
            proxy_pass http://quay;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";

            # Reject truncated upstream responses
            proxy_intercept_errors on;
            error_page 502 503 504 = @upstream_error;

            proxy_cache registry;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 5m;
            proxy_cache_lock_age 5m;
            proxy_cache_use_stale updating;
            proxy_cache_valid 200 24h;
            proxy_cache_valid any 0;
            proxy_cache_min_uses 2;
            proxy_cache_methods GET;

            proxy_read_timeout 900;
            proxy_send_timeout 900;
        }

        # Manifests are mutable (tags can change) — no cache, pass through to registry
        location /v2/ {
            proxy_pass http://quay;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";

            proxy_cache off;

            proxy_read_timeout 900;
            proxy_send_timeout 900;
        }

        location @upstream_error {
            return 502 "upstream error";
        }

        # See the :5000 block for why this is a manifest fetch and not /v2/.
        # A pinned immutable tag on a repo the cluster actually pulls (Traefik's
        # node-exporter sidecar). Until 2026-10-17 this probed the immich image
        # copied from the :5010 block, which does not exist on quay.io, so it
        # answered 404 whatever the disk state.
        location = /healthz {
            proxy_pass http://quay/v2/prometheus/node-exporter/manifests/v1.12.1;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header Accept "application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json";
            proxy_read_timeout 15s;
            proxy_connect_timeout 3s;
            access_log off;
        }

        location / {
            return 200 'ok';
            add_header Content-Type text/plain;
        }
    }

    # registry.k8s.io. Same shape as the ghcr block: blobs are content-addressed so they
    # cache, manifests are mutable so they pass through.
    server {
        listen 5030;
        server_name _;

        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering on;

        # Blobs are content-addressed (sha256) — immutable, safe to cache aggressively
        location ~ /v2/.*/blobs/ {
            proxy_pass http://k8sgcr;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";

            # Reject truncated upstream responses
            proxy_intercept_errors on;
            error_page 502 503 504 = @upstream_error;

            proxy_cache registry;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 5m;
            proxy_cache_lock_age 5m;
            proxy_cache_use_stale updating;
            proxy_cache_valid 200 24h;
            proxy_cache_valid any 0;
            proxy_cache_min_uses 2;
            proxy_cache_methods GET;

            proxy_read_timeout 900;
            proxy_send_timeout 900;
        }

        # Manifests are mutable (tags can change) — no cache, pass through to registry
        location /v2/ {
            proxy_pass http://k8sgcr;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";

            proxy_cache off;

            proxy_read_timeout 900;
            proxy_send_timeout 900;
        }

        location @upstream_error {
            return 502 "upstream error";
        }

        # See the :5000 block for why this is a manifest fetch and not /v2/.
        # A pinned immutable tag on a repo the cluster actually pulls
        # (external-dns). Until 2026-10-17 this probed the immich image copied
        # from the :5010 block, which does not exist on registry.k8s.io, so it
        # answered 404 whatever the disk state.
        location = /healthz {
            proxy_pass http://k8sgcr/v2/external-dns/external-dns/manifests/v0.23.0;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header Accept "application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json";
            proxy_read_timeout 15s;
            proxy_connect_timeout 3s;
            access_log off;
        }

        location / {
            return 200 'ok';
            add_header Content-Type text/plain;
        }
    }

    # reg.kyverno.io. Same shape as the ghcr block: blobs are content-addressed so they
    # cache, manifests are mutable so they pass through.
    server {
        listen 5040;
        server_name _;

        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering on;

        # Blobs are content-addressed (sha256) — immutable, safe to cache aggressively
        location ~ /v2/.*/blobs/ {
            proxy_pass http://kyverno;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";

            # Reject truncated upstream responses
            proxy_intercept_errors on;
            error_page 502 503 504 = @upstream_error;

            proxy_cache registry;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 5m;
            proxy_cache_lock_age 5m;
            proxy_cache_use_stale updating;
            proxy_cache_valid 200 24h;
            proxy_cache_valid any 0;
            proxy_cache_min_uses 2;
            proxy_cache_methods GET;

            proxy_read_timeout 900;
            proxy_send_timeout 900;
        }

        # Manifests are mutable (tags can change) — no cache, pass through to registry
        location /v2/ {
            proxy_pass http://kyverno;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";

            proxy_cache off;

            proxy_read_timeout 900;
            proxy_send_timeout 900;
        }

        location @upstream_error {
            return 502 "upstream error";
        }

        # See the :5000 block for why this is a manifest fetch and not /v2/.
        # A pinned immutable tag on a repo the cluster actually pulls; this exact
        # request was the one measured returning 500 under ENOSPC and 200 after
        # the disk recovered, 35 minutes apart, on 2026-09-02.
        location = /healthz {
            proxy_pass http://kyverno/v2/kyverno/kyverno/manifests/v1.18.2;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header Accept "application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json";
            proxy_read_timeout 15s;
            proxy_connect_timeout 3s;
            access_log off;
        }

        location / {
            return 200 'ok';
            add_header Content-Type text/plain;
        }
    }

    # --- Private R/W Registry (port 5050) decommissioned Phase 4 2026-05-07 ---
    # The TLS port 5050 server block previously fronted `registry-private`.
    # Migrated to Forgejo at forgejo.viktorbarzin.me/viktor/. Both
    # docker-compose.yml and this nginx config no longer reference port 5050.
}
