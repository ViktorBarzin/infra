    # registry.k8s.io. Same shape as the ghcr block: blobs are content-addressed so they
    # cache, manifests are mutable so they pass through.
    server {
        listen 5030;
        server_name _;

        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering on;

        # Blobs are content-addressed (sha256) — immutable, safe to cache aggressively
        location ~ /v2/.*/blobs/ {
            proxy_pass http://k8sgcr;
            proxy_http_version 1.1;
