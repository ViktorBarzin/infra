            proxy_cache off;

            proxy_read_timeout 900;
            proxy_send_timeout 900;
        }

        location @upstream_error {
            return 502 "upstream error";
        }

        # See the :5000 block for why this is a manifest fetch and not /v2/.
        # A pinned immutable tag on a repo the cluster actually pulls; this exact
        # request was the one measured returning 500 under ENOSPC and 200 after
        # the disk recovered, 35 minutes apart, on 2026-09-02.
        location = /healthz {
            proxy_pass http://quay/v2/immich-app/immich-machine-learning/manifests/v3.1.0-cuda;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header Accept "application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json";
            proxy_read_timeout 15s;
            proxy_connect_timeout 3s;
            access_log off;
