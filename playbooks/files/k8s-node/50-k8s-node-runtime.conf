# Managed by playbooks/k8s-node-tuning.yml (play "Kubernetes node security
# patching"). Do not edit on the node.
#
# needrestart runs after every dpkg transaction and, on Ubuntu, restarts in
# automatic mode any service whose processes map an upgraded library.
# containerd.service's cgroup holds every containerd-shim on the node, so it
# is flagged on almost every package. unattended-upgrades installs one package
# per dpkg run, so a 143-package catch-up on k8s-node5 (2026-10-18, infra#128)
# restarted containerd about 63 times in 35 minutes: the kubelet kept losing the
# runtime socket, the node went NotReady and new pods stuck in Unknown.
#
# With override_rc = 0 needrestart lists these units as "deferred" instead of
# restarting them. The same upgrades write /var/run/reboot-required, and kured
# picks up the new libraries at the node's next gated reboot.
$nrconf{override_rc}{qr(^containerd\.service$)} = 0;
$nrconf{override_rc}{qr(^kubelet\.service$)} = 0;
