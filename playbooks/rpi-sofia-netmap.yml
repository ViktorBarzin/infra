---
# playbooks/rpi-sofia-netmap.yml
#
# The Vermont complex alias on rpi-sofia: 10.77.1.0/24 maps 1:1 onto the
# complex network (192.168.1.0/24 inside netns guestns), and only the listed
# sources may use it.
#
# WHY: Emil's session placed vermont-netmap.sh and its unit on the Pi by hand
# on 2026-10-17 for iVMS on VM 300, and iVMS runs there. The devvm and, for
# the access-event archive, the k8s nodes reach the alias through an OPNsense
# route. A rebuilt Pi (an ageing SD card, see
# docs/architecture/monitoring.md) must get it back from here.
#
# Scope: the complex network on the Pi. The first play declares the camera
# network (netns guestns, camera_net_setup2.sh, camera-net.service) and the two
# socat relays into guestns, copied byte for byte from the live Pi on
# 2026-11-11 (infra#121), and the restricted SSH key the B4 watchdog add-on on
# ha-sofia uses for the intercom relay (tag intercom_watch); the second
# declares vermont-netmap. The rest of the
# Pi (promtail, watchdogs, timers, MQTT monitor) is still configured by hand.
#
# RUN (from repo root; claim presence first:
#      presence claim host:rpi-sofia --purpose "vermont-netmap"):
#   dry-run : ansible-playbook -i playbooks/inventory.ini playbooks/rpi-sofia-netmap.yml --check --diff
#   apply   : ansible-playbook -i playbooks/inventory.ini playbooks/rpi-sofia-netmap.yml
#
# Safety: the rules match only traffic to 10.77.1.0/24 leaving through
# veth-host, so Frigate, HA and the existing DNAT ports are not on their path.
# The full rule set is saved before every change under
# /home/pi/netbackup-<timestamp>-ansible/, restorable with iptables-restore
# (host) and `ip netns exec guestns iptables-restore` (guestns).

- name: rpi-sofia camera network and relays
  # camera-net is the only path from the home LAN to the complex network:
  # HA's Vermont cameras, Frigate, the Solarman inverter (FV-B), the relays
  # below and vermont-netmap all ride on it. Its stop action deletes netns
  # guestns, so this play never restarts it. A changed script or unit is
  # installed and reported; restart it by hand at a quiet moment, with a
  # second way into the Pi open (pi@192.168.1.16, wlan0):
  #   sudo systemctl restart camera-net vermont-netmap
  # The relays only serve SSH tunnels from the devvm, so they restart on
  # change.
  hosts: rpi_sofia
  gather_facts: false
  become: true
  vars:
    camera_relays:
      # 10.200.1.2:8134 -> .134:8000, Emil's B4 intercom SDK port (x86-only SDK
      # reaches it over an SSH tunnel)
      - intercom-sdk-proxy
      # 10.200.1.2:8115 -> .115:80, entrance panel "VTORI VHOD"
      - panel115-proxy
    # emo's B4 watchdog, the intercom_watch add-on on ha-sofia
    # (ebarzin/vermont-device-configs, ha-addon/). Its own key, which may only
    # forward to the intercom relay and read the B4's BootTime (b4-boottime is
    # the forced command). The private half is in Vault,
    # secret/emo/intercom-b4 field ha_addon_ssh_key, and in the add-on options.
    intercom_watch_ssh_pubkey: >-
      ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIG19heQWjlM1EOGUYbvHlc/gqU5cMS5Dqj/wP2ijrnWm intercom-watch@ha-sofia

  tasks:
    - name: Install socat for the relays
      ansible.builtin.apt:
        name: socat
        state: present

    - name: Script directory
      ansible.builtin.file:
        path: /home/pi/vermont_cameras
        state: directory
        mode: "0755"
        owner: pi
        group: pi

    - name: Install camera_net_setup2.sh
      ansible.builtin.copy:
        src: files/rpi-sofia/camera_net_setup2.sh
        dest: /home/pi/vermont_cameras/camera_net_setup2.sh
        mode: "0755"
        owner: pi
        group: pi
      register: camera_script

    - name: Install camera-net.service
      # Owned by pi on the live Pi since the 2026-07-28 rebuild; kept as found
      # so a check run stays a no-op.
      ansible.builtin.copy:
        src: files/rpi-sofia/camera-net.service
        dest: /etc/systemd/system/camera-net.service
        mode: "0644"
        owner: pi
        group: pi
      register: camera_unit

    - name: Install the relay units
      ansible.builtin.copy:
        src: "files/rpi-sofia/{{ item }}.service"
        dest: "/etc/systemd/system/{{ item }}.service"
        mode: "0644"
        owner: root
        group: root
      loop: "{{ camera_relays }}"
      register: relay_units

    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true
      when: camera_unit.changed or relay_units.changed

    - name: Enable camera-net (not restarted, see the play comment)
      ansible.builtin.systemd:
        name: camera-net.service
        enabled: true

    - name: Tell the operator camera-net needs a restart by hand
      ansible.builtin.debug:
        msg: >-
          camera_net_setup2.sh or camera-net.service changed and was installed,
          but the running rules are the old ones. Restart by hand at a quiet
          moment: sudo systemctl restart camera-net vermont-netmap
      when: camera_script.changed or camera_unit.changed

    - name: Enable and start the relays
      ansible.builtin.systemd:
        name: "{{ item }}.service"
        enabled: true
        state: started
      loop: "{{ camera_relays }}"

    - name: Restart a relay whose unit changed
      ansible.builtin.systemd:
        name: "{{ item.item }}.service"
        state: restarted
      loop: "{{ relay_units.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.changed

    - name: Install b4-boottime, the forced command of the intercom_watch key
      ansible.builtin.copy:
        src: files/rpi-sofia/b4-boottime
        dest: /usr/local/bin/b4-boottime
        mode: "0755"
        owner: root
        group: root
      tags: [intercom_watch]

    - name: Authorize the intercom_watch add-on key, restricted to its tunnel
      ansible.posix.authorized_key:
        user: pi
        key: "{{ intercom_watch_ssh_pubkey }}"
        key_options: >-
          restrict,port-forwarding,permitopen="10.200.1.2:8134",command="/usr/local/bin/b4-boottime"
        state: present
        exclusive: false
      tags: [intercom_watch]

- name: rpi-sofia vermont-netmap
  hosts: rpi_sofia
  gather_facts: false
  become: true
  vars:
    vermont_alias_cidr: 10.77.1.0/24
    vermont_real_cidr: 192.168.1.0/24
    vermont_guest_veth_ip: 10.200.1.2
    vermont_pfsense_wan: 192.168.1.2
    # Keep in step with $CLIENTS in files/pfsense-vermont-alias-config.php.
    # pfSense does not NAT traffic to the alias, so these are real addresses.
    vermont_allowed_sources:
      # The k8s nodes were removed on 2026-10-19 with the cluster iVMS, and
      # came back on 2026-11-11 for the weekly access-event archive
      # (stacks/vermont-access, infra#176), limited to the seven access
      # devices on TCP 80. Keep them in step with the OPNsense aliases
      # vermont_acs_pollers and vermont_acs_devices.
      - { cidr: 192.168.1.230, why: "VM 300, runs iVMS-4200 (infra#121)" }
      - { cidr: 10.0.10.10, why: "devvm", via_pfsense: true }
      - { cidr: 10.0.20.100, why: "k8s-master", via_pfsense: true, dst_range: "10.77.1.111-10.77.1.117", tcp_port: 80 }
      - { cidr: 10.0.20.101, why: "k8s-node1", via_pfsense: true, dst_range: "10.77.1.111-10.77.1.117", tcp_port: 80 }
      - { cidr: 10.0.20.102, why: "k8s-node2", via_pfsense: true, dst_range: "10.77.1.111-10.77.1.117", tcp_port: 80 }
      - { cidr: 10.0.20.103, why: "k8s-node3", via_pfsense: true, dst_range: "10.77.1.111-10.77.1.117", tcp_port: 80 }
      - { cidr: 10.0.20.104, why: "k8s-node4", via_pfsense: true, dst_range: "10.77.1.111-10.77.1.117", tcp_port: 80 }
      - { cidr: 10.0.20.105, why: "k8s-node5", via_pfsense: true, dst_range: "10.77.1.111-10.77.1.117", tcp_port: 80 }

  tasks:
    - name: Render the script
      ansible.builtin.template:
        src: files/rpi-sofia/vermont-netmap.sh.j2
        dest: /usr/local/sbin/vermont-netmap.sh
        mode: "0755"
        owner: root
        group: root
      register: script

    - name: Install the unit
      ansible.builtin.copy:
        src: files/rpi-sofia/vermont-netmap.service
        dest: /etc/systemd/system/vermont-netmap.service
        mode: "0644"
        owner: root
        group: root
      register: unit

    - name: Save the current rules before changing them
      ansible.builtin.shell: |
        set -eu
        d=/home/pi/netbackup-$(date +%Y%m%d-%H%M%S)-ansible
        mkdir -p "$d"
        iptables-save > "$d/host.rules"
        ip netns exec guestns iptables-save > "$d/guestns.rules"
        ip route > "$d/host.routes"
        chown -R pi:pi "$d"
        echo "$d"
      register: backup
      when: script.changed or unit.changed

    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true
      when: unit.changed

    - name: Enable the unit
      ansible.builtin.systemd:
        name: vermont-netmap.service
        enabled: true

    - name: Re-apply the rules
      # restart = stop (removes the legacy rule too) then start with the new
      # allowlist. Only traffic to the alias is briefly unfiltered-out, i.e.
      # dropped for a moment with no route.
      ansible.builtin.systemd:
        name: vermont-netmap.service
        state: restarted
      when: script.changed or unit.changed

    - name: Read the live rules
      ansible.builtin.command: /usr/local/sbin/vermont-netmap.sh status
      register: status
      changed_when: false
      check_mode: false

    - name: Assert the alias is live with the expected allowlist
      ansible.builtin.assert:
        that:
          - "'10.77.1.0/24 via 10.200.1.2 dev veth-host' in status.stdout"
          - "'-i eth1 -o veth-host -j VERMONT_NETMAP' in status.stdout"
          - "'10.0.10.10 via 192.168.1.2 dev eth1' in status.stdout"
          - "'10.0.20.101 via 192.168.1.2 dev eth1' in status.stdout"
          # iptables -S may reorder the matches, so only their presence is checked.
          - "status.stdout is search('-s 10.0.20.101/32 .*--dst-range 10.77.1.111-10.77.1.117 .*--dport 80 -j RETURN')"
          - "'NETMAP --to 192.168.1.0/24' in status.stdout"
          - "status.stdout_lines | select('search', '-A VERMONT_NETMAP -s') | list | length == vermont_allowed_sources | length"
        fail_msg: "{{ status.stdout }}"
      when: not ansible_check_mode
