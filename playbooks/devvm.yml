# Build a blank Ubuntu VM into a devvm workstation.
#
# This is the declarative half of scripts/workstation/setup-devvm.sh, which is
# correct but has only ever been run by hand — so a committed change to it could
# sit undeployed, and a new machine could not be built without someone
# remembering the steps. Everything here is idempotent and safe against the live
# box; run it with --check --diff first.
#
#   dry-run : ansible-playbook -i playbooks/inventory.ini playbooks/devvm.yml --check --diff
#   apply   : ansible-playbook -i playbooks/inventory.ini playbooks/devvm.yml
#   new box : ansible-playbook -i playbooks/inventory.ini playbooks/devvm.yml \
#               -e @extra.json
#
# Pass the admin SSH key through a JSON extra-vars FILE, not -e key=value: the
# key contains spaces, and -e splits on them, so the module receives a truncated
# key and fails with an unhelpful IndexError.
#   {"devvm_target": "devvm_test", "devvm_admin_ssh_key": "ssh-ed25519 AAAA... comment"}
#
# WHAT THIS COVERS
#   the apt toolset, node, the machine-wide PATH, the OIDC/secrets tooling, the
#   enforced Claude config, /etc/skel, the apt source that delivers
#   terminal-lobby, and three units that existed only on the box.
#
# WHAT IT DOES NOT COVER YET, in the order worth doing next
#   1. Resource containment (setup-devvm.sh section 10) — the per-user memory
#      caps and earlyoom backstop added after the 2026-06-22 overload, when the
#      box had to be hard-killed. A machine built without them repeats that.
#   2. The t3 service layer (section 9) — t3-dispatch, t3-serve@, the timers.
#   3. Per-user provisioning — accounts, groups, clones, kubeconfigs. That is
#      ViktorBarzin/infra#88, deliberately last because it touches live access.
#   Until those land, a machine built from this playbook serves the lobby but is
#   not a full workstation.
#
# NOT ADOPTED, and why
#   drone 1.7.0        Drone CLI; CI here is Woodpecker. Looks vestigial.
#   immich-go 0.9.4    personal photo tooling, not workstation base.
#   openclaw-task      a script belonging to the openclaw project, which should
#                      ship it the way infra ships the homelab CLI.
#   caddy              enabled and serving the stock page on :80, 0 requests in
#                      7 days. Parking it is a separate, reversible decision.

- name: devvm workstation base
  # Overridable so the same playbook can build a NEW machine without being
  # edited: -e devvm_target=<group-or-host>. Defaults to the live box.
  hosts: "{{ devvm_target | default('devvm') }}"
  become: true
  gather_facts: true

  vars:
    workstation_dir: "{{ playbook_dir }}/../scripts/workstation"
    node_major: 22
    # Latest, not pinned: nothing else in this pipeline pins versions either,
    # and these are tools rather than build inputs.
    kubelogin_url: https://github.com/int128/kubelogin/releases/latest/download/kubelogin_linux_amd64.zip
    terragrunt_url: https://github.com/gruntwork-io/terragrunt/releases/latest/download/terragrunt_linux_amd64
    # Containment caps. The absolute values are the ones tuned on the 31.3 GiB
    # devvm and reasoned about in the files themselves; the min() only keeps a
    # smaller machine sane, and reproduces 24/6/8 exactly on the real box.
    devvm_user_memory_max: "{{ [24, (ansible_memtotal_mb / 1024 * 0.9) | round | int] | min }}G"
    devvm_pane_memory_max: "{{ [6, (ansible_memtotal_mb / 1024 * 0.2) | round | int] | min }}G"
    devvm_docker_memory_max: "{{ [8, (ansible_memtotal_mb / 1024 * 0.3) | round | int] | min }}G"
    # Per-user swap, BOUNDED rather than off (2026-09-02). It was 0 from
    # 2026-06-22, when a user runaway swap-thrashed the throttled virtual disk
    # into an I/O storm and the box had to be hard-killed. Unlimited is what did
    # that: the storm ran swap to 15 GB. A ceiling of 4G per user lets a session
    # page out instead of being killed — which is the point, since tmpfs pages
    # from /tmp are charged to a pane and are otherwise unswappable — while
    # capping what one user can push at a disk that is seek-bound and shared
    # (bead code-oflt is still open). The 6G pane cap remains the containment.
    devvm_user_swap_max: "{{ [4, (ansible_memtotal_mb / 1024 * 0.13) | round | int] | min }}G"
    # Protected memory floor per user slice (2026-09-12). This is the fairness
    # knob: reclaim leaves a user alone up to here and takes from whoever is
    # above their own floor instead.
    #
    # Sized for ACTIVE users, not enrolled ones. An empty slice protects
    # nothing, so anca and breakglass cost zero while away and are covered
    # automatically if they return, which is why this is one uniform value on
    # the user-.slice template rather than per-uid drop-ins. On the 31.3 GiB box
    # with two active humans: 2 x 8.5 GiB of users plus 2 GiB for system.slice
    # leaves ~12 GiB unprotected. That headroom is the point. MemoryLow is
    # best-effort, and once every remaining page sits inside somebody's floor,
    # reclaim proceeds anyway and the protection stops meaning anything.
    devvm_user_memory_low: "{{ [8, (ansible_memtotal_mb / 1024 * 0.27) | round | int] | min }}G"
    # When the playwright browser reaper decides a gpu-process has wedged.
    # 2 cores is roughly the working peak of a headless page render, and the
    # 2026-06-12 leak sat at 10.5; 10 samples is 10 minutes, against 6.5 hours
    # of it actually running. Both are deliberately far from the observed
    # numbers on either side, so a busy page is never mistaken for a leak.
    devvm_playwright_reaper_threshold_cores: 2
    devvm_playwright_reaper_window_minutes: 10
    # Swap sized from measurement, not from a RAM ratio: system.slice peaked at
    # 8.4 GiB over the 30 days to 2026-09-02 (p50 2.7, p99 7.0) and two users at
    # 4G each add 8, so 24 GiB total leaves ~7.6 GiB spare. The old 14 GiB never
    # went past 60% because the user slices could not reach it at all.
    #
    # TWO FILES, ADDITIVE, rather than one grown in place. A swapfile cannot be
    # extended — the header records its size and the kernel holds the extent map
    # — so growing means a new file, and retiring the old one means swapoff.
    # swapoff does NOT hand pages to another device: try_to_unuse() reads every
    # page back into RAM. Measured 2026-09-02 that would be 5.2 GiB arriving into
    # 7.4 GiB of available RAM beside 30 live Claude sessions, for a cosmetic
    # gain. Same call, same reason, as the 2026-06-10 growth.
    # ONE file, 14 GiB. It was two totalling 24 GiB from 2026-09-02 until
    # 2026-09-15, when /swapfile2 was retired live: it held 9.4 MB of its 10 GiB
    # and had never carried anything, so the swapoff migrated almost nothing.
    #
    # 24 GiB was more than this box can reach. Swap is capped per slice at
    # devvm_user_swap_max per user, and system.slice sat at 2.76 GiB, so the
    # realistic ceiling is around 11 GiB against 24 provisioned. 14 leaves
    # headroom over that without parking 10 GiB of disk nothing can use.
    #
    # THE BINDING CONSTRAINT IS THE PER-SLICE CAP, NOT THE FILE. Measured
    # 2026-09-15: user-1000 sat at exactly 4.00 of its 4 GiB with
    # memory.swap.events fail at 2,244,821, and user-1002 at 68.7% with 148,725.
    # A slice denied swap makes the kernel evict page cache instead, which is
    # the mechanism behind 56% of this box's reads being refaults. Raising the
    # cap or adding RAM is the fix; a bigger file is not.
    #
    # The two-file history, kept because the mechanics still apply to any future
    # growth: growing swap on a live box has to be additive (see the swap
    # tasks), and converging to one needs a swapoff, which reads every page in
    # that file back into RAM. Measured
    # 2026-09-02: /swapfile held 9 GiB against 8.2 GiB of MemAvailable, so the
    # merge cannot be done while the box is carrying pages.
    #
    # So it converges instead of being done: the tasks below act on a swap area
    # only when that area holds ZERO pages, which is true right after a boot and
    # false the rest of the time. The first apply after any reboot resizes
    # /swapfile to the target and retires /swapfile2, and every apply before that
    # is a no-op. Same approach, same reason, as the 2026-06-12 merge, which was
    # also done post-boot at 0B used.
    devvm_swap_target: { path: /swapfile, size_gb: 14 }
    # The one account this playbook owns. Everyone else comes from the roster.
    devvm_admin_user: wizard
    devvm_admin_ssh_key: ""
    # Users whose mattpocock skill set the nightly timer keeps current. A user
    # whose ~/.claude/skills is a symlink into someone else's home (breakglass
    # points at wizard's) is updated with that user and must not be listed here.
    devvm_skills_users:
      - wizard
      - emo
    # Pinned on purpose: this npm package runs unattended as each user, so the
    # version is a reviewed choice. Bump it when you mean to.
    devvm_skills_cli: skills@1.5.23
    # Users whose Claude Code the nightly timer keeps current. Claude Code
    # installs PER USER (~/.local/share/claude/versions), so unlike codex there
    # is no single binary to swap and every account needs its own update run.
    # A user with no native install is skipped by the script, so listing one
    # who does not use Claude Code is harmless rather than an error.
    devvm_claude_users:
      - wizard
      - emo
      - ancamilea
    # The tailnet leg agent-api listens on (section 15). The account that owns
    # the userspace tailscaled is the account agent-api runs as, which is the
    # one account this playbook creates.
    devvm_tailscale_user: "{{ devvm_admin_user }}"
    devvm_tailscale_state_dir: "/home/{{ devvm_tailscale_user }}/.tailscale-us"
    # Loopback ports for the SOCKS5 and outbound HTTP proxies. NOT 1055/1056:
    # emo's own userspace daemon has held those since 2026-08-14 and a second
    # daemon binding them would fail to start.
    devvm_tailscale_socks_port: 1057
    devvm_tailscale_http_proxy_port: 1058
    devvm_tailscale_login_server: https://headscale.viktorbarzin.me
    # devvm-emo is the existing node's name, so this reads as its counterpart.
    devvm_tailscale_hostname: "devvm-{{ devvm_tailscale_user }}"
    # Where the pre-auth key is read from, minted by hand and written to Vault
    # before the first run. See the registration task for the two commands.
    devvm_tailscale_vault_path: secret/devvm-tailscale
    devvm_tailscale_vault_field: preauth_key
    # The key is handed to `tailscale up` through this file rather than on its
    # argv — see "Write the pre-auth key to a private file" below. It lives in
    # the 0700 state dir and is removed by the block's `always`.
    devvm_tailscale_preauth_file: "{{ devvm_tailscale_state_dir }}/preauth.key"
    # Re-register a node that was deleted or expired in Headscale:
    #   -e devvm_tailscale_force_register=true
    devvm_tailscale_force_register: false
    devvm_agent_api_log_dir: /var/log/agent-api
    devvm_agent_api_port: 8710
    # agent-api is reached over the tailnet, not through Traefik, so the
    # proxy-secret gate above cannot cover it. It takes a per-caller bearer
    # instead, from this file. Root must own it: authuser refuses a tokens file
    # the service account owns, because an account that owns it can append a
    # line naming any terminal account on the box.
    devvm_agent_api_tokens_file: /etc/terminal-lobby-tokens
    devvm_agent_api_vault_path: secret/terminal-lobby
    # Every external agent allowed to call agent-api, one entry each. This
    # list IS the answer to "what can reach this box", so it lives in the repo
    # where adding one is a diff somebody reviews, rather than in Vault where
    # it would not be.
    #
    #   name    what /whoami echoes, what the trace records as the actor, and
    #           what the lobby stamps as a session's origin so the agent's
    #           conversations do not land in the owner's own list. It is also
    #           the Vault field, as agent_api_<name>_token.
    #   os_user the terminal account the agent acts as. Must be a right-hand
    #           side of /etc/ttyd-user-map or authuser answers 403.
    #
    # Removing an entry revokes that agent at the next run. For an immediate
    # revoke, scripts/agent-api-kill <name>.
    devvm_external_agents:
      - name: muse
        os_user: wizard

    # agentmd (github.com/ViktorBarzin/agentmd): one instance per user, each
    # reached through stacks/agentmd on its own hostname. Keep the users in
    # step with local.users there.
    #
    #   name      the OS user the instance runs as
    #   port      where its socket listens (the stack's Endpoints point here)
    #   identity  the Authentik username allowed in (differs from the OS user)
    #
    # Its proxy secret is Vault secret/agentmd -> proxy_secret_<name>.
    devvm_agentmd_version: v0.1.0
    devvm_agentmd_sha256: SET_AFTER_RELEASE
    devvm_agentmd_users:
      - name: wizard
        port: 7390
        identity: vbarzin

  tasks:
    # ---- 1) the apt toolset -------------------------------------------------
    # packages.txt stays the single source of truth. Reading it here rather than
    # restating the list is what stops the two drifting apart.
    - name: Read the declared package manifest
      ansible.builtin.set_fact:
        devvm_packages: >-
          {{ lookup('file', workstation_dir ~ '/packages.txt').splitlines()
             | map('regex_replace', '\s+#.*$', '')
             | map('trim')
             | reject('match', '^#')
             | reject('equalto', '')
             | list }}

    # Caddy was installed by hand at some point and left running: the stock
    # welcome page on :80, zero handled requests in 30 days, nothing depending
    # on it (apt-cache rdepends is empty). Its apt repo was undeclared machine
    # state, and its Cloudsmith signing key EXPIRED — which failed
    # `apt-get update` and therefore ABORTED the task below, so nothing on this
    # box could be apt-installed at all (found 2026-09-01 while installing the
    # Playwright WebKit dependencies). An unused web server with no update path
    # is worse than either fixing or removing it, so it goes.
    #
    # Runs BEFORE the install task on purpose: while the repo is present with an
    # expired key, `update_cache: true` fails and the install never happens.
    - name: Remove the hand-installed caddy and its apt repo
      block:
        - name: Stop and disable caddy
          ansible.builtin.systemd_service:
            name: caddy
            state: stopped
            enabled: false
          failed_when: false

        - name: Remove the caddy package
          ansible.builtin.apt:
            name: caddy
            state: absent
            purge: true
            update_cache: false

        - name: Remove the caddy apt source and its expired keyring
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - /etc/apt/sources.list.d/caddy-stable.list
            - /usr/share/keyrings/caddy-stable-archive-keyring.gpg
          register: caddy_repo_removed

    # The HashiCorp repo is where terraform and vault on this box came from, and
    # it existed only as hand-made files in /etc/apt until now, which is how its
    # keyring went stale unnoticed: HashiCorp rotated their package signing key
    # on 2026-09-09 and `apt-get update` has failed NO_PUBKEY FC9CA96ACA026560
    # ever since, taking every apt task in this playbook down with it.
    #
    # `jammy`, not noble, because that is the suite the installed terraform and
    # vault were resolved from and changing it here would quietly offer both an
    # upgrade. Worth revisiting deliberately, not as a side effect of a key fix.
    - name: Install the HashiCorp signing key
      ansible.builtin.get_url:
        url: https://apt.releases.hashicorp.com/gpg
        dest: /usr/share/keyrings/hashicorp-archive-keyring.asc
        mode: "0644"
      register: devvm_hashicorp_key

    - name: Declare the HashiCorp apt source
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/hashicorp.list
        mode: "0644"
        content: |
          # Managed by playbooks/devvm.yml. Local edits are overwritten.
          deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.asc] https://apt.releases.hashicorp.com jammy main

    # get_url leaves the old binary keyring in place and the source above no
    # longer names it, so it is dead weight that still looks authoritative.
    - name: Drop the superseded binary keyring
      ansible.builtin.file:
        path: /usr/share/keyrings/hashicorp-archive-keyring.gpg
        state: absent

    - name: Install the declared apt packages
      ansible.builtin.apt:
        name: "{{ devvm_packages }}"
        state: present
        update_cache: true
        cache_valid_time: 3600

    # ---- 2) node ------------------------------------------------------------
    # Needed for the t3 CLI. Deliberately NOT for claude-code: that is the
    # per-user native install under ~/.local/bin, and a system-wide npm copy
    # would shadow the per-user ones everyone auto-migrates to.
    - name: Check the installed node major version
      ansible.builtin.command: node --version
      register: node_version
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Install NodeSource {{ node_major }}.x
      # A version comparison rather than a capture-group regex: the escaping
      # differs between a plain and a quoted YAML scalar, and getting it wrong
      # here silently re-runs the NodeSource installer on a machine that is fine.
      when: >-
        node_version.rc != 0 or
        (node_version.stdout | trim | regex_replace('^v', '')) is version('18.0.0', '<')
      block:
        - name: Fetch the NodeSource setup script
          ansible.builtin.get_url:
            url: "https://deb.nodesource.com/setup_{{ node_major }}.x"
            dest: /tmp/nodesource-setup.sh
            mode: "0755"
        - name: Run it
          ansible.builtin.command: /tmp/nodesource-setup.sh
          changed_when: true
        - name: Install nodejs
          ansible.builtin.apt:
            name: nodejs
            state: present
            update_cache: true

    # ---- 2a) ~/.local/bin on PATH for every login shell ---------------------
    - name: Put ~/.local/bin on PATH for login shells
      ansible.builtin.copy:
        dest: /etc/profile.d/10-local-bin.sh
        mode: "0644"
        content: |
          # Native per-user installs (e.g. claude-code) live in ~/.local/bin — put it on PATH.
          # Guarded so it never duplicates. Sourced by login shells (bash via /etc/profile; zsh
          # login via /etc/zsh/zprofile -> /etc/profile).
          case ":$PATH:" in
            *":$HOME/.local/bin:"*) ;;
            *) export PATH="$HOME/.local/bin:$PATH" ;;
          esac

    # ---- 3) tooling ---------------------------------------------------------
    # kubelogin is the kubectl oidc-login plugin, NOT the apt package of the
    # same name, which is an Azure tool.
    - name: Look for the tooling already installed
      ansible.builtin.stat:
        path: "/usr/local/bin/{{ item }}"
      loop: [kubelogin, sops, terragrunt]
      register: tooling_stat
      check_mode: false

    - name: Note which tools are missing
      ansible.builtin.set_fact:
        missing_tools: "{{ tooling_stat.results | rejectattr('stat.exists') | map(attribute='item') | list }}"

    # kubelogin is the kubectl oidc-login plugin, NOT the apt package of the same
    # name, which is an Azure tool.
    - name: Install kubelogin
      when: "'kubelogin' in missing_tools"
      block:
        - name: Download kubelogin
          ansible.builtin.get_url:
            url: "{{ kubelogin_url }}"
            dest: /tmp/kubelogin.zip
            mode: "0644"
        - name: Unpack it
          ansible.builtin.unarchive:
            src: /tmp/kubelogin.zip
            dest: /usr/local/bin
            remote_src: true
            include: [kubelogin]
            mode: "0755"

    - name: Link kubelogin as the kubectl plugin
      ansible.builtin.file:
        src: /usr/local/bin/kubelogin
        dest: /usr/local/bin/kubectl-oidc_login
        state: link

    # sops names its asset after the release tag, so "latest/download" alone
    # cannot address it -- the tag has to be resolved first.
    - name: Resolve the latest sops release
      when: "'sops' in missing_tools"
      ansible.builtin.uri:
        url: https://api.github.com/repos/getsops/sops/releases/latest
        return_content: true
      register: sops_release
      check_mode: false

    - name: Install sops
      when: "'sops' in missing_tools"
      ansible.builtin.get_url:
        url: "https://github.com/getsops/sops/releases/download/{{ sops_release.json.tag_name }}/sops-{{ sops_release.json.tag_name }}.linux.amd64"
        dest: /usr/local/bin/sops
        mode: "0755"

    - name: Install terragrunt
      when: "'terragrunt' in missing_tools"
      ansible.builtin.get_url:
        url: "{{ terragrunt_url }}"
        dest: /usr/local/bin/terragrunt
        mode: "0755"

    # Ansible's copy and template do NOT create parent directories, and every one
    # of these already existed on the live box -- so a check run there could never
    # have caught this. A blank machine has none of them.
    - name: Create the directories the configs land in
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /etc/claude-code
        - /etc/apt/keyrings
        - /etc/apt/sources.list.d
        - /etc/systemd/system/user-.slice.d
        # user.slice, not user-.slice: the parent of every per-user slice, and
        # a separate unit with a separate drop-in directory. MemoryLow on a
        # child is capped by what its parent has to give, so without this the
        # per-user floors have an effective value of zero.
        - /etc/systemd/system/user.slice.d
        - /etc/systemd/system/system.slice.d
        - /etc/systemd/system/systemd-tmpfiles-clean.timer.d
        - /etc/systemd/user/scope.d
        - /usr/local/sbin
        # The playwright-mcp slice has no unit file of its own -- it exists
        # only because playwright-mcp@.service names it with Slice=. systemd
        # still reads drop-ins for an implicit slice, which is how the CPU
        # cap below reaches it without this repo owning the slice itself.
        - '/etc/systemd/system/system-playwright\x2dmcp.slice.d'

    # ---- 4) the enforced machine-wide Claude config -------------------------
    # Top of the settings precedence chain, and carries no secrets.
    - name: Deploy the managed Claude config
      ansible.builtin.copy:
        src: "{{ workstation_dir }}/managed-settings.json"
        dest: /etc/claude-code/managed-settings.json
        mode: "0644"
        owner: root
        group: root

    # ---- 5) /etc/skel for new accounts --------------------------------------
    # File by file, not the whole skel/ directory: the repo keeps the tmux
    # config as skel/tmux.conf so it shows in a listing, but a new account needs
    # it as ~/.tmux.conf. Copying the directory verbatim put a second, unused
    # /etc/skel/tmux.conf beside the real one (found 2026-09-25), which every new
    # home then inherited as a stray ~/tmux.conf. setup-devvm.sh installs the
    # same two files the same way.
    - name: Seed /etc/skel
      ansible.builtin.copy:
        src: "{{ workstation_dir }}/skel/{{ item.src }}"
        dest: "/etc/skel/{{ item.dest }}"
        mode: "{{ item.mode }}"
      loop:
        - { src: start-claude.sh, dest: start-claude.sh, mode: "0755" }
        - { src: tmux.conf, dest: .tmux.conf, mode: "0644" }
    - name: No stray /etc/skel/tmux.conf
      ansible.builtin.file:
        path: /etc/skel/tmux.conf
        state: absent

    # setup-devvm.sh used to link these to the admin's own ~/.claude dirs, so a
    # new account inherited his personal rules and the provisioner's
    # `install -d -o <user>` would follow the link into his home (2026-09-22).
    - name: No /etc/skel links into the admin's ~/.claude
      ansible.builtin.file:
        path: "/etc/skel/.claude/{{ item }}"
        state: absent
      loop: [skills, rules, agents, commands]

    # ---- 5b) the admin account ---------------------------------------------
    # ttyd.service runs as this user, so a machine without it cannot serve the
    # lobby at all -- found by installing the package on a blank VM, where ttyd
    # was the one service that would not start.
    #
    # This is the ONLY account this playbook creates. Everyone else comes from
    # the roster (infra#88). Strictly additive: groups are appended, an existing
    # account is never re-shelled, re-homed or re-permissioned, so this is a
    # no-op against the live box.
    - name: Create the shared code group
      ansible.builtin.group:
        name: code-shared
        state: present

    - name: Create the admin account
      ansible.builtin.user:
        name: "{{ devvm_admin_user }}"
        groups: [sudo, docker, code-shared]
        append: true
        shell: /bin/zsh
        create_home: true
        state: present

    - name: Authorise the admin's key
      ansible.posix.authorized_key:
        user: "{{ devvm_admin_user }}"
        key: "{{ devvm_admin_ssh_key }}"
        state: present
      when: devvm_admin_ssh_key | length > 0

    # ---- 6) the apt source that delivers terminal-lobby ---------------------
    # The package is built off-infra and published to Forgejo's Debian registry.
    # Its credential is NOT here: this repo is publicly mirrored, and root on
    # this box has no unattended Vault access, so the deploy pipeline installs
    # /etc/apt/auth.conf.d/terminal-lobby.conf on every deploy.
    # check_mode: false because get_url probes with HEAD during a dry run and
    # Forgejo answers 405 there, which would fail every --check run. Fetching a
    # public signing key is harmless, and doing it for real keeps dry runs honest.
    - name: Fetch the Forgejo repository signing key
      ansible.builtin.get_url:
        url: https://forgejo.viktorbarzin.me/api/packages/viktor/debian/repository.key
        dest: /etc/apt/keyrings/forgejo-viktor.asc
        mode: "0644"
      check_mode: false

    - name: Add the terminal-lobby apt source
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/terminal-lobby.list
        mode: "0644"
        content: |
          deb [signed-by=/etc/apt/keyrings/forgejo-viktor.asc] https://forgejo.viktorbarzin.me/api/packages/viktor/debian noble main

    # ---- 7) units that existed only on the box ------------------------------
    # Adopted 2026-08-29: these were in /etc/systemd/system and /usr/local/bin
    # and in no repository, so nothing could rebuild them.
    - name: Install the adopted helper scripts
      ansible.builtin.copy:
        src: "files/devvm/{{ item.src }}"
        dest: "{{ item.dest }}"
        mode: "0755"
        owner: root
        group: root
      loop:
        - { src: codex-auth-backup.sh, dest: /usr/local/bin/codex-auth-backup.sh }
        - { src: devvm-cleanup, dest: /usr/local/bin/devvm-cleanup }
        - { src: networkd-dhcp-watchdog.sh, dest: /usr/local/sbin/networkd-dhcp-watchdog.sh }

    - name: Install the adopted units
      ansible.builtin.copy:
        src: "files/devvm/{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
        mode: "0644"
        owner: root
        group: root
      loop:
        - codex-auth-backup.service
        - codex-auth-backup.timer
        - codex-auth-backup.path
        - devvm-cleanup.service
        - devvm-cleanup.timer
        - networkd-dhcp-watchdog.service
        - networkd-dhcp-watchdog.timer
      notify: reload systemd

    - name: Enable the adopted timers and paths
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
        state: started
        daemon_reload: true
      loop:
        - codex-auth-backup.timer
        - codex-auth-backup.path
        - devvm-cleanup.timer
        - networkd-dhcp-watchdog.timer

    # docker-disk-gc is folded into devvm-cleanup, 2026-09-15. It pruned
    # containers, images and the builder cache and left VOLUMES alone, so
    # anonymous volumes from removed containers accumulated with nothing to
    # reap them: 84 of 85 were dangling when measured, and pruning them
    # returned 3.45 GB. Rather than add a second timer beside it for the uv
    # cache and a third for the t3 backups, one job now owns everything on
    # this box that expires.
    #
    # Disabled rather than masked. Its unit file lives in
    # /etc/systemd/system, and a mask puts its symlink at that same path, so
    # the mask never takes and every run reports a change no apply settles.
    - name: Retire the docker-only GC it replaces
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: false
        state: stopped
      loop:
        - docker-disk-gc.timer
        - docker-disk-gc.service
      failed_when: false

    - name: Remove the retired docker GC files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /usr/local/bin/docker-disk-gc
        - /etc/systemd/system/docker-disk-gc.service
        - /etc/systemd/system/docker-disk-gc.timer
      notify: reload systemd

    # Retired evaluations, 2026-09-13. Neither agent-conductor nor Orca is
    # declared anywhere: classifying all 59 units in /etc/systemd/system by
    # owner found 23 from this playbook, 12 from Debian packages, 19 committed
    # under infra/scripts/ but installed by no task, and these 6 with no copy
    # in any repository or package at all. That last set is exactly the gap the
    # weekly vzdump image backup was covering, and retiring it is what lets
    # that backup go: the restore path is this playbook plus devvm-home-backup,
    # and neither can restore what it does not know about.
    #
    # Measured before retiring. agent-conductor: under 5 MiB resident, 15 MB on
    # disk, binaries dated 2026-07-16, source not present anywhere in ~/code.
    # Orca: 41 MiB resident and 748 MB on disk, a third-party AppImage from the
    # 2026-08-29 evaluation and re-downloadable. Both were archived to
    # /mnt/backup/devvm-retired-2026-09-13/agent-conductor-archive-2026-09-13.tar.gz
    # (114 files, sha256 1f607238a251...) before this landed, because
    # agent-conductor has no other copy in existence.
    #
    # Stopped and disabled rather than deleted, so reversing this is one
    # command. Deleting the files is a separate, later step. Orca took that
    # step on 2026-09-23, in the two tasks below this one; agent-conductor's
    # files are still in place.
    #
    # NOT masked, and that is deliberate. Masking works by putting a symlink to
    # /dev/null at a higher-priority path than the unit file, and these unit
    # files already live in /etc/systemd/system, which is that path. systemd
    # cannot place the symlink over them, ansible reports `changed` anyway, and
    # the mask never sticks, so a masked: true here would make every future
    # --check run report drift that no apply can ever settle. Verified on the
    # box 2026-09-13: after an apply claiming success, every one of these was
    # still a regular file and `systemctl is-enabled` read `disabled`, not
    # `masked`.
    - name: Retire the undeclared evaluation services
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: false
        state: stopped
        daemon_reload: true
      loop:
        - acd-demux.service
        - ac-spa.service

    # Orca's AppImage is re-downloadable and nothing on the box uses it. Its
    # units have been stopped since 2026-09-13, so the stop is a no-op here,
    # and failed_when keeps it quiet once the unit files are gone.
    - name: Stop the retired Orca services
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: false
        state: stopped
      loop:
        - orca-serve.service
        - orca-xvfb.service
      failed_when: false

    - name: Remove the retired Orca files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /opt/orca
        - /etc/systemd/system/orca-serve.service
        - /etc/systemd/system/orca-xvfb.service
      notify: reload systemd

    # The relay is a template, so the INSTANCE carries the enablement:
    # /etc/systemd/system/sockets.target.wants/ac-relay@wizard.socket is what
    # starts it at boot, and stopping the instance does not remove that
    # symlink. The template ac-relay@.service is `static` and ac-relay@.socket
    # is `indirect`, so neither takes an enablement of its own and there is
    # nothing to do to them.
    - name: Retire the agent-conductor relay instance
      ansible.builtin.systemd_service:
        name: ac-relay@wizard.socket
        enabled: false
        state: stopped

    # multipathd ships enabled by default and this VM presents no multipath
    # devices: `multipath -ll` returns nothing. It holds 18.8 MiB for that.
    # Disabled rather than masked, because open-iscsi is installed and a
    # dependency should still be able to pull it if one ever appears.
    - name: Stop multipathd, which has no devices to manage here
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: false
        state: stopped
      loop:
        - multipathd.service
        - multipathd.socket

    # nvidia-container-toolkit is installed because dockerd's daemon.json
    # carries the nvidia runtime (section 9), but this VM has no GPU, so the
    # toolkit's CDI refresh failed at every boot and kept the box reporting
    # "degraded" (found 2026-09-24). The package puts these unit files
    # straight into /etc/systemd/system, where a mask cannot land (see the
    # note above the evaluation services), so they are disabled instead. The
    # toolkit itself stays for the daemon.json runtime.
    - name: Stop the NVIDIA CDI refresh, which has no GPU to describe here
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: false
        state: stopped
      loop:
        - nvidia-cdi-refresh.path
        - nvidia-cdi-refresh.service
      tags: vm-hardware

    # openipmi came in on 2026-06-10 as a recommendation of ipmitool, which
    # stays. Its service loads the local IPMI drivers, and a VM has no BMC, so
    # it failed at every boot too. The unit is generated from
    # /etc/init.d/openipmi, so a mask in /etc/systemd/system does take
    # precedence here.
    - name: No local IPMI on a VM
      ansible.builtin.systemd_service:
        name: openipmi.service
        masked: true
        state: stopped
      tags: vm-hardware

    # Claude Code leaves one scratch directory per session under /tmp and never
    # reaps them. /tmp is a RAM-backed tmpfs here, so that is a slow memory leak:
    # it reached 8.0G of 8.0G on 2026-09-06 and background commands began failing
    # with ENOSPC. The reasoning, the measurements and why the age check is
    # pinned to mtime are in the file itself.
    - name: Bound the Claude Code scratch retention under /tmp
      ansible.builtin.copy:
        src: files/devvm/claude-scratch.conf
        dest: /etc/tmpfiles.d/claude-scratch.conf
        mode: "0644"
        owner: root
        group: root

    - name: Sweep tmpfiles hourly rather than daily
      ansible.builtin.copy:
        src: files/devvm/tmpfiles-clean-hourly.conf
        dest: /etc/systemd/system/systemd-tmpfiles-clean.timer.d/override.conf
        mode: "0644"
        owner: root
        group: root
      notify: reload systemd

    # ---- 7a2) the codex CLI, and keeping it current -------------------------
    # Added 2026-09-06. Nothing in this repo installed codex: setup-devvm.sh and
    # the section above cover only the shared auth at /opt/codex-shared and the
    # auth-backup units, so the package itself was a hand install that a rebuilt
    # box would not have had. It was found at 0.144.3 from 2026-07-13 while npm
    # latest was 0.153.4 from 2026-09-04.
    #
    # `state: latest`, not a version, because Viktor wants these agent binaries
    # always at latest (2026-09-06). Codex fetches its model list from the
    # server, so an old CLI shows an old list even for an account entitled to
    # more, which is how a newly released model went missing. The one pinned
    # tool in this fleet is t3, held at v0.0.24 for a real regression; that is
    # the bar for a pin.
    #
    # A playbook run alone would leave the box current only as often as someone
    # runs it, so the timer below carries it the rest of the time.
    - name: Install the codex CLI at the latest published version
      community.general.npm:
        name: "@openai/codex"
        global: true
        state: latest

    - name: Install the codex updater
      ansible.builtin.copy:
        src: files/devvm/codex-update
        dest: /usr/local/bin/codex-update
        mode: "0755"
        owner: root
        group: root

    # ---- 7a2b) the pi CLI, and keeping it current ---------------------------
    # Added 2026-09-25, when terminal-lobby gained pi as a third harness beside
    # Claude Code and Codex, for every user on the box. Each person signs pi in
    # with their own /login; nothing here holds a credential.
    #
    # The package moved: @mariozechner/pi-coding-agent is deprecated on npm in
    # favour of @earendil-works/pi-coding-agent, which is what this installs.
    # Latest rather than a pin, for the same reason as codex above.
    #
    # ignore_scripts because pi's own README says it needs no dependency
    # lifecycle scripts, and a global install runs them as root.
    - name: Install the pi CLI at the latest published version
      community.general.npm:
        name: "@earendil-works/pi-coding-agent"
        global: true
        state: latest
        ignore_scripts: true

    - name: Install the pi updater
      ansible.builtin.copy:
        src: files/devvm/pi-update
        dest: /usr/local/bin/pi-update
        mode: "0755"
        owner: root
        group: root

    # jiti's cache directory, /tmp/jiti. pi compiles extensions through jiti,
    # which trusts cached code by a source hash in the file name, so a user who
    # can write to that directory can plant code another user's pi runs. The
    # tmpfiles rule makes it root's at every boot; the tasks below apply it now
    # and clear out whatever non-root users left in it. jiti.conf has the rest.
    - name: Keep /tmp/jiti a root-owned directory
      ansible.builtin.copy:
        src: files/devvm/jiti.conf
        dest: /etc/tmpfiles.d/jiti.conf
        mode: "0644"
        owner: root
        group: root

    - name: Check /tmp/jiti without following a link
      ansible.builtin.stat:
        path: /tmp/jiti
        follow: false
      register: devvm_jiti_dir

    # systemd-tmpfiles rather than the file module, because it is built to fix
    # up paths in a world-writable directory without following a link someone
    # left there. With a link in the way, systemd 255 prints "already exists and
    # is not a directory" and still exits 0, which is why the result is checked
    # again below.
    - name: Apply the /tmp/jiti rule now rather than at the next boot
      ansible.builtin.command:
        cmd: systemd-tmpfiles --create /etc/tmpfiles.d/jiti.conf
      when: >-
        not (devvm_jiti_dir.stat.isdir | default(false))
        or devvm_jiti_dir.stat.uid != 0
        or devvm_jiti_dir.stat.gid != 0
        or devvm_jiti_dir.stat.mode != '0755'
      changed_when: true

    - name: Re-check /tmp/jiti
      ansible.builtin.stat:
        path: /tmp/jiti
        follow: false
      register: devvm_jiti_now

    - name: Fail if /tmp/jiti is not a root-owned directory
      ansible.builtin.assert:
        that:
          - devvm_jiti_now.stat.isdir | default(false)
          - devvm_jiti_now.stat.uid == 0
          - devvm_jiti_now.stat.gid == 0
          - devvm_jiti_now.stat.mode == '0755'
        fail_msg: >-
          /tmp/jiti is not a root-owned 0755 directory after systemd-tmpfiles
          ran. A link or a file in its place is the likely cause; remove it and
          run the playbook again.
      when: not ansible_check_mode

    # Only once the directory is root's: before that, its owner could swap it
    # for a link between the check and the listing. Entries root owns are kept,
    # since no other user can have written them.
    - name: List what non-root users left in /tmp/jiti
      ansible.builtin.find:
        paths: /tmp/jiti
        file_type: any
        hidden: true
      register: devvm_jiti_entries
      when:
        - devvm_jiti_now.stat.isdir | default(false)
        - devvm_jiti_now.stat.uid == 0
      check_mode: false

    - name: Remove the cache entries non-root users left in /tmp/jiti
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ devvm_jiti_entries.files | default([]) | rejectattr('uid', 'equalto', 0) | list }}"
      loop_control:
        label: "{{ item.path }}"

    # ---- 7a3) keeping Claude Code current, for everyone ---------------------
    # Added 2026-09-06, same reason as the codex block above: Viktor wants these
    # agent binaries always at latest.
    #
    # It was true for one account. `claude update` ran from wizard's PERSONAL
    # crontab at 03:30 — a hand-installed line in no repository, covering no one
    # else — and the installs had drifted apart behind it:
    #
    #   wizard     2.1.263   (the cron)
    #   emo        2.1.259
    #   ancamilea  2.1.183
    #
    # Claude Code installs per user, so this cannot be one `npm install -g` the
    # way codex is; the script runs the update as each account in turn.
    - name: Install the Claude Code updater
      ansible.builtin.copy:
        src: files/devvm/claude-update
        dest: /usr/local/bin/claude-update
        mode: "0755"
        owner: root
        group: root

    - name: Configure the Claude Code updater
      ansible.builtin.copy:
        dest: /etc/default/claude-update
        mode: "0644"
        owner: root
        group: root
        content: |
          # Managed by playbooks/devvm.yml — edit there, not here.
          CLAUDE_UPDATE_USERS="{{ devvm_claude_users | join(' ') }}"

    # The personal crontab line this replaces. Left in place it would run the
    # same update an unknown number of minutes from the timer, against the same
    # per-user install, and keep appending to a log on the tmpfs.
    - name: Drop the hand-installed claude update cron line
      ansible.builtin.lineinfile:
        path: "/var/spool/cron/crontabs/{{ item }}"
        regexp: 'claude(-code)?.*\bupdate\b'
        state: absent
      loop: "{{ devvm_claude_users }}"
      failed_when: false

    # ---- 7a4) one job for every agent CLI -----------------------------------
    # Added 2026-09-06. Viktor: "we don't need separate jobs for updates".
    #
    # The three updaters landed as three timers over the course of one
    # afternoon, at 03:39, 04:59 and 05:58, staggered so they would not share a
    # network window. One sequential job removes the need for that arrangement
    # and leaves a single unit to look at when a morning's update did something
    # unexpected.
    #
    # He also asked whether apt's unattended-upgrades could own this. It cannot
    # reach any of the three: codex and t3 are global npm packages and Claude
    # Code is a per-user native install under ~/.local/share, so none is a deb
    # and apt has no handle on them. The two things on this box that ARE debs,
    # terminal-lobby and ttyd-devvm, are already covered by apt and by the
    # release deploy.
    #
    # The scripts stay separate. Each is individually runnable by hand, which is
    # what the t3 runbook instructs, and t3-autoupdate.service is kept for the
    # same reason. What goes away is the three schedules.
    - name: Install the agent updater units
      ansible.builtin.copy:
        src: "files/devvm/{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
        mode: "0644"
        owner: root
        group: root
      loop:
        - agent-update.service
        - agent-update.timer
        - claude-update.service
        - codex-update.service
        - pi-update.service
      notify: reload systemd

    - name: Enable the agent updater timer
      ansible.builtin.systemd_service:
        name: agent-update.timer
        enabled: true
        state: started
        daemon_reload: true

    # The per-tool schedules this replaces. Stopped and disabled before their
    # unit files go, or systemd keeps an enabled symlink pointing at nothing.
    - name: Stop the per-tool update timers
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: false
        state: stopped
      loop:
        - claude-update.timer
        - codex-update.timer
        - t3-autoupdate.timer
      failed_when: false

    - name: Remove the per-tool update timer units
      ansible.builtin.file:
        path: "/etc/systemd/system/{{ item }}"
        state: absent
      loop:
        - claude-update.timer
        - codex-update.timer
        - t3-autoupdate.timer
      notify: reload systemd

    # ---- 7b) nightly refresh of the mattpocock skill set --------------------
    # Added 2026-08-30. The skills are a working dependency of how sessions run
    # here, and upstream ships behaviour changes most weeks, so they drifted two
    # minor versions behind before anyone noticed. The script carries the detail
    # of why a bare `npx skills update` in cron is not enough; the short version
    # is that it overwrites our local edits, resurrects deleted skills from the
    # lockfile, and cannot follow a rename on its own.
    - name: Install the skills updater
      ansible.builtin.copy:
        src: files/devvm/claude-skills-update
        dest: /usr/local/bin/claude-skills-update
        mode: "0755"
        owner: root
        group: root

    - name: Configure the skills updater
      ansible.builtin.copy:
        dest: /etc/default/claude-skills-update
        mode: "0644"
        owner: root
        group: root
        content: |
          # Managed by playbooks/devvm.yml — edit there, not here.
          CLAUDE_SKILLS_USERS="{{ devvm_skills_users | join(' ') }}"
          SKILLS_CLI="{{ devvm_skills_cli }}"
      notify: reload systemd

    # Per-user policy: which promoted skills to hold back, the local edits to
    # put back on top after each update, and which harnesses to install for
    # (wizard's list puts the real copies in ~/.agents/skills). Without these a
    # rebuilt machine loses all three, silently.
    - name: Ship the per-user skill policy
      ansible.builtin.copy:
        src: files/devvm/claude-skills/
        dest: /usr/local/share/claude-skills/
        mode: "0644"
        directory_mode: "0755"
        owner: root
        group: root

    # copy never deletes, so retiring a patch or an exclude in the repo would
    # otherwise leave it applying on the box forever. This directory is entirely
    # repo-owned, so anything on disk the repo does not carry is stale. Both
    # sides are enumerated with find and compared on the path relative to their
    # own root; a fileglob lookup silently returns nothing here, which makes the
    # difference "delete everything".
    - name: List the skill-policy files the repo carries
      ansible.builtin.find:
        paths: "{{ playbook_dir }}/files/devvm/claude-skills"
        recurse: true
        file_type: file
      register: devvm_skill_policy_repo
      delegate_to: localhost
      become: false
      check_mode: false

    - name: List the skill-policy files on the box
      ansible.builtin.find:
        paths: /usr/local/share/claude-skills
        recurse: true
        file_type: file
      register: devvm_skill_policy_live
      check_mode: false

    - name: Remove skill-policy files the repo no longer carries
      ansible.builtin.file:
        path: "/usr/local/share/claude-skills/{{ item }}"
        state: absent
      loop: >-
        {{ (devvm_skill_policy_live.files | map(attribute='path')
            | map('relpath', '/usr/local/share/claude-skills') | list)
           | difference(devvm_skill_policy_repo.files | map(attribute='path')
             | map('relpath', playbook_dir + '/files/devvm/claude-skills') | list) }}

    - name: Install the skills updater units
      ansible.builtin.copy:
        src: "files/devvm/{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
        mode: "0644"
        owner: root
        group: root
      loop:
        - claude-skills-update.service
        - claude-skills-update.timer
      notify: reload systemd

    - name: Enable the skills updater timer
      ansible.builtin.systemd_service:
        name: claude-skills-update.timer
        enabled: true
        state: started
        daemon_reload: true

    # ---- 7b) swap ------------------------------------------------------------
    # Swap was hand-managed until 2026-09-02: nothing in this repo declared the
    # file or the fstab line, so a rebuilt box came up swapless and the size
    # lived only in one machine and one person's notes.
    #
    # Every task here is guarded on a swap area holding NOTHING, because the one
    # operation this needs — swapoff — does not hand pages to another device.
    # try_to_unuse() reads every page back into RAM, so acting on a carrying file
    # risks the OOM this whole thread is about.
    - name: List swap areas that hold no pages
      ansible.builtin.shell:
        cmd: "swapon --show=NAME,USED --bytes --noheadings | awk '$2 == 0 {print $1}'"
      register: devvm_swap_empty
      changed_when: false
      check_mode: false

    - name: List every active swap area
      ansible.builtin.command:
        cmd: swapon --noheadings --show=NAME
      register: devvm_swap_active
      changed_when: false
      check_mode: false

    - name: Check the target swap file
      ansible.builtin.stat:
        path: "{{ devvm_swap_target.path }}"
      register: devvm_swap_target_stat

    # One task, not four: a swap file is usable only once allocated AND
    # permissioned AND formatted, and a half-made one that survived a failure
    # between steps would be picked up by fstab at the next boot. `creates` makes
    # it idempotent and lets --check skip cleanly.
    #
    # fallocate, never dd: instant on ext4 and writes no data, so it costs
    # nothing on a spindle that is already this box's bottleneck.
    #
    # set -eu, not -euo pipefail: ansible.builtin.shell runs /bin/sh, which is
    # dash on Ubuntu and has no pipefail — dash exits 2 on the `set` line before
    # reaching fallocate. No changed_when override either: an unconditional one
    # reports a change even when `creates` skipped the task, which in --check made
    # this look as though it would re-run mkswap over the LIVE swapfile.
    - name: Create the target swap file if it is missing
      ansible.builtin.shell:
        cmd: |
          set -eu
          fallocate -l {{ devvm_swap_target.size_gb }}G {{ devvm_swap_target.path }}
          chown root:root {{ devvm_swap_target.path }}
          chmod 0600 {{ devvm_swap_target.path }}
          mkswap {{ devvm_swap_target.path }}
        creates: "{{ devvm_swap_target.path }}"

    # Resize to the target, but only while it is carrying nothing. Ordered BEFORE
    # the retire below so the other area is still providing cover during the
    # swapoff, which means there is never a swapless moment.
    - name: Resize the target swap file to the declared size
      when:
        - devvm_swap_target_stat.stat.exists
        - (devvm_swap_target_stat.stat.size | int) != (devvm_swap_target.size_gb | int * 1024 * 1024 * 1024)
        - devvm_swap_target.path in devvm_swap_empty.stdout_lines
      ansible.builtin.shell:
        cmd: |
          set -eu
          swapoff {{ devvm_swap_target.path }}
          fallocate -l {{ devvm_swap_target.size_gb }}G {{ devvm_swap_target.path }}
          chmod 0600 {{ devvm_swap_target.path }}
          mkswap {{ devvm_swap_target.path }}
          swapon {{ devvm_swap_target.path }}
      changed_when: true

    - name: Declare the target in fstab
      ansible.posix.mount:
        src: "{{ devvm_swap_target.path }}"
        path: none
        fstype: swap
        opts: sw
        state: present

    - name: Activate the target if it is not carrying yet
      when: devvm_swap_target.path not in devvm_swap_active.stdout
      ansible.builtin.command:
        cmd: "swapon {{ devvm_swap_target.path }}"
      changed_when: true

    # Re-read the target's size: the resize above may have just changed it.
    - name: Re-check the target swap file
      ansible.builtin.stat:
        path: "{{ devvm_swap_target.path }}"
      register: devvm_swap_target_now

    # Retire superseded areas, only when they hold nothing AND the target has
    # already reached its declared size. Both guards stay even though there is
    # only one file today, because they are what makes a future resize safe.
    # The size guard was written when /swapfile was 14G and /swapfile2 empty:
    # retiring on emptiness alone would have dropped total swap while the user
    # slices still held ceiling between them, shrinking capacity in the name of
    # tidiness. The path guard keeps this from ever acting on a device rather
    # than a file we made.
    - name: Retire superseded swap areas
      when:
        - item != devvm_swap_target.path
        - item is match('^/[^/]')
        - (devvm_swap_target_now.stat.size | int) == (devvm_swap_target.size_gb | int * 1024 * 1024 * 1024)
      loop: "{{ devvm_swap_empty.stdout_lines }}"
      ansible.builtin.shell:
        cmd: |
          set -eu
          swapoff {{ item }}
          rm -f {{ item }}
      changed_when: true

    - name: Drop superseded areas from fstab
      when:
        - item != devvm_swap_target.path
        - item is match('^/[^/]')
        - (devvm_swap_target_now.stat.size | int) == (devvm_swap_target.size_gb | int * 1024 * 1024 * 1024)
      loop: "{{ devvm_swap_empty.stdout_lines }}"
      ansible.posix.mount:
        src: "{{ item }}"
        path: none
        fstype: swap
        state: absent_from_fstab

    # ---- 8) resource containment (setup-devvm.sh section 10) ---------------
    # Added after 2026-06-22, when one user's runaway swap-thrashed the throttled
    # virtual disk into an IO storm and the box had to be hard-killed. The files
    # carry their own reasoning and are copied verbatim; only the caps are
    # parameterised, so a smaller machine does not get a cap larger than its RAM.
    #
    # Cap-and-kill, never throttle-and-pray: MemoryMax with MemorySwapMax=0 and
    # no MemoryHigh band, because with swap off a cgroup plateauing in a
    # high..max band is unreclaimable and livelocks instead of dying.
    - name: Cap every user slice
      ansible.builtin.template:
        src: files/devvm/50-devvm-resource.conf.j2
        dest: /etc/systemd/system/user-.slice.d/50-devvm-resource.conf
        mode: "0644"
      notify: reload systemd

    # tmux 3.4 puts every pane in its own transient scope, so one drop-in on the
    # scope UNIT TYPE caps each pane for every user with no per-session wiring.
    # This is the guard that should normally fire: the kernel then picks the
    # victim from inside the pane by raw RSS, so a spawned build dies and the
    # small claude that spawned it does not.
    - name: Cap every tmux pane
      ansible.builtin.template:
        src: files/devvm/50-devvm-pane-cap.conf.j2
        dest: /etc/systemd/user/scope.d/50-devvm-pane-cap.conf
        mode: "0644"
      notify: reload systemd

    - name: Give system.slice a priority edge
      ansible.builtin.copy:
        src: files/devvm/50-devvm-priority.conf
        dest: /etc/systemd/system/system.slice.d/50-devvm-priority.conf
        mode: "0644"
      notify: reload systemd

    # earlyoom, not systemd-oomd: oomd only acts on cgroups doing active
    # reclaim, and a no-swap anon workload never reclaims, so it is inert here.
    - name: Configure the earlyoom backstop
      ansible.builtin.copy:
        src: files/devvm/earlyoom.default
        dest: /etc/default/earlyoom
        mode: "0644"
      notify: restart earlyoom

    - name: Enable earlyoom
      ansible.builtin.systemd_service:
        name: earlyoom
        enabled: true
        state: started

    # ---- 8-bis) fairness between users (2026-09-12) --------------------------
    # emo reported sessions becoming unusable when the box is under load. The
    # dominant cause was devvm's own QEMU read-IOPS cap and is fixed in
    # scripts/apply-mbps-caps.sh (cf71d9ca). These tasks are the second half:
    # once reads are no longer clipped at 120 IOPS, users can genuinely contend,
    # so the box needs to divide memory and disk fairly rather than by luck.
    # Design and measurements: docs/plans/2026-09-12-devvm-multiuser-fairness.md
    #
    # CPU is deliberately absent. CPUWeight is already 100 on every user slice
    # and cgroup v2 already enforces it, so shares are already equal. Measured
    # during a stall, the affected user's slice read cpu.pressure 0.00 against
    # io.pressure 73.93.

    # Without this the per-user MemoryLow below has an effective value of 0:
    # cgroup v2 hands protection down from the parent, and user.slice defaults
    # to none.
    - name: Give user.slice a parent memory floor
      ansible.builtin.copy:
        src: files/devvm/50-devvm-user-slice-floor.conf
        dest: /etc/systemd/system/user.slice.d/50-devvm-user-slice-floor.conf
        mode: "0644"
      notify: reload systemd

    # Two identical copies of this existed under /etc/sysctl.d/ (23 May and
    # 8 June), in no repository and referenced by no commit. Replaced by one
    # declared file; the value itself is unchanged.
    - name: Declare vm.swappiness
      ansible.builtin.copy:
        src: files/devvm/99-devvm-swappiness.conf
        dest: /etc/sysctl.d/99-devvm-swappiness.conf
        mode: "0644"
      notify: reload sysctl

    # Deleting the tasks that wrote these does NOT delete the files: the copy
    # module only ever adds. Proved it the hard way on 2026-09-12 — the BFQ
    # tasks were removed, the playbook reported changed=0, and a
    # `udevadm trigger` put the scheduler straight back to bfq because the rule
    # was still sitting in /etc/udev/rules.d. An artefact needs an explicit
    # absent task for at least one release after its writer goes.
    - name: Remove the BFQ scheduler artefacts
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/udev/rules.d/60-devvm-bfq.rules
        - /etc/modules-load.d/devvm-bfq.conf
      notify: reload udev

    - name: Put rotational disks back on mq-deadline
      # BFQ was reverted on 2026-09-12 after measuring it 2.5x worse on reads
      # and 13x worse on writes than mq-deadline at identical load. Setting the
      # value rather than only deleting the rule, because a running machine
      # keeps whatever the rule last selected until something changes it.
      ansible.builtin.shell: |
        set -e
        for d in /sys/block/sd[a-z]; do
          [ -w "$d/queue/scheduler" ] || continue
          grep -q '\[bfq\]' "$d/queue/scheduler" && echo mq-deadline > "$d/queue/scheduler" || true
        done
      changed_when: false

    - name: Remove the undeclared swappiness files this replaces
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/sysctl.d/99-swappiness.conf
        - /etc/sysctl.d/99-workstation-swap.conf
      notify: reload sysctl


    # Protects the working set of panes somebody has actually used, so
    # re-attaching to a session does not have to fault it back off a spindle.
    - name: Install the pane swap guard
      ansible.builtin.copy:
        src: files/devvm/devvm-pane-swap-guard.sh
        dest: /usr/local/bin/devvm-pane-swap-guard.sh
        mode: "0755"

    - name: Install the pane swap guard units
      ansible.builtin.copy:
        src: "files/devvm/{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
        mode: "0644"
      loop:
        - devvm-pane-swap-guard.service
        - devvm-pane-swap-guard.timer
      notify: reload systemd

    # io.weight would be the natural way to do this and is inert without BFQ,
    # which was measured 2.5x worse on reads here and reverted. io.max works
    # under any scheduler but is a fixed number, so a share sized for several
    # users still caps a lone user at 3am. io.latency would solve both and is
    # not compiled into this kernel. So the work-conserving half is done in
    # userspace: count who is actually working and divide the device between
    # them, lifting the caps entirely when someone is alone.
    - name: Install the IO fairshare reconciler
      ansible.builtin.copy:
        src: files/devvm/devvm-io-fairshare.sh
        dest: /usr/local/bin/devvm-io-fairshare.sh
        mode: "0755"

    - name: Install the IO fairshare units
      ansible.builtin.copy:
        src: "files/devvm/{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
        mode: "0644"
      loop:
        - devvm-io-fairshare.service
        - devvm-io-fairshare.timer
      notify: reload systemd

    - name: Enable the IO fairshare timer
      ansible.builtin.systemd_service:
        name: devvm-io-fairshare.timer
        enabled: true
        state: started
        daemon_reload: true

    - name: Enable the pane swap guard timer
      ansible.builtin.systemd_service:
        name: devvm-pane-swap-guard.timer
        enabled: true
        state: started
        daemon_reload: true

    # ---- 8a) the shared playwright-mcp browsers ------------------------------
    # Adopted 2026-09-03 for bead code-r725. On 2026-06-12 a headless Chrome
    # from the playwright-shared MCP wedged its swiftshader-webgl gpu-process
    # at about 10.5 cores for 6.5 hours on a blank page, dominating this box
    # and the Proxmox host and starving etcd. The MCP's own browser_close did
    # not clear it, because page.close never reaches a spinning GPU process.
    #
    # Two halves. The quota bounds the damage the moment it starts; the reaper
    # clears it a few minutes later so nobody has to notice. Each file carries
    # its own reasoning, including how the reaper is kept away from a browser
    # a person started themselves.
    #
    # Note for a rebuild: playwright-mcp@.service and its snapshot-refresh
    # timer are NOT declared by this playbook. They were hand-installed in
    # /etc/systemd/system on 2026-06-20 and no repository holds them, so a
    # fresh machine gets this cap and this reaper with nothing to act on.
    - name: Cap the playwright-mcp browser slice
      ansible.builtin.copy:
        src: files/devvm/50-devvm-playwright-cpu.conf
        dest: '/etc/systemd/system/system-playwright\x2dmcp.slice.d/50-devvm-playwright-cpu.conf'
        mode: "0644"
        owner: root
        group: root
      notify: reload systemd

    - name: Install the playwright browser reaper
      ansible.builtin.copy:
        src: files/devvm/playwright-reaper
        dest: /usr/local/bin/playwright-reaper
        mode: "0755"
        owner: root
        group: root

    - name: Configure the playwright browser reaper
      ansible.builtin.copy:
        dest: /etc/default/playwright-reaper
        mode: "0644"
        owner: root
        group: root
        content: |
          # Managed by playbooks/devvm.yml -- edit there, not here.
          # Cores a gpu-process has to hold before a sample counts against it,
          # and how many consecutive one-minute samples it takes to be killed.
          PLAYWRIGHT_REAPER_THRESHOLD_CORES={{ devvm_playwright_reaper_threshold_cores }}
          PLAYWRIGHT_REAPER_WINDOW_MINUTES={{ devvm_playwright_reaper_window_minutes }}
          PLAYWRIGHT_REAPER_DRY_RUN=0
      notify: reload systemd

    - name: Install the playwright reaper units
      ansible.builtin.copy:
        src: "files/devvm/{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
        mode: "0644"
        owner: root
        group: root
      loop:
        - playwright-reaper.service
        - playwright-reaper.timer
      notify: reload systemd

    # Skipped under --check: the unit file has not been written yet on a box
    # that has never had this applied, and systemd cannot be asked about a
    # unit that does not exist. Without the guard the documented check-first
    # workflow fails on a fresh machine rather than reporting the change.
    - name: Enable the playwright reaper timer
      ansible.builtin.systemd_service:
        name: playwright-reaper.timer
        enabled: true
        state: started
        daemon_reload: true
      when: not ansible_check_mode

    # ---- 8a-bis) the log shipper ---------------------------------------------
    # scripts/devvm-promtail.yaml has described itself as the source of truth
    # since it was written, but nothing applied it: /etc/promtail/config.yml was
    # hand-deployed and dated 2026-07-09. The two were byte-identical when checked
    # on 2026-09-01, so this task takes ownership without changing behaviour --
    # and a committed change to the shipper now reaches the box instead of waiting
    # for someone to remember.
    #
    # The identifier allowlist in that file is what gives Loki rules a label to
    # select on. A rule keyed to an identifier missing from the allowlist matches
    # nothing and reports no error, so the two files have to move together.
    - name: Deploy the promtail config
      ansible.builtin.copy:
        src: ../scripts/devvm-promtail.yaml
        dest: /etc/promtail/config.yml
        owner: root
        group: root
        mode: "0644"
      notify: restart promtail

    - name: Enable promtail
      ansible.builtin.systemd_service:
        name: promtail
        enabled: true
        state: started

    # ---- 8b) node_exporter textfile collector -------------------------------
    # tl-session-watch (terminal-lobby package) writes per-session pane memory
    # here every 30s, which is what gives us a history to move the 3G pane
    # threshold on evidence rather than a guess. The collector is off by default
    # (ARGS=""), and turning it on needs no new scrape target: the `devvm`
    # Prometheus job already scrapes 10.0.10.10:9100 and applies no metric
    # keep-list, so tl_pane_* is ingested as soon as it appears.
    #
    # Design: docs/plans/2026-09-01-devvm-session-loss-alerting.md
    - name: Create the node_exporter textfile directory
      ansible.builtin.file:
        path: /var/lib/node_exporter/textfile
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Point node_exporter at the textfile directory
      ansible.builtin.copy:
        dest: /etc/default/prometheus-node-exporter
        mode: "0644"
        content: |
          # Managed by playbooks/devvm.yml -- edit there, not here.
          #
          # The textfile collector is what carries tl_pane_memory_bytes,
          # tl_pane_memory_max_bytes and tl_pane_top_is_claude from
          # tl-session-watch into Prometheus. Those are history for tuning the
          # pane threshold; the alerts themselves come from the journal, because
          # a 2-minute scrape cannot see a pane cross its cap and die inside one
          # interval.
          ARGS="--collector.textfile.directory=/var/lib/node_exporter/textfile"
      notify: restart node-exporter

    # Per-cgroup IO accounting, 2026-09-13.
    #
    # The kernel was already counting: the `io` controller is delegated into
    # system.slice and user.slice, so every cgroup carries a populated io.stat.
    # What was missing was anyone reading it, so "which service wrote those
    # 2 TB" had no answer past the whole-disk total. Measured that day, over
    # 56.7 days of uptime: 2,124 GB written box-wide, of which user-1002 467 GB,
    # user-1000 349 GB and containerd 111 GB.
    #
    # DefaultIOAccounting adds the other half: systemd surfaces the counters as
    # unit properties, so `systemctl show <unit> -p IOReadBytes -p IOWriteBytes`
    # answers directly, and units whose parent does not already delegate `io`
    # get the controller too. It applies to units started after a daemon-reexec.
    # ansible.builtin.copy does not create parent directories, and a stock
    # Ubuntu 24.04 has no /etc/systemd/system.conf.d until something makes one.
    - name: Make room for systemd manager drop-ins
      ansible.builtin.file:
        path: /etc/systemd/system.conf.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Account for IO on every unit
      ansible.builtin.copy:
        src: files/devvm/50-devvm-io-accounting.conf
        dest: /etc/systemd/system.conf.d/50-devvm-io-accounting.conf
        mode: "0644"
        owner: root
        group: root
      notify: reexec systemd

    # Counters in sysfs have no history and no attribution once a cgroup dies,
    # so they are sampled into the textfile collector every 30 s. The script's
    # own docstring carries the measurements and the reason it accumulates
    # rather than snapshots.
    - name: Install the cgroup IO exporter
      ansible.builtin.copy:
        src: files/devvm/cgroup-io-export
        dest: /usr/local/bin/cgroup-io-export
        mode: "0755"
        owner: root
        group: root

    - name: Install the cgroup IO exporter units
      ansible.builtin.copy:
        src: "files/devvm/{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
        mode: "0644"
        owner: root
        group: root
      loop:
        - cgroup-io-export.service
        - cgroup-io-export.timer
      notify: reload systemd

    - name: Enable the cgroup IO exporter timer
      ansible.builtin.systemd_service:
        name: cgroup-io-export.timer
        enabled: true
        state: started
        daemon_reload: true

    - name: Enable node_exporter
      ansible.builtin.systemd_service:
        name: prometheus-node-exporter
        enabled: true
        state: started

    # ---- 8c) the k8s node drift check ---------------------------------------
    # The devvm is where ansible, the node SSH keys and a kubeconfig already
    # live, so it is where the check that compares the six k8s nodes against
    # playbooks/k8s-node-tuning.yml runs. Added 2026-09-05 for bead code-yypr.
    #
    # It REPORTS, it does not repair. Several docs claimed for two days that the
    # node tuning was "reconciled hourly"; nothing scheduled it, on this box or
    # anywhere else, and the claim outlived every grep for it. This is the
    # schedule those docs were describing, with one deliberate difference: an
    # unattended run that WROTE kubelet config to six nodes could brick a node at
    # its next boot with console-only recovery, so a person reads the alert and
    # runs the playbook. What changes is that the person finds out.
    #
    # Reaches Slack through Prometheus: the script pushes gauges to the
    # pushgateway, five rules in stacks/monitoring read them, and Alertmanager
    # routes warning to #alerts. The freshness of the metric is alerted on too,
    # so a checker that quietly stops running is itself the signal.
    - name: Install the k8s node drift check
      ansible.builtin.copy:
        src: ../scripts/k8s-node-drift-check
        dest: /usr/local/bin/k8s-node-drift-check
        mode: "0755"
        owner: root
        group: root

    - name: Install the k8s node drift check units
      ansible.builtin.copy:
        src: "files/devvm/{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
        mode: "0644"
        owner: root
        group: root
      loop:
        - k8s-node-drift-check.service
        - k8s-node-drift-check.timer
      notify: reload systemd

    # Same --check guard as the playwright reaper above: on a box that has never
    # had this applied the unit file does not exist yet, and systemd cannot be
    # asked about a unit that is not there.
    - name: Enable the k8s node drift check timer
      ansible.builtin.systemd_service:
        name: k8s-node-drift-check.timer
        enabled: true
        state: started
        daemon_reload: true
      when: not ansible_check_mode

    # ---- 9) docker containment ----------------------------------------------
    - name: Create the capped docker slice
      ansible.builtin.template:
        src: files/devvm/docker.slice.j2
        dest: /etc/systemd/system/docker.slice
        mode: "0644"
      notify: reload systemd

    # A merge, not a rewrite: daemon.json also carries buildkit and the nvidia
    # runtime, and clobbering those would be a worse outage than no cap.
    - name: Read the current docker daemon config
      ansible.builtin.slurp:
        src: /etc/docker/daemon.json
      register: docker_daemon_raw
      failed_when: false
      check_mode: false

    - name: Parse the current docker daemon config
      ansible.builtin.set_fact:
        docker_daemon: >-
          {{ (docker_daemon_raw.content | b64decode | from_json)
             if (docker_daemon_raw.content is defined) else {} }}

    # Guarded on the VALUE, not on the rendering. Writing the merged JSON
    # unconditionally reformats a file that is already correct, and the handler
    # would then restart dockerd -- interrupting every running container -- for a
    # whitespace difference.
    - name: Point dockerd at the capped slice
      when: docker_daemon.get('cgroup-parent') != 'docker.slice'
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        mode: "0644"
        content: "{{ docker_daemon | combine({'cgroup-parent': 'docker.slice'}) | to_nice_json }}\n"
      notify: restart docker

    # ---- 14) the lobby's identity boundary ----------------------------------
    # Measured 2026-09-11. The five lobby HTTP services and ttyd believe
    # whatever X-Authentik-Username they are handed, they listen on every
    # interface because Traefik runs off-host, and nothing filtered the ports:
    # ufw inactive, both iptables and ip6tables at policy ACCEPT. One curl from
    # the LAN, either WireGuard tunnel, Headscale, or another account on this
    # box was a shell as any mapped user, and Authentik never saw it, because
    # Authentik was never in the path.
    #
    # Three tasks, because the hole has three doors: the shared secret the
    # services now demand, the one port that secret cannot cover, and the SSH
    # keys that reach the same account by another route.
    #
    # ORDER: the proxy half lives in stacks/terminal (the tl-proxy-secret
    # middleware) and must be applied FIRST. This file only makes the box
    # require a header Traefik has already started sending; run it the other way
    # round and every lobby request fails until the apply lands.

    - name: Read the lobby proxy secret
      ansible.builtin.command: vault kv get -field=proxy_secret secret/terminal-lobby
      delegate_to: localhost
      become: false
      register: devvm_tl_proxy_secret
      changed_when: false
      check_mode: false
      no_log: true

    - name: Filter ttyd down to the proxy
      ansible.builtin.copy:
        dest: /etc/nftables.conf
        owner: root
        group: root
        mode: "0755"
        content: |
          #!/usr/sbin/nft -f
          # Managed by playbooks/devvm.yml. Local edits are overwritten.

          # Idempotent delete: `table` creates it if absent so `delete` always
          # has something to remove. Never `flush ruleset` here -- see the task.
          table inet devvm_lobby
          delete table inet devvm_lobby

          table inet devvm_lobby {
            chain input {
              # policy accept, priority ahead of docker's chains: this table
              # adds one restriction and leaves every other port alone.
              type filter hook input priority -10; policy accept;

              iif lo accept

              # The Traefik nodes, and this box reaching its own address.
              tcp dport 7681 ip saddr { 10.0.10.10, 10.0.20.102, 10.0.20.103, 10.0.20.104, 10.0.20.105 } accept
              tcp dport 7681 drop
            }
          }
      notify: reload nftables

    # Anti-lockout, same reason the break-glass runbook validates sshd before a
    # reload: a ruleset that does not parse would take the nftables unit down
    # with it, and the handler below fires at the end of the play where the
    # failure is furthest from its cause.
    - name: Check the filter parses
      ansible.builtin.command: nft -c -f /etc/nftables.conf
      changed_when: false

    - name: Load the filter at boot
      ansible.builtin.systemd_service:
        name: nftables
        enabled: true
        state: started

    # SSH reaches the same account the lobby does, so leaving it on passwords
    # would just move the door. sshd takes the FIRST value it reads for a
    # keyword and reads sshd_config.d/*.conf in lexical order, so this file has
    # to sort ahead of 50-cloud-init.conf, which ships PasswordAuthentication
    # yes. Hence the 10- prefix; renaming it silently restores passwords.
    - name: Refuse SSH passwords
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/10-devvm-hardening.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          # Managed by playbooks/devvm.yml. Local edits are overwritten.
          # Must sort before 50-cloud-init.conf: first value wins.
          PasswordAuthentication no
          KbdInteractiveAuthentication no
      notify: restart ssh

    # `sshd -t` reads the real config and every drop-in, which is the only way
    # to test one: `-f` on the fragment alone would judge it as a whole config
    # and fail on what it does not contain. Runs before the handler, so a bad
    # drop-in stops the play instead of stopping sshd.
    - name: Check the SSH config parses
      ansible.builtin.command: sshd -t
      changed_when: false

    # Declarative, because the interesting failure is a key nobody removed.
    # wizard holds (ALL) NOPASSWD: ALL, so every key here is root on the box,
    # and on 2026-09-11 five of the ten belonged to machines rather than to a
    # person: two pods that no longer exist under those names, a phpIPAM cronjob
    # whose key is for pfSense, a postmortem pipeline that SSHes nowhere, and
    # openclaw. None had been used in the 30 days of sshd logs. They are gone,
    # and `exclusive` is what keeps them gone.
    #
    # The set lives in Vault, not here: this repo has a public mirror, and the
    # list of keys that reach root on the workstation is not something to
    # publish. secret/devvm-authorized-keys -> wizard, one key per line.
    # A service that needs back in gets its own line with a forced command, the
    # way woodpecker-terminal-lobby already does, not a bare key.
    - name: Read the admin's approved keys
      ansible.builtin.command: vault kv get -field={{ devvm_admin_user }} secret/devvm-authorized-keys
      delegate_to: localhost
      become: false
      register: devvm_admin_keys
      changed_when: false
      check_mode: false
      no_log: true

    - name: Declare the admin's authorised keys
      ansible.posix.authorized_key:
        user: "{{ devvm_admin_user }}"
        key: "{{ devvm_admin_keys.stdout }}"
        exclusive: true
      no_log: true

    # ---- 15) the agent-api tailnet leg --------------------------------------
    # agent-api is Terminal Lobby's machine-facing interface, and it is reached
    # over the Headscale tailnet and nowhere else, so this box has to be a node
    # on it. Design: docs/plans/2026-09-14-muse-agent-broker-design.md.
    #
    # It was not a node. Measured 2026-09-16: no tailscaled socket for wizard,
    # the packaged tailscaled.service disabled and inactive, and no Tailscale
    # task anywhere in this playbook — while devvm-emo (100.64.0.61) had been
    # on the tailnet since 2026-08-14.
    #
    # KNOWN, NOT MISSED: that emo node is an unprivileged userspace tailscaled
    # out of /home/emo/.tailscale-us on ports 1055 and 1056, started by hand and
    # declared in no repository. It predates any playbook entry for Tailscale,
    # and this section deliberately leaves it where it is — adopting it is a
    # separate change, and the ports here are chosen so the two never collide.
    # A rebuilt machine therefore gets this leg and not emo's, the same gap
    # section 8a records for playwright-mcp@.service.
    #
    # UNTAGGED, on purpose. Tagging the node needs tagOwners and an acls entry
    # in stacks/headscale/acl.hujson, which is git-crypt encrypted and edited
    # from the main checkout only; that is out of scope here, and Headscale
    # refuses a tag its ACL does not own. The node belongs to the Headscale user
    # whose pre-auth key registered it.
    - name: Install the Tailscale signing key
      ansible.builtin.get_url:
        url: https://pkgs.tailscale.com/stable/ubuntu/jammy.asc
        dest: /usr/share/keyrings/tailscale-archive-keyring.asc
        mode: "0644"
        # Without this the key is re-fetched on every run and the task reports
        # changed forever, which is the noise that teaches people to ignore a
        # non-no-op check run. A signing key does not rotate silently; replace
        # it deliberately by removing the file.
        force: false

    # jammy, not noble, for the reason the HashiCorp source above gives: it is
    # the suite the installed tailscale was resolved from, and moving it here
    # would offer a different upgrade path as a side effect of a key change.
    - name: Declare the Tailscale apt source
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/tailscale.list
        mode: "0644"
        content: |
          # Managed by playbooks/devvm.yml. Local edits are overwritten.
          deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.asc] https://pkgs.tailscale.com/stable/ubuntu jammy main

    # Same reasoning as the HashiCorp keyring: the source above no longer names
    # the binary copy the hand install left behind, so it is dead weight that
    # still looks authoritative.
    - name: Drop the superseded Tailscale binary keyring
      ansible.builtin.file:
        path: /usr/share/keyrings/tailscale-archive-keyring.gpg
        state: absent

    # Already on the live box at 1.98.3 from a hand install; declared so a
    # rebuilt machine has it too. Not in packages.txt, which documents itself as
    # a safe argument to `apt-get install` from the standard repos — this comes
    # from Tailscale's own.
    #
    # No cache_valid_time here, unlike section 1: the source above was declared
    # seconds ago, and section 1 has already refreshed the cache this run, so a
    # validity window would let this task skip the update and then fail to find
    # the package on the one machine that needs it — a fresh one.
    - name: Install tailscale
      ansible.builtin.apt:
        name: tailscale
        state: present
        update_cache: true

    - name: Create the userspace tailscaled state directory
      ansible.builtin.file:
        path: "{{ devvm_tailscale_state_dir }}"
        state: directory
        owner: "{{ devvm_tailscale_user }}"
        group: "{{ devvm_tailscale_user }}"
        mode: "0700"

    - name: Install the userspace tailscaled unit
      ansible.builtin.template:
        src: files/devvm/tailscaled-agent.service.j2
        dest: /etc/systemd/system/tailscaled-agent.service
        owner: root
        group: root
        mode: "0644"
      notify:
        - reload systemd
        - restart tailscaled-agent

    # Skipped under --check for the same reason as the playwright reaper timer:
    # on a machine that has never had this applied the unit file does not exist
    # yet, and systemd cannot be asked about a unit it has never seen.
    - name: Enable the userspace tailscaled
      ansible.builtin.systemd_service:
        name: tailscaled-agent.service
        enabled: true
        state: started
        daemon_reload: true
      when: not ansible_check_mode

    - name: Read the tailnet login state
      ansible.builtin.command: >-
        tailscale --socket={{ devvm_tailscale_state_dir }}/ts.sock status --json
      changed_when: false
      failed_when: false
      # Read-only, and the fact below is undefined without it, so it has to run
      # under --check as well.
      check_mode: false
      register: devvm_ts_status_raw

    - name: Parse the tailnet login state
      # `status --json` exits 0 with valid JSON in BOTH states — BackendState is
      # "Running" when registered and "NeedsLogin" when not — so this parses
      # either way. Guard on rc so a daemon that is not up yet reads as
      # DaemonError instead of failing inside the template.
      ansible.builtin.set_fact:
        devvm_ts_backend_state: >-
          {{ (devvm_ts_status_raw.stdout | from_json).BackendState | default('Unknown')
             if devvm_ts_status_raw.rc == 0 else 'DaemonError' }}

    - name: Show the tailnet login state
      ansible.builtin.debug:
        msg: "tailscaled ({{ devvm_tailscale_user }}) BackendState={{ devvm_ts_backend_state }}"

    # Registration runs ONLY when the daemon is not already Running, which is
    # what makes a converged re-run report changed=0 and mint nothing. Pre-auth
    # keys are single-use: registering unconditionally would spend one on every
    # apply and leave a trail of duplicate nodes in Headscale. Same shape as
    # playbooks/pfsense-tailscale.yml.
    - name: Registration block
      when:
        - not ansible_check_mode
        - devvm_ts_backend_state != 'Running' or devvm_tailscale_force_register | bool
      block:
        - name: Read the pre-auth key from Vault
          # Same shape as the lobby proxy secret above: read on the control
          # node, never written to the box, never prompted for. Inside the block
          # on purpose — a registered machine needs no key at all, so a
          # converged re-run does not touch Vault.
          #
          # Mint and store one with (untagged, so no --tags):
          #   kubectl -n headscale exec deploy/headscale -c headscale -- \
          #     headscale preauthkeys create -u <user-id> -e 24h -o json
          #   vault kv put {{ devvm_tailscale_vault_path }} \
          #     {{ devvm_tailscale_vault_field }}=<key>
          ansible.builtin.command: >-
            vault kv get -field={{ devvm_tailscale_vault_field }}
            {{ devvm_tailscale_vault_path }}
          delegate_to: localhost
          become: false
          register: devvm_ts_preauth
          changed_when: false
          check_mode: false
          no_log: true

        - name: Write the pre-auth key to a private file
          # `tailscale up --auth-key <key>` puts a live single-use credential
          # in the process table for as long as registration runs, and no_log
          # suppresses Ansible's copy of the line, not the kernel's. /proc here
          # is mounted without hidepid, and four accounts have shells, so any
          # of them can read another's argv — measured 2026-09-16 by reading
          # the emo tailscaled command line as wizard.
          #
          # The installed tailscale (1.98.3) documents the indirection:
          #   --auth-key value  node authorization key; if it begins with
          #                     "file:", then it's a path to a file containing
          #                     the authkey
          # Verified against that binary: a missing path fails with
          # "open <path>: no such file or directory", so the file really is
          # read rather than the string being taken literally.
          #
          # 0600 inside the 0700 state dir, and removed by the `always` below
          # whether registration succeeds or fails. The play runs as root, so
          # root reads it regardless of the owner.
          ansible.builtin.copy:
            dest: "{{ devvm_tailscale_preauth_file }}"
            content: "{{ devvm_ts_preauth.stdout }}"
            owner: "{{ devvm_tailscale_user }}"
            group: "{{ devvm_tailscale_user }}"
            mode: "0600"
          no_log: true

        - name: Register with Headscale
          # No --advertise-tags — see the section comment.
          #
          # no_log was dropped when the key moved off the argv. It was hiding
          # the secret in this command line, and the line no longer has one;
          # what it also hid was the stderr that says WHY registration failed,
          # so a spent key surfaced as "output has been hidden" and nothing
          # else. The remaining output goes to the terminal of whoever ran the
          # play, and the Vault read above uses that same person's token
          # (delegate_to: localhost, become: false), so they can already read
          # the key directly. This playbook is hand-run; no CI job invokes it.
          #
          # --accept-dns=false because accepting DNS means rewriting
          # /etc/resolv.conf, which an unprivileged userspace daemon cannot do
          # and should not be doing to a shared box. --accept-routes=false
          # because there is no routing table here to install subnet routes
          # into. Both match what the pfSense subnet router runs.
          ansible.builtin.command: >-
            tailscale --socket={{ devvm_tailscale_state_dir }}/ts.sock up
            --login-server {{ devvm_tailscale_login_server }}
            --auth-key file:{{ devvm_tailscale_preauth_file }}
            --hostname {{ devvm_tailscale_hostname }}
            --accept-dns=false
            --accept-routes=false
            --timeout 60s
          changed_when: true

        - name: Wait for the node to reach Running
          # Guarded on rc and on stdout being non-empty, for the same reason
          # "Parse the tailnet login state" above is: `tailscale status --json`
          # exits 1 with EMPTY stdout when the daemon is momentarily gone (it
          # hit Restart=on-failure, or the socket is not back yet), and
          # `'' | from_json` raises INSIDE the until condition. That aborts the
          # task on the first attempt with "Unexpected failure during module
          # execution: Expecting value: line 1 column 1", consuming none of the
          # retries — so the task that exists to tolerate a slow start would be
          # the one that kills the play. Reproduced on ansible-core 2.16.3 and
          # pinned by tests/devvm-agent-tailnet.test.sh.
          #
          # An empty string never equals 'Running', so a bad read degrades into
          # a retry. Exhausting all 20 still fails the play, which is right: a
          # daemon that never comes back is not a success.
          ansible.builtin.command: >-
            tailscale --socket={{ devvm_tailscale_state_dir }}/ts.sock status --json
          register: devvm_ts_wait
          until: >-
            ((devvm_ts_wait.stdout | from_json).BackendState | default('')
             if devvm_ts_wait.rc == 0 and devvm_ts_wait.stdout | trim | length > 0
             else '') == 'Running'
          retries: 20
          delay: 6
          changed_when: false

      # Runs whether registration succeeded or failed, which a trailing task in
      # the block would not: a `tailscale up` that errors out is exactly when a
      # live key must not be left on disk. The block's `when` is inherited here
      # too, so a converged re-run skips this along with the rest and still
      # reports changed=0.
      #
      # Nothing is lost by removing it: the registered node key lives in the
      # state dir, not in the pre-auth key. Same reasoning as "Clear the stored
      # pre-auth key" in playbooks/pfsense-tailscale.yml.
      always:
        - name: Remove the pre-auth key file
          ansible.builtin.file:
            path: "{{ devvm_tailscale_preauth_file }}"
            state: absent

    - name: Verify the node holds a tailnet address
      ansible.builtin.command: >-
        tailscale --socket={{ devvm_tailscale_state_dir }}/ts.sock ip -4
      register: devvm_ts_ip
      changed_when: false
      failed_when: devvm_ts_ip.rc != 0 or devvm_ts_ip.stdout is not match('^100\\.')
      when: not ansible_check_mode

    # agent-api's trace is the record of everything a caller asked this box to
    # do, so it is kept for 30 days on disk and then it goes. Promtail ships the
    # same file to Loki, which is where cluster-wide search and the longer
    # history live; this only bounds the local copy.
    # 0700, not 0755. The trace holds Muse's verbatim request and a full
    # replay of the run, and ancamilea, emo and breakglass all have shells on
    # this box. agent-api picks the trace file's own mode, and a Go
    # os.OpenFile(..., 0666) under the default umask lands at 0644, so the
    # directory is what has to close it. Promtail reads it as root either way,
    # and logrotate is told `su {{ devvm_tailscale_user }}` below, so nothing
    # needs group access — which is also why this is 0700 rather than 0750
    # root:adm: adm membership can grow later without anyone rereading this.
    # Matches the 0700 on the tailscaled state dir above, and on
    # /var/log/private and /var/log/letsencrypt.
    # These three sit after registration on purpose: TL_AGENT_BIND is read
    # from the running daemon, so the node has to hold an address first.

    # One read per agent. A missing field is NOT fatal: an agent listed here
    # whose token was never minted, or was cleared by agent-api-kill, simply
    # gets no line written below. Failing the whole play would mean one
    # half-onboarded agent stops the box reconciling anything else.
    - name: Read each external agent's bearer token from Vault
      ansible.builtin.command: >-
        vault kv get -field=agent_api_{{ item.name }}_token
        {{ devvm_agent_api_vault_path }}
      delegate_to: localhost
      become: false
      loop: "{{ devvm_external_agents }}"
      loop_control:
        label: "{{ item.name }}"
      register: devvm_agent_api_tokens
      changed_when: false
      check_mode: false
      failed_when: false
      no_log: true

    # agent-api binds loopback plus this address and refuses to start on a
    # wildcard, so the value has to be the node's real tailnet address. Read it
    # from the running daemon rather than pinning a literal: Headscale assigns
    # it, and a re-registered node can come back on a different one.
    - name: Read the node's tailnet address
      ansible.builtin.command: >-
        tailscale --socket={{ devvm_tailscale_state_dir }}/ts.sock ip -4
      register: devvm_tailscale_ip
      changed_when: false
      check_mode: false
      failed_when: devvm_tailscale_ip.stdout | trim | length == 0

    # Replaces the file wholesale rather than editing a line into it: the
    # package owns /etc/terminal-lobby.conf and never touches this one, so this
    # is the whole of what the box overrides, and a rebuilt machine gets it.
    - name: Make the lobby services demand the proxy secret
      ansible.builtin.copy:
        dest: /etc/terminal-lobby.local.conf
        owner: root
        group: root
        mode: "0640"
        content: |
          # Managed by playbooks/devvm.yml. Local edits are overwritten.
          #
          # The identity header this box's proxy sends. Authentik's outpost sets
          # it, and Traefik's forward-auth middleware replaces whatever the
          # client sent, so the value arriving here is Authentik's.
          TL_AUTH_HEADER=X-Authentik-Username

          # Traefik is not on this host, so the services cannot bind loopback.
          TL_BIND=0.0.0.0

          # Which is why they demand this second header as well. Without it a
          # caller who can reach the port is whoever they claim to be. Traefik
          # stamps it via the tl-proxy-secret middleware in stacks/terminal;
          # both halves read Vault secret/terminal-lobby -> proxy_secret, so
          # rotating means writing that key and re-running both.
          TL_PROXY_SECRET={{ devvm_tl_proxy_secret.stdout }}

          # agent-api ignores TL_BIND and binds loopback ONLY. It is reached
          # over the tailnet, but the daemon runs in userspace-networking mode,
          # so there is no TUN device and the 100.64.x.x address is not a local
          # address at all: binding it fails with "cannot assign requested
          # address". `tailscale serve --tcp` below forwards the tailnet port to
          # this loopback one instead, which is how userspace mode accepts
          # inbound. Leaving TL_AGENT_BIND unset is therefore correct here, not
          # an omission.
          TL_AGENT_BIND=

          # Per-caller bearer credentials for agent-api. See the task that
          # writes this file for why root owns it.
          TL_BEARER_TOKENS={{ devvm_agent_api_tokens_file }}
      no_log: true
      notify: restart lobby services

    # One credential per line: <name> sha256:<digest> <os-user>. Root-owned and
    # group-readable by the account the services run as, which is the one
    # ownership authuser accepts. Revoking a caller is removing its line.
    #
    # The whole file is rewritten from the list every run, so the list is the
    # truth: an agent deleted from devvm_external_agents loses access here
    # without anybody remembering to clean up after it.
    - name: Write the external agents' bearer credentials
      ansible.builtin.copy:
        dest: "{{ devvm_agent_api_tokens_file }}"
        owner: root
        group: "{{ devvm_tailscale_user }}"
        mode: "0640"
        content: |
          # Managed by playbooks/devvm.yml. Local edits are overwritten.
          # The second field is the token's sha256 digest, never the token:
          # a reader of this file cannot then authenticate as its holder.
          {% for r in devvm_agent_api_tokens.results | default([]) %}
          {% if r.rc | default(1) == 0 and (r.stdout | default('')) | length > 0 %}
          {{ r.item.name }} sha256:{{ r.stdout | hash('sha256') }} {{ r.item.os_user }}
          {% endif %}
          {% endfor %}
      no_log: true
      notify: restart lobby services

    # ttyd is the exception the config file itself calls out: it takes one
    # identity header and has nowhere to check a second, so the secret above
    # does not reach the single port that hands out a shell. A filter does.
    #
    # NOT the stock /etc/nftables.conf, which opens with `flush ruleset`.
    # iptables on this box is iptables-nft, so docker's live filter and nat
    # rules sit in the same netfilter ruleset and a global flush takes every
    # container's networking with it. This owns one table and deletes only that.

    # Userspace mode cannot accept inbound on a bound socket, so the tailnet
    # port is forwarded to loopback by the daemon itself. Checked before it is
    # set so a healthy re-run reports no change.
    - name: Read the current tailnet serve configuration
      ansible.builtin.command: >-
        tailscale --socket={{ devvm_tailscale_state_dir }}/ts.sock serve status
      register: devvm_tailscale_serve
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Expose agent-api on the tailnet
      ansible.builtin.command: >-
        tailscale --socket={{ devvm_tailscale_state_dir }}/ts.sock
        serve --bg --tcp {{ devvm_agent_api_port }}
        tcp://127.0.0.1:{{ devvm_agent_api_port }}
      when: >-
        ('tcp://127.0.0.1:' ~ devvm_agent_api_port) not in
        (devvm_tailscale_serve.stdout | default(''))
      changed_when: true

    - name: Create the agent-api log directory
      ansible.builtin.file:
        path: "{{ devvm_agent_api_log_dir }}"
        state: directory
        owner: "{{ devvm_tailscale_user }}"
        group: "{{ devvm_tailscale_user }}"
        mode: "0700"

    - name: Rotate the agent-api trace
      ansible.builtin.copy:
        dest: /etc/logrotate.d/agent-api
        owner: root
        group: root
        mode: "0644"
        content: |
          # Managed by playbooks/devvm.yml. Local edits are overwritten.
          {{ devvm_agent_api_log_dir }}/trace.jsonl {
            daily
            rotate 30
            compress
            notifempty
            missingok
            # The directory belongs to {{ devvm_tailscale_user }} rather than
            # root, and logrotate skips a log under a non-root directory unless
            # it is told whose it is. It skips it silently, which is the part
            # worth guarding against.
            su {{ devvm_tailscale_user }} {{ devvm_tailscale_user }}
            # copytruncate rather than create: agent-api appends to an open
            # descriptor and has no reopen signal, so renaming the file would
            # leave it writing to the rotated copy forever. Swap this for
            # create plus a postrotate reload if it ever grows one.
            copytruncate
          }

    - name: Check the rotation config parses
      # --debug is logrotate's dry run: it parses, says what it would do, and
      # writes nothing. Here for the same reason as the nftables and sshd
      # checks above: a fragment that does not parse stops the play at its
      # cause, where logrotate itself would only skip the file, silently, at
      # the next daily run.
      ansible.builtin.command: logrotate --debug /etc/logrotate.d/agent-api
      changed_when: false

    # ---- agentmd ---------------------------------------------------------------
    # One instance per devvm_agentmd_users entry, as that user. systemd holds
    # the port (agentmd@.socket) so no other account can bind it during a
    # restart, and the proxy secret is loaded as a credential, readable only by
    # the service and never written into the user's home.
    #
    # ORDER: stacks/agentmd must be applied first. It stamps the secret these
    # instances demand; run this the other way round and every request answers
    # 401 until the apply lands.

    - name: Read each agentmd proxy secret
      ansible.builtin.command: "vault kv get -field=proxy_secret_{{ item.name }} secret/agentmd"
      delegate_to: localhost
      become: false
      loop: "{{ devvm_agentmd_users }}"
      loop_control:
        label: "{{ item.name }}"
      register: devvm_agentmd_secrets
      changed_when: false
      check_mode: false
      no_log: true

    - name: Create the agentmd directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: root
        group: root
        mode: "{{ item.mode }}"
      loop:
        - { path: /etc/agentmd, mode: "0755" }
        - { path: /etc/agentmd/credentials, mode: "0700" }
        - { path: "/usr/local/lib/agentmd/{{ devvm_agentmd_version }}", mode: "0755" }

    # check_mode: false because get_url probes with HEAD during a dry run and
    # would report a change it cannot verify. The checksum pins the release.
    - name: Download agentmd
      ansible.builtin.get_url:
        url: "https://github.com/ViktorBarzin/agentmd/releases/download/{{ devvm_agentmd_version }}/agentmd_{{ devvm_agentmd_version | regex_replace('^v', '') }}_linux_amd64.tar.gz"
        dest: "/usr/local/lib/agentmd/{{ devvm_agentmd_version }}/agentmd.tar.gz"
        checksum: "sha256:{{ devvm_agentmd_sha256 }}"
        mode: "0644"
      check_mode: false

    - name: Unpack agentmd
      ansible.builtin.unarchive:
        src: "/usr/local/lib/agentmd/{{ devvm_agentmd_version }}/agentmd.tar.gz"
        dest: "/usr/local/lib/agentmd/{{ devvm_agentmd_version }}"
        remote_src: true
        creates: "/usr/local/lib/agentmd/{{ devvm_agentmd_version }}/agentmd"

    - name: Point agentmd at the pinned version
      ansible.builtin.file:
        src: "/usr/local/lib/agentmd/{{ devvm_agentmd_version }}/agentmd"
        dest: /usr/local/bin/agentmd
        state: link
        force: true
      notify: restart agentmd

    - name: Declare the machine-wide agentmd config
      ansible.builtin.copy:
        src: files/devvm/agentmd-config.toml
        dest: /etc/agentmd/config.toml
        owner: root
        group: root
        mode: "0644"
      notify: restart agentmd

    - name: Name each agentmd user's Authentik identity
      ansible.builtin.copy:
        dest: "/etc/agentmd/{{ item.name }}.env"
        owner: root
        group: root
        mode: "0644"
        content: |
          # Managed by playbooks/devvm.yml. Local edits are overwritten.
          AGENTMD_IDENTITY={{ item.identity }}
      loop: "{{ devvm_agentmd_users }}"
      loop_control:
        label: "{{ item.name }}"
      notify: restart agentmd

    - name: Write each agentmd proxy secret
      ansible.builtin.copy:
        dest: "/etc/agentmd/credentials/{{ item.item.name }}"
        owner: root
        group: root
        mode: "0600"
        content: "{{ item.stdout }}\n"
      loop: "{{ devvm_agentmd_secrets.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      no_log: true
      notify: restart agentmd

    - name: Install the agentmd units
      ansible.builtin.copy:
        src: "files/devvm/{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - agentmd@.socket
        - agentmd@.service
      notify:
        - reload systemd
        - restart agentmd

    - name: Make room for each agentmd socket's port
      ansible.builtin.file:
        path: "/etc/systemd/system/agentmd@{{ item.name }}.socket.d"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop: "{{ devvm_agentmd_users }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Give each agentmd socket its port
      ansible.builtin.copy:
        dest: "/etc/systemd/system/agentmd@{{ item.name }}.socket.d/listen.conf"
        owner: root
        group: root
        mode: "0644"
        content: |
          # Managed by playbooks/devvm.yml. Local edits are overwritten.
          [Socket]
          ListenStream={{ item.port }}
      loop: "{{ devvm_agentmd_users }}"
      loop_control:
        label: "{{ item.name }}"
      notify: reload systemd

    # Skipped under --check: on a machine that has never had this applied the
    # units do not exist yet, and systemd cannot be asked about them.
    - name: Enable each agentmd socket and service
      ansible.builtin.systemd_service:
        name: "agentmd@{{ item.0.name }}.{{ item.1 }}"
        enabled: true
        state: started
        daemon_reload: true
      loop: "{{ devvm_agentmd_users | product(['socket', 'service']) | list }}"
      loop_control:
        label: "agentmd@{{ item.0.name }}.{{ item.1 }}"
      when: not ansible_check_mode

  handlers:
    # DefaultIOAccounting is a manager-level setting, so a reload is not
    # enough: systemd has to re-execute to pick it up. It is a re-exec of PID 1
    # and not a reboot, so nothing running is disturbed.
    - name: reexec systemd
      ansible.builtin.command: systemctl daemon-reexec
      changed_when: true

    - name: restart ssh
      ansible.builtin.systemd_service:
        name: ssh
        state: restarted

    # Restarting these drops no terminal: ttyd is deliberately not in the list,
    # and the five that are hold no session state of their own.
    - name: restart lobby services
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: restarted
      loop:
        - clipboard-upload
        - tmux-api
        - session-events
        - file-api
        - skills-api

    - name: reload nftables
      ansible.builtin.systemd_service:
        name: nftables
        state: reloaded
    - name: reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: reload udev
      ansible.builtin.shell: |
        set -e
        udevadm control --reload-rules
        udevadm trigger --subsystem-match=block --action=change
      changed_when: true

    - name: reload sysctl
      ansible.builtin.command: sysctl --system
      changed_when: true


    - name: restart earlyoom
      ansible.builtin.systemd_service:
        name: earlyoom
        state: restarted

    - name: restart node-exporter
      ansible.builtin.systemd_service:
        name: prometheus-node-exporter
        state: restarted

    - name: restart promtail
      ansible.builtin.systemd_service:
        name: promtail
        state: restarted

    # Restarting dockerd interrupts running containers, so it is a handler that
    # only fires when daemon.json actually changed.
    - name: restart docker
      ansible.builtin.systemd_service:
        name: docker
        state: restarted

    # Defined after `reload systemd` on purpose: handlers run in definition
    # order, not notification order, so the daemon-reload lands before this.
    # A restart drops the tailnet leg for a second or two, which is why it is a
    # handler rather than a state: restarted on the task — it fires only when
    # the unit file actually changed. Registration survives it: the node key
    # lives in the state directory, not in the unit.
    - name: restart tailscaled-agent
      ansible.builtin.systemd_service:
        name: tailscaled-agent.service
        state: restarted

    # The socket stays up, so the port is never released while the service
    # restarts.
    - name: restart agentmd
      ansible.builtin.systemd_service:
        name: "agentmd@{{ item.name }}.service"
        state: restarted
        daemon_reload: true
      loop: "{{ devvm_agentmd_users }}"
      loop_control:
        label: "{{ item.name }}"
      when: not ansible_check_mode
