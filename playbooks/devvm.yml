# Build a blank Ubuntu VM into a devvm workstation.
#
# This is the declarative half of scripts/workstation/setup-devvm.sh, which is
# correct but has only ever been run by hand — so a committed change to it could
# sit undeployed, and a new machine could not be built without someone
# remembering the steps. Everything here is idempotent and safe against the live
# box; run it with --check --diff first.
#
#   dry-run : ansible-playbook -i playbooks/inventory.ini playbooks/devvm.yml --check --diff
#   apply   : ansible-playbook -i playbooks/inventory.ini playbooks/devvm.yml
#   new box : ansible-playbook -i playbooks/inventory.ini playbooks/devvm.yml \
#               -e @extra.json
#
# Pass the admin SSH key through a JSON extra-vars FILE, not -e key=value: the
# key contains spaces, and -e splits on them, so the module receives a truncated
# key and fails with an unhelpful IndexError.
#   {"devvm_target": "devvm_test", "devvm_admin_ssh_key": "ssh-ed25519 AAAA... comment"}
#
# WHAT THIS COVERS
#   the apt toolset, node, the machine-wide PATH, the OIDC/secrets tooling, the
#   enforced Claude config, /etc/skel, the apt source that delivers
#   terminal-lobby, and three units that existed only on the box.
#
# WHAT IT DOES NOT COVER YET, in the order worth doing next
#   1. Resource containment (setup-devvm.sh section 10) — the per-user memory
#      caps and earlyoom backstop added after the 2026-06-22 overload, when the
#      box had to be hard-killed. A machine built without them repeats that.
#   2. The t3 service layer (section 9) — t3-dispatch, t3-serve@, the timers.
#   3. Per-user provisioning — accounts, groups, clones, kubeconfigs. That is
#      ViktorBarzin/infra#88, deliberately last because it touches live access.
#   Until those land, a machine built from this playbook serves the lobby but is
#   not a full workstation.
#
# NOT ADOPTED, and why
#   drone 1.7.0        Drone CLI; CI here is Woodpecker. Looks vestigial.
#   immich-go 0.9.4    personal photo tooling, not workstation base.
#   openclaw-task      a script belonging to the openclaw project, which should
#                      ship it the way infra ships the homelab CLI.
#   caddy              enabled and serving the stock page on :80, 0 requests in
#                      7 days. Parking it is a separate, reversible decision.

- name: devvm workstation base
  # Overridable so the same playbook can build a NEW machine without being
  # edited: -e devvm_target=<group-or-host>. Defaults to the live box.
  hosts: "{{ devvm_target | default('devvm') }}"
  become: true
  gather_facts: true

  vars:
    workstation_dir: "{{ playbook_dir }}/../scripts/workstation"
    node_major: 22
    # Latest, not pinned: nothing else in this pipeline pins versions either,
    # and these are tools rather than build inputs.
    kubelogin_url: https://github.com/int128/kubelogin/releases/latest/download/kubelogin_linux_amd64.zip
    terragrunt_url: https://github.com/gruntwork-io/terragrunt/releases/latest/download/terragrunt_linux_amd64
    # Containment caps. The absolute values are the ones tuned on the 31.3 GiB
    # devvm and reasoned about in the files themselves; the min() only keeps a
    # smaller machine sane, and reproduces 24/6/8 exactly on the real box.
    devvm_user_memory_max: "{{ [24, (ansible_memtotal_mb / 1024 * 0.9) | round | int] | min }}G"
    devvm_pane_memory_max: "{{ [6, (ansible_memtotal_mb / 1024 * 0.2) | round | int] | min }}G"
    devvm_docker_memory_max: "{{ [8, (ansible_memtotal_mb / 1024 * 0.3) | round | int] | min }}G"
    # Per-user swap, BOUNDED rather than off (2026-09-02). It was 0 from
    # 2026-06-22, when a user runaway swap-thrashed the throttled virtual disk
    # into an I/O storm and the box had to be hard-killed. Unlimited is what did
    # that: the storm ran swap to 15 GB. A ceiling of 4G per user lets a session
    # page out instead of being killed — which is the point, since tmpfs pages
    # from /tmp are charged to a pane and are otherwise unswappable — while
    # capping what one user can push at a disk that is seek-bound and shared
    # (bead code-oflt is still open). The 6G pane cap remains the containment.
    devvm_user_swap_max: "{{ [4, (ansible_memtotal_mb / 1024 * 0.13) | round | int] | min }}G"
    # When the playwright browser reaper decides a gpu-process has wedged.
    # 2 cores is roughly the working peak of a headless page render, and the
    # 2026-06-12 leak sat at 10.5; 10 samples is 10 minutes, against 6.5 hours
    # of it actually running. Both are deliberately far from the observed
    # numbers on either side, so a busy page is never mistaken for a leak.
    devvm_playwright_reaper_threshold_cores: 2
    devvm_playwright_reaper_window_minutes: 10
    # Swap sized from measurement, not from a RAM ratio: system.slice peaked at
    # 8.4 GiB over the 30 days to 2026-09-02 (p50 2.7, p99 7.0) and two users at
    # 4G each add 8, so 24 GiB total leaves ~7.6 GiB spare. The old 14 GiB never
    # went past 60% because the user slices could not reach it at all.
    #
    # TWO FILES, ADDITIVE, rather than one grown in place. A swapfile cannot be
    # extended — the header records its size and the kernel holds the extent map
    # — so growing means a new file, and retiring the old one means swapoff.
    # swapoff does NOT hand pages to another device: try_to_unuse() reads every
    # page back into RAM. Measured 2026-09-02 that would be 5.2 GiB arriving into
    # 7.4 GiB of available RAM beside 30 live Claude sessions, for a cosmetic
    # gain. Same call, same reason, as the 2026-06-10 growth.
    # ONE file is the target. It is two right now because growing swap on a live
    # box has to be additive (see the swap tasks), and converging to one needs a
    # swapoff, which reads every page in that file back into RAM. Measured
    # 2026-09-02: /swapfile held 9 GiB against 8.2 GiB of MemAvailable, so the
    # merge cannot be done while the box is carrying pages.
    #
    # So it converges instead of being done: the tasks below act on a swap area
    # only when that area holds ZERO pages, which is true right after a boot and
    # false the rest of the time. The first apply after any reboot resizes
    # /swapfile to the target and retires /swapfile2, and every apply before that
    # is a no-op. Same approach, same reason, as the 2026-06-12 merge, which was
    # also done post-boot at 0B used.
    devvm_swap_target: { path: /swapfile, size_gb: 24 }
    # The one account this playbook owns. Everyone else comes from the roster.
    devvm_admin_user: wizard
    devvm_admin_ssh_key: ""
    # Users whose mattpocock skill set the nightly timer keeps current. A user
    # whose ~/.claude/skills is a symlink into someone else's home (breakglass
    # points at wizard's) is updated with that user and must not be listed here.
    devvm_skills_users:
      - wizard
      - emo
    # Pinned on purpose: this npm package runs unattended as each user, so the
    # version is a reviewed choice. Bump it when you mean to.
    devvm_skills_cli: skills@1.5.23

  tasks:
    # ---- 1) the apt toolset -------------------------------------------------
    # packages.txt stays the single source of truth. Reading it here rather than
    # restating the list is what stops the two drifting apart.
    - name: Read the declared package manifest
      ansible.builtin.set_fact:
        devvm_packages: >-
          {{ lookup('file', workstation_dir ~ '/packages.txt').splitlines()
             | map('regex_replace', '\s+#.*$', '')
             | map('trim')
             | reject('match', '^#')
             | reject('equalto', '')
             | list }}

    # Caddy was installed by hand at some point and left running: the stock
    # welcome page on :80, zero handled requests in 30 days, nothing depending
    # on it (apt-cache rdepends is empty). Its apt repo was undeclared machine
    # state, and its Cloudsmith signing key EXPIRED — which failed
    # `apt-get update` and therefore ABORTED the task below, so nothing on this
    # box could be apt-installed at all (found 2026-09-01 while installing the
    # Playwright WebKit dependencies). An unused web server with no update path
    # is worse than either fixing or removing it, so it goes.
    #
    # Runs BEFORE the install task on purpose: while the repo is present with an
    # expired key, `update_cache: true` fails and the install never happens.
    - name: Remove the hand-installed caddy and its apt repo
      block:
        - name: Stop and disable caddy
          ansible.builtin.systemd_service:
            name: caddy
            state: stopped
            enabled: false
          failed_when: false

        - name: Remove the caddy package
          ansible.builtin.apt:
            name: caddy
            state: absent
            purge: true
            update_cache: false

        - name: Remove the caddy apt source and its expired keyring
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - /etc/apt/sources.list.d/caddy-stable.list
            - /usr/share/keyrings/caddy-stable-archive-keyring.gpg
          register: caddy_repo_removed

    - name: Install the declared apt packages
      ansible.builtin.apt:
        name: "{{ devvm_packages }}"
        state: present
        update_cache: true
        cache_valid_time: 3600

    # ---- 2) node ------------------------------------------------------------
    # Needed for the t3 CLI. Deliberately NOT for claude-code: that is the
    # per-user native install under ~/.local/bin, and a system-wide npm copy
    # would shadow the per-user ones everyone auto-migrates to.
    - name: Check the installed node major version
      ansible.builtin.command: node --version
      register: node_version
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Install NodeSource {{ node_major }}.x
      # A version comparison rather than a capture-group regex: the escaping
      # differs between a plain and a quoted YAML scalar, and getting it wrong
      # here silently re-runs the NodeSource installer on a machine that is fine.
      when: >-
        node_version.rc != 0 or
        (node_version.stdout | trim | regex_replace('^v', '')) is version('18.0.0', '<')
      block:
        - name: Fetch the NodeSource setup script
          ansible.builtin.get_url:
            url: "https://deb.nodesource.com/setup_{{ node_major }}.x"
            dest: /tmp/nodesource-setup.sh
            mode: "0755"
        - name: Run it
          ansible.builtin.command: /tmp/nodesource-setup.sh
          changed_when: true
        - name: Install nodejs
          ansible.builtin.apt:
            name: nodejs
            state: present
            update_cache: true

    # ---- 2a) ~/.local/bin on PATH for every login shell ---------------------
    - name: Put ~/.local/bin on PATH for login shells
      ansible.builtin.copy:
        dest: /etc/profile.d/10-local-bin.sh
        mode: "0644"
        content: |
          # Native per-user installs (e.g. claude-code) live in ~/.local/bin — put it on PATH.
          # Guarded so it never duplicates. Sourced by login shells (bash via /etc/profile; zsh
          # login via /etc/zsh/zprofile -> /etc/profile).
          case ":$PATH:" in
            *":$HOME/.local/bin:"*) ;;
            *) export PATH="$HOME/.local/bin:$PATH" ;;
          esac

    # ---- 3) tooling ---------------------------------------------------------
    # kubelogin is the kubectl oidc-login plugin, NOT the apt package of the
    # same name, which is an Azure tool.
    - name: Look for the tooling already installed
      ansible.builtin.stat:
        path: "/usr/local/bin/{{ item }}"
      loop: [kubelogin, sops, terragrunt]
      register: tooling_stat
      check_mode: false

    - name: Note which tools are missing
      ansible.builtin.set_fact:
        missing_tools: "{{ tooling_stat.results | rejectattr('stat.exists') | map(attribute='item') | list }}"

    # kubelogin is the kubectl oidc-login plugin, NOT the apt package of the same
    # name, which is an Azure tool.
    - name: Install kubelogin
      when: "'kubelogin' in missing_tools"
      block:
        - name: Download kubelogin
          ansible.builtin.get_url:
            url: "{{ kubelogin_url }}"
            dest: /tmp/kubelogin.zip
            mode: "0644"
        - name: Unpack it
          ansible.builtin.unarchive:
            src: /tmp/kubelogin.zip
            dest: /usr/local/bin
            remote_src: true
            include: [kubelogin]
            mode: "0755"

    - name: Link kubelogin as the kubectl plugin
      ansible.builtin.file:
        src: /usr/local/bin/kubelogin
        dest: /usr/local/bin/kubectl-oidc_login
        state: link

    # sops names its asset after the release tag, so "latest/download" alone
    # cannot address it -- the tag has to be resolved first.
    - name: Resolve the latest sops release
      when: "'sops' in missing_tools"
      ansible.builtin.uri:
        url: https://api.github.com/repos/getsops/sops/releases/latest
        return_content: true
      register: sops_release
      check_mode: false

    - name: Install sops
      when: "'sops' in missing_tools"
      ansible.builtin.get_url:
        url: "https://github.com/getsops/sops/releases/download/{{ sops_release.json.tag_name }}/sops-{{ sops_release.json.tag_name }}.linux.amd64"
        dest: /usr/local/bin/sops
        mode: "0755"

    - name: Install terragrunt
      when: "'terragrunt' in missing_tools"
      ansible.builtin.get_url:
        url: "{{ terragrunt_url }}"
        dest: /usr/local/bin/terragrunt
        mode: "0755"

    # Ansible's copy and template do NOT create parent directories, and every one
    # of these already existed on the live box -- so a check run there could never
    # have caught this. A blank machine has none of them.
    - name: Create the directories the configs land in
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /etc/claude-code
        - /etc/apt/keyrings
        - /etc/apt/sources.list.d
        - /etc/systemd/system/user-.slice.d
        - /etc/systemd/system/system.slice.d
        - /etc/systemd/user/scope.d
        - /usr/local/sbin
        # The playwright-mcp slice has no unit file of its own -- it exists
        # only because playwright-mcp@.service names it with Slice=. systemd
        # still reads drop-ins for an implicit slice, which is how the CPU
        # cap below reaches it without this repo owning the slice itself.
        - '/etc/systemd/system/system-playwright\x2dmcp.slice.d'

    # ---- 4) the enforced machine-wide Claude config -------------------------
    # Top of the settings precedence chain, and carries no secrets.
    - name: Deploy the managed Claude config
      ansible.builtin.copy:
        src: "{{ workstation_dir }}/managed-settings.json"
        dest: /etc/claude-code/managed-settings.json
        mode: "0644"
        owner: root
        group: root

    # ---- 5) /etc/skel for new accounts --------------------------------------
    - name: Seed /etc/skel
      ansible.builtin.copy:
        src: "{{ workstation_dir }}/skel/"
        dest: /etc/skel/
        mode: preserve

    # ---- 5b) the admin account ---------------------------------------------
    # ttyd.service runs as this user, so a machine without it cannot serve the
    # lobby at all -- found by installing the package on a blank VM, where ttyd
    # was the one service that would not start.
    #
    # This is the ONLY account this playbook creates. Everyone else comes from
    # the roster (infra#88). Strictly additive: groups are appended, an existing
    # account is never re-shelled, re-homed or re-permissioned, so this is a
    # no-op against the live box.
    - name: Create the shared code group
      ansible.builtin.group:
        name: code-shared
        state: present

    - name: Create the admin account
      ansible.builtin.user:
        name: "{{ devvm_admin_user }}"
        groups: [sudo, docker, code-shared]
        append: true
        shell: /bin/zsh
        create_home: true
        state: present

    - name: Authorise the admin's key
      ansible.posix.authorized_key:
        user: "{{ devvm_admin_user }}"
        key: "{{ devvm_admin_ssh_key }}"
        state: present
      when: devvm_admin_ssh_key | length > 0

    # ---- 6) the apt source that delivers terminal-lobby ---------------------
    # The package is built off-infra and published to Forgejo's Debian registry.
    # Its credential is NOT here: this repo is publicly mirrored, and root on
    # this box has no unattended Vault access, so the deploy pipeline installs
    # /etc/apt/auth.conf.d/terminal-lobby.conf on every deploy.
    # check_mode: false because get_url probes with HEAD during a dry run and
    # Forgejo answers 405 there, which would fail every --check run. Fetching a
    # public signing key is harmless, and doing it for real keeps dry runs honest.
    - name: Fetch the Forgejo repository signing key
      ansible.builtin.get_url:
        url: https://forgejo.viktorbarzin.me/api/packages/viktor/debian/repository.key
        dest: /etc/apt/keyrings/forgejo-viktor.asc
        mode: "0644"
      check_mode: false

    - name: Add the terminal-lobby apt source
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/terminal-lobby.list
        mode: "0644"
        content: |
          deb [signed-by=/etc/apt/keyrings/forgejo-viktor.asc] https://forgejo.viktorbarzin.me/api/packages/viktor/debian noble main

    # ---- 7) units that existed only on the box ------------------------------
    # Adopted 2026-08-29: these were in /etc/systemd/system and /usr/local/bin
    # and in no repository, so nothing could rebuild them.
    - name: Install the adopted helper scripts
      ansible.builtin.copy:
        src: "files/devvm/{{ item.src }}"
        dest: "{{ item.dest }}"
        mode: "0755"
        owner: root
        group: root
      loop:
        - { src: codex-auth-backup.sh, dest: /usr/local/bin/codex-auth-backup.sh }
        - { src: docker-disk-gc, dest: /usr/local/bin/docker-disk-gc }
        - { src: networkd-dhcp-watchdog.sh, dest: /usr/local/sbin/networkd-dhcp-watchdog.sh }

    - name: Install the adopted units
      ansible.builtin.copy:
        src: "files/devvm/{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
        mode: "0644"
        owner: root
        group: root
      loop:
        - codex-auth-backup.service
        - codex-auth-backup.timer
        - codex-auth-backup.path
        - docker-disk-gc.service
        - docker-disk-gc.timer
        - networkd-dhcp-watchdog.service
        - networkd-dhcp-watchdog.timer
      notify: reload systemd

    - name: Enable the adopted timers and paths
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
        state: started
        daemon_reload: true
      loop:
        - codex-auth-backup.timer
        - codex-auth-backup.path
        - docker-disk-gc.timer
        - networkd-dhcp-watchdog.timer

    # ---- 7b) nightly refresh of the mattpocock skill set --------------------
    # Added 2026-08-30. The skills are a working dependency of how sessions run
    # here, and upstream ships behaviour changes most weeks, so they drifted two
    # minor versions behind before anyone noticed. The script carries the detail
    # of why a bare `npx skills update` in cron is not enough; the short version
    # is that it overwrites our local edits, resurrects deleted skills from the
    # lockfile, and cannot follow a rename on its own.
    - name: Install the skills updater
      ansible.builtin.copy:
        src: files/devvm/claude-skills-update
        dest: /usr/local/bin/claude-skills-update
        mode: "0755"
        owner: root
        group: root

    - name: Configure the skills updater
      ansible.builtin.copy:
        dest: /etc/default/claude-skills-update
        mode: "0644"
        owner: root
        group: root
        content: |
          # Managed by playbooks/devvm.yml — edit there, not here.
          CLAUDE_SKILLS_USERS="{{ devvm_skills_users | join(' ') }}"
          SKILLS_CLI="{{ devvm_skills_cli }}"
      notify: reload systemd

    # Per-user policy: which promoted skills to hold back, and the local edits
    # to put back on top after each update. Without these a rebuilt machine
    # loses both, silently.
    - name: Ship the per-user skill policy
      ansible.builtin.copy:
        src: files/devvm/claude-skills/
        dest: /usr/local/share/claude-skills/
        mode: "0644"
        directory_mode: "0755"
        owner: root
        group: root

    # copy never deletes, so retiring a patch or an exclude in the repo would
    # otherwise leave it applying on the box forever. This directory is entirely
    # repo-owned, so anything on disk the repo does not carry is stale. Both
    # sides are enumerated with find and compared on the path relative to their
    # own root; a fileglob lookup silently returns nothing here, which makes the
    # difference "delete everything".
    - name: List the skill-policy files the repo carries
      ansible.builtin.find:
        paths: "{{ playbook_dir }}/files/devvm/claude-skills"
        recurse: true
        file_type: file
      register: devvm_skill_policy_repo
      delegate_to: localhost
      become: false
      check_mode: false

    - name: List the skill-policy files on the box
      ansible.builtin.find:
        paths: /usr/local/share/claude-skills
        recurse: true
        file_type: file
      register: devvm_skill_policy_live
      check_mode: false

    - name: Remove skill-policy files the repo no longer carries
      ansible.builtin.file:
        path: "/usr/local/share/claude-skills/{{ item }}"
        state: absent
      loop: >-
        {{ (devvm_skill_policy_live.files | map(attribute='path')
            | map('relpath', '/usr/local/share/claude-skills') | list)
           | difference(devvm_skill_policy_repo.files | map(attribute='path')
             | map('relpath', playbook_dir + '/files/devvm/claude-skills') | list) }}

    - name: Install the skills updater units
      ansible.builtin.copy:
        src: "files/devvm/{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
        mode: "0644"
        owner: root
        group: root
      loop:
        - claude-skills-update.service
        - claude-skills-update.timer
      notify: reload systemd

    - name: Enable the skills updater timer
      ansible.builtin.systemd_service:
        name: claude-skills-update.timer
        enabled: true
        state: started
        daemon_reload: true

    # ---- 7b) swap ------------------------------------------------------------
    # Swap was hand-managed until 2026-09-02: nothing in this repo declared the
    # file or the fstab line, so a rebuilt box came up swapless and the size
    # lived only in one machine and one person's notes.
    #
    # Every task here is guarded on a swap area holding NOTHING, because the one
    # operation this needs — swapoff — does not hand pages to another device.
    # try_to_unuse() reads every page back into RAM, so acting on a carrying file
    # risks the OOM this whole thread is about.
    - name: List swap areas that hold no pages
      ansible.builtin.shell:
        cmd: "swapon --show=NAME,USED --bytes --noheadings | awk '$2 == 0 {print $1}'"
      register: devvm_swap_empty
      changed_when: false
      check_mode: false

    - name: List every active swap area
      ansible.builtin.command:
        cmd: swapon --noheadings --show=NAME
      register: devvm_swap_active
      changed_when: false
      check_mode: false

    - name: Check the target swap file
      ansible.builtin.stat:
        path: "{{ devvm_swap_target.path }}"
      register: devvm_swap_target_stat

    # One task, not four: a swap file is usable only once allocated AND
    # permissioned AND formatted, and a half-made one that survived a failure
    # between steps would be picked up by fstab at the next boot. `creates` makes
    # it idempotent and lets --check skip cleanly.
    #
    # fallocate, never dd: instant on ext4 and writes no data, so it costs
    # nothing on a spindle that is already this box's bottleneck.
    #
    # set -eu, not -euo pipefail: ansible.builtin.shell runs /bin/sh, which is
    # dash on Ubuntu and has no pipefail — dash exits 2 on the `set` line before
    # reaching fallocate. No changed_when override either: an unconditional one
    # reports a change even when `creates` skipped the task, which in --check made
    # this look as though it would re-run mkswap over the LIVE swapfile.
    - name: Create the target swap file if it is missing
      ansible.builtin.shell:
        cmd: |
          set -eu
          fallocate -l {{ devvm_swap_target.size_gb }}G {{ devvm_swap_target.path }}
          chown root:root {{ devvm_swap_target.path }}
          chmod 0600 {{ devvm_swap_target.path }}
          mkswap {{ devvm_swap_target.path }}
        creates: "{{ devvm_swap_target.path }}"

    # Resize to the target, but only while it is carrying nothing. Ordered BEFORE
    # the retire below so the other area is still providing cover during the
    # swapoff, which means there is never a swapless moment.
    - name: Resize the target swap file to the declared size
      when:
        - devvm_swap_target_stat.stat.exists
        - (devvm_swap_target_stat.stat.size | int) != (devvm_swap_target.size_gb | int * 1024 * 1024 * 1024)
        - devvm_swap_target.path in devvm_swap_empty.stdout_lines
      ansible.builtin.shell:
        cmd: |
          set -eu
          swapoff {{ devvm_swap_target.path }}
          fallocate -l {{ devvm_swap_target.size_gb }}G {{ devvm_swap_target.path }}
          chmod 0600 {{ devvm_swap_target.path }}
          mkswap {{ devvm_swap_target.path }}
          swapon {{ devvm_swap_target.path }}
      changed_when: true

    - name: Declare the target in fstab
      ansible.posix.mount:
        src: "{{ devvm_swap_target.path }}"
        path: none
        fstype: swap
        opts: sw
        state: present

    - name: Activate the target if it is not carrying yet
      when: devvm_swap_target.path not in devvm_swap_active.stdout
      ansible.builtin.command:
        cmd: "swapon {{ devvm_swap_target.path }}"
      changed_when: true

    # Re-read the target's size: the resize above may have just changed it.
    - name: Re-check the target swap file
      ansible.builtin.stat:
        path: "{{ devvm_swap_target.path }}"
      register: devvm_swap_target_now

    # Retire superseded areas, only when they hold nothing AND the target has
    # already reached its declared size. That second guard is load-bearing: with
    # /swapfile still 14G and /swapfile2 empty, retiring on emptiness alone would
    # drop total swap from 24G to 14G while the user slices hold 8G of ceiling
    # between them — shrinking capacity in the name of tidiness. The path guard
    # keeps this from ever acting on a device rather than a file we made.
    - name: Retire superseded swap areas
      when:
        - item != devvm_swap_target.path
        - item is match('^/[^/]')
        - (devvm_swap_target_now.stat.size | int) == (devvm_swap_target.size_gb | int * 1024 * 1024 * 1024)
      loop: "{{ devvm_swap_empty.stdout_lines }}"
      ansible.builtin.shell:
        cmd: |
          set -eu
          swapoff {{ item }}
          rm -f {{ item }}
      changed_when: true

    - name: Drop superseded areas from fstab
      when:
        - item != devvm_swap_target.path
        - item is match('^/[^/]')
        - (devvm_swap_target_now.stat.size | int) == (devvm_swap_target.size_gb | int * 1024 * 1024 * 1024)
      loop: "{{ devvm_swap_empty.stdout_lines }}"
      ansible.posix.mount:
        src: "{{ item }}"
        path: none
        fstype: swap
        state: absent_from_fstab

    # ---- 8) resource containment (setup-devvm.sh section 10) ---------------
    # Added after 2026-06-22, when one user's runaway swap-thrashed the throttled
    # virtual disk into an IO storm and the box had to be hard-killed. The files
    # carry their own reasoning and are copied verbatim; only the caps are
    # parameterised, so a smaller machine does not get a cap larger than its RAM.
    #
    # Cap-and-kill, never throttle-and-pray: MemoryMax with MemorySwapMax=0 and
    # no MemoryHigh band, because with swap off a cgroup plateauing in a
    # high..max band is unreclaimable and livelocks instead of dying.
    - name: Cap every user slice
      ansible.builtin.template:
        src: files/devvm/50-devvm-resource.conf.j2
        dest: /etc/systemd/system/user-.slice.d/50-devvm-resource.conf
        mode: "0644"
      notify: reload systemd

    # tmux 3.4 puts every pane in its own transient scope, so one drop-in on the
    # scope UNIT TYPE caps each pane for every user with no per-session wiring.
    # This is the guard that should normally fire: the kernel then picks the
    # victim from inside the pane by raw RSS, so a spawned build dies and the
    # small claude that spawned it does not.
    - name: Cap every tmux pane
      ansible.builtin.template:
        src: files/devvm/50-devvm-pane-cap.conf.j2
        dest: /etc/systemd/user/scope.d/50-devvm-pane-cap.conf
        mode: "0644"
      notify: reload systemd

    - name: Give system.slice a priority edge
      ansible.builtin.copy:
        src: files/devvm/50-devvm-priority.conf
        dest: /etc/systemd/system/system.slice.d/50-devvm-priority.conf
        mode: "0644"
      notify: reload systemd

    # earlyoom, not systemd-oomd: oomd only acts on cgroups doing active
    # reclaim, and a no-swap anon workload never reclaims, so it is inert here.
    - name: Configure the earlyoom backstop
      ansible.builtin.copy:
        src: files/devvm/earlyoom.default
        dest: /etc/default/earlyoom
        mode: "0644"
      notify: restart earlyoom

    - name: Enable earlyoom
      ansible.builtin.systemd_service:
        name: earlyoom
        enabled: true
        state: started

    # ---- 8a) the shared playwright-mcp browsers ------------------------------
    # Adopted 2026-09-03 for bead code-r725. On 2026-06-12 a headless Chrome
    # from the playwright-shared MCP wedged its swiftshader-webgl gpu-process
    # at about 10.5 cores for 6.5 hours on a blank page, dominating this box
    # and the Proxmox host and starving etcd. The MCP's own browser_close did
    # not clear it, because page.close never reaches a spinning GPU process.
    #
    # Two halves. The quota bounds the damage the moment it starts; the reaper
    # clears it a few minutes later so nobody has to notice. Each file carries
    # its own reasoning, including how the reaper is kept away from a browser
    # a person started themselves.
    #
    # Note for a rebuild: playwright-mcp@.service and its snapshot-refresh
    # timer are NOT declared by this playbook. They were hand-installed in
    # /etc/systemd/system on 2026-06-20 and no repository holds them, so a
    # fresh machine gets this cap and this reaper with nothing to act on.
    - name: Cap the playwright-mcp browser slice
      ansible.builtin.copy:
        src: files/devvm/50-devvm-playwright-cpu.conf
        dest: '/etc/systemd/system/system-playwright\x2dmcp.slice.d/50-devvm-playwright-cpu.conf'
        mode: "0644"
        owner: root
        group: root
      notify: reload systemd

    - name: Install the playwright browser reaper
      ansible.builtin.copy:
        src: files/devvm/playwright-reaper
        dest: /usr/local/bin/playwright-reaper
        mode: "0755"
        owner: root
        group: root

    - name: Configure the playwright browser reaper
      ansible.builtin.copy:
        dest: /etc/default/playwright-reaper
        mode: "0644"
        owner: root
        group: root
        content: |
          # Managed by playbooks/devvm.yml -- edit there, not here.
          # Cores a gpu-process has to hold before a sample counts against it,
          # and how many consecutive one-minute samples it takes to be killed.
          PLAYWRIGHT_REAPER_THRESHOLD_CORES={{ devvm_playwright_reaper_threshold_cores }}
          PLAYWRIGHT_REAPER_WINDOW_MINUTES={{ devvm_playwright_reaper_window_minutes }}
          PLAYWRIGHT_REAPER_DRY_RUN=0
      notify: reload systemd

    - name: Install the playwright reaper units
      ansible.builtin.copy:
        src: "files/devvm/{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
        mode: "0644"
        owner: root
        group: root
      loop:
        - playwright-reaper.service
        - playwright-reaper.timer
      notify: reload systemd

    # Skipped under --check: the unit file has not been written yet on a box
    # that has never had this applied, and systemd cannot be asked about a
    # unit that does not exist. Without the guard the documented check-first
    # workflow fails on a fresh machine rather than reporting the change.
    - name: Enable the playwright reaper timer
      ansible.builtin.systemd_service:
        name: playwright-reaper.timer
        enabled: true
        state: started
        daemon_reload: true
      when: not ansible_check_mode

    # ---- 8a-bis) the log shipper ---------------------------------------------
    # scripts/devvm-promtail.yaml has described itself as the source of truth
    # since it was written, but nothing applied it: /etc/promtail/config.yml was
    # hand-deployed and dated 2026-07-09. The two were byte-identical when checked
    # on 2026-09-01, so this task takes ownership without changing behaviour --
    # and a committed change to the shipper now reaches the box instead of waiting
    # for someone to remember.
    #
    # The identifier allowlist in that file is what gives Loki rules a label to
    # select on. A rule keyed to an identifier missing from the allowlist matches
    # nothing and reports no error, so the two files have to move together.
    - name: Deploy the promtail config
      ansible.builtin.copy:
        src: ../scripts/devvm-promtail.yaml
        dest: /etc/promtail/config.yml
        owner: root
        group: root
        mode: "0644"
      notify: restart promtail

    - name: Enable promtail
      ansible.builtin.systemd_service:
        name: promtail
        enabled: true
        state: started

    # ---- 8b) node_exporter textfile collector -------------------------------
    # tl-session-watch (terminal-lobby package) writes per-session pane memory
    # here every 30s, which is what gives us a history to move the 3G pane
    # threshold on evidence rather than a guess. The collector is off by default
    # (ARGS=""), and turning it on needs no new scrape target: the `devvm`
    # Prometheus job already scrapes 10.0.10.10:9100 and applies no metric
    # keep-list, so tl_pane_* is ingested as soon as it appears.
    #
    # Design: docs/plans/2026-09-01-devvm-session-loss-alerting.md
    - name: Create the node_exporter textfile directory
      ansible.builtin.file:
        path: /var/lib/node_exporter/textfile
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Point node_exporter at the textfile directory
      ansible.builtin.copy:
        dest: /etc/default/prometheus-node-exporter
        mode: "0644"
        content: |
          # Managed by playbooks/devvm.yml -- edit there, not here.
          #
          # The textfile collector is what carries tl_pane_memory_bytes,
          # tl_pane_memory_max_bytes and tl_pane_top_is_claude from
          # tl-session-watch into Prometheus. Those are history for tuning the
          # pane threshold; the alerts themselves come from the journal, because
          # a 2-minute scrape cannot see a pane cross its cap and die inside one
          # interval.
          ARGS="--collector.textfile.directory=/var/lib/node_exporter/textfile"
      notify: restart node-exporter

    - name: Enable node_exporter
      ansible.builtin.systemd_service:
        name: prometheus-node-exporter
        enabled: true
        state: started

    # ---- 9) docker containment ----------------------------------------------
    - name: Create the capped docker slice
      ansible.builtin.template:
        src: files/devvm/docker.slice.j2
        dest: /etc/systemd/system/docker.slice
        mode: "0644"
      notify: reload systemd

    # A merge, not a rewrite: daemon.json also carries buildkit and the nvidia
    # runtime, and clobbering those would be a worse outage than no cap.
    - name: Read the current docker daemon config
      ansible.builtin.slurp:
        src: /etc/docker/daemon.json
      register: docker_daemon_raw
      failed_when: false
      check_mode: false

    - name: Parse the current docker daemon config
      ansible.builtin.set_fact:
        docker_daemon: >-
          {{ (docker_daemon_raw.content | b64decode | from_json)
             if (docker_daemon_raw.content is defined) else {} }}

    # Guarded on the VALUE, not on the rendering. Writing the merged JSON
    # unconditionally reformats a file that is already correct, and the handler
    # would then restart dockerd -- interrupting every running container -- for a
    # whitespace difference.
    - name: Point dockerd at the capped slice
      when: docker_daemon.get('cgroup-parent') != 'docker.slice'
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        mode: "0644"
        content: "{{ docker_daemon | combine({'cgroup-parent': 'docker.slice'}) | to_nice_json }}\n"
      notify: restart docker

  handlers:
    - name: reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: restart earlyoom
      ansible.builtin.systemd_service:
        name: earlyoom
        state: restarted

    - name: restart node-exporter
      ansible.builtin.systemd_service:
        name: prometheus-node-exporter
        state: restarted

    - name: restart promtail
      ansible.builtin.systemd_service:
        name: promtail
        state: restarted

    # Restarting dockerd interrupts running containers, so it is a handler that
    # only fires when daemon.json actually changed.
    - name: restart docker
      ansible.builtin.systemd_service:
        name: docker
        state: restarted
