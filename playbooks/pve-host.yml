---
# Proxmox host state that is not VM lifecycle.
#
# WHY THIS EXISTS. The per-VM disk I/O caps are the one piece of PVE host
# configuration that changes with any regularity, and until 2026-09-12 nothing
# deployed them. The script sat at /usr/local/bin/apply-mbps-caps.sh, placed by
# hand, with no reconciliation against the repository; the comment in
# stacks/infra/main.tf still pointed at an even earlier copy in /tmp that no
# longer exists. Landing a commit to scripts/apply-mbps-caps.sh therefore
# changed nothing on the box until somebody remembered to scp it.
#
# WHY NOT TERRAFORM. devvm (102), home-assistant (103), pfSense (101) and
# Windows10 (300) are deliberately outside Terraform, decided 2026-05-26 after
# the telmate/proxmox provider rewrote entire disk lists and corrupted the
# config of k8s-node2 and node3 twice. That decision stands. This playbook
# manages the capping mechanism, not the VMs. (The bpg/proxmox stacks
# stacks/opnsense and stacks/devvm create VMs of their own; the devvm-tf tasks
# below declare the scoped token stacks/devvm uses.)
#
#   ansible-playbook -i playbooks/inventory.ini playbooks/pve-host.yml --check --diff
#   ansible-playbook -i playbooks/inventory.ini playbooks/pve-host.yml
#
# A --check run against the live host should be a no-op. Anything else is drift.
- name: Proxmox host configuration
  hosts: pve
  gather_facts: true

  tasks:
    # ---- per-VM disk I/O caps ------------------------------------------------
    # The values and the reasoning for each one live in the script itself, which
    # is the file to read before changing a number. Briefly: sdc is a 7200rpm
    # RAID1 pair shared by every VM, the CSI fleet and etcd's write-ahead log,
    # and it is oversubscribed on random IOPS rather than on bandwidth. The caps
    # keep one VM's reads out of the queue etcd's fsync waits in.
    - name: Install the I/O cap script
      ansible.builtin.copy:
        src: ../scripts/apply-mbps-caps.sh
        dest: /usr/local/bin/apply-mbps-caps.sh
        mode: "0755"
        owner: root
        group: root

    - name: Install the I/O cap units
      ansible.builtin.copy:
        src: "../scripts/apply-mbps-caps.{{ item }}"
        dest: "/etc/systemd/system/apply-mbps-caps.{{ item }}"
        mode: "0644"
        owner: root
        group: root
      loop:
        - service
        - timer
      notify: reload systemd

    - name: Enable the I/O cap timer
      ansible.builtin.systemd_service:
        name: apply-mbps-caps.timer
        enabled: true
        state: started
        daemon_reload: true

    # ---- cgroup io accounting + no swap for etcd's VM ------------------------
    # Delegates the io controller into qemu.slice (accounting only) and sets
    # memory.swap.max=0 on k8s-master's scope so etcd's VM is never swapped
    # onto sdc. Reasoning in the script. Installed by hand until 2026-11-05.
    - name: Install the cgroup script
      ansible.builtin.copy:
        src: ../scripts/pve-cgroup-io.sh
        dest: /usr/local/bin/pve-cgroup-io.sh
        mode: "0755"
        owner: root
        group: root

    - name: Install the cgroup units
      ansible.builtin.copy:
        src: "../scripts/pve-cgroup-io.{{ item }}"
        dest: "/etc/systemd/system/pve-cgroup-io.{{ item }}"
        mode: "0644"
        owner: root
        group: root
      loop:
        - service
        - timer
      notify: reload systemd

    - name: Enable the cgroup timer
      ansible.builtin.systemd_service:
        name: pve-cgroup-io.timer
        enabled: true
        state: started
        daemon_reload: true

    # ---- swappiness ----------------------------------------------------------
    # The swap LV (pve/swap, 8 GiB) is on sdc, etcd's spindle. At the default
    # 60 it was full on 2026-11-04 with 1.2 GB of k8s-master swapped out; both
    # daytime etcd stalls on 2026-11-05 (~420 ms) carried 50-70 swap-in
    # reads/s, and on 2026-11-02 a page-cache surge swapped ~5 GiB onto sdc at
    # 807 writes/s (etcd 5.5 s). 10 makes the kernel drop page cache first.
    # Deliberately not swapoff: it would re-read 7.8 GB from sdc at once.
    - name: Prefer dropping page cache over swapping VM memory
      ansible.posix.sysctl:
        name: vm.swappiness
        value: "10"
        sysctl_file: /etc/sysctl.d/90-swappiness.conf
        reload: true

    # ---- journald in RAM -----------------------------------------------------
    # This host was the last one still writing its journal to disk, and that
    # disk is pve-root on sdc. Measured 2026-09-13: 258.9 GB over 57.6 days of
    # uptime = 4.5 GB/day, and 30 writes/s in a live 60-second sample, 15% of
    # the whole thin pool. The k8s nodes were moved to volatile on 2026-06-30
    # under code-oflt and node5's OS-disk writes fell about 94%. The reasoning
    # and the trade live in the file itself.
    - name: Make room for journald drop-ins
      ansible.builtin.file:
        path: /etc/systemd/journald.conf.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    # Anything reading this host's journal from disk has to be told where it
    # went. Promtail was not, and shipping to Loki stopped at the moment of
    # the switch on 2026-09-13, which cost the host its 30 days of searchable
    # history until it was noticed on 2026-09-15. Its path now says
    # /run/log/journal (scripts/pve-promtail.yaml).
    - name: Put the journal in RAM
      ansible.builtin.copy:
        src: files/pve/90-journald-volatile.conf
        dest: /etc/systemd/journald.conf.d/90-journald-volatile.conf
        mode: "0644"
        owner: root
        group: root
      notify: restart journald

    # Restart journald BEFORE deleting the directory, not after. Handlers run
    # at the end of the play, and journald keeps its journal files open, so a
    # delete that happens first frees no space until the restart closes the
    # descriptors. Flushing here makes the order explicit.
    - name: Switch journald over before reclaiming its files
      ansible.builtin.meta: flush_handlers

    # Storage=volatile makes journald use /run and stop writing
    # /var/log/journal, but it does not remove what is already there. Without
    # this the 3.9 GB measured on 2026-09-13 would sit on sdc forever, read by
    # nothing.
    - name: Reclaim the on-disk journal
      ansible.builtin.file:
        path: /var/log/journal
        state: absent

    # ---- xfs_scrub_all -------------------------------------------------------
    # xfsprogs enables a weekly xfs_scrub_all.timer, and on this host the run
    # can never finish. The script reads `lsblk -J` through a pipe and waits
    # for lsblk to exit before draining it (Popen then wait() in
    # /usr/sbin/xfs_scrub_all, xfsprogs 6.13.0-2+deb13u1). With the CSI disks
    # attached here lsblk writes about 239 KB, far past the 64 KiB pipe
    # buffer, so both processes block forever. The run started at the
    # 2026-07-18 boot was still stuck on 2026-09-24, and while it hangs
    # systemd reports the host as "starting" instead of "degraded", which
    # hides failed units. The host has no XFS filesystems, so there is nothing
    # to scrub. Masking both units stops the timer and keeps anything else
    # from starting the service.
    - name: Stop and mask xfs_scrub_all
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: stopped
        masked: true
      loop:
        - xfs_scrub_all.timer
        - xfs_scrub_all.service

    # ---- fan control ---------------------------------------------------------
    # The IPMI fan actuator applies the setpoint Home Assistant computes
    # (docs/runbooks/fan-control.md). Until 2026-09-24 it reached the host by
    # scp, so a commit changed nothing until someone copied it across.
    # /etc/fan-control.env holds the ha-sofia token and stays out of git and
    # out of this playbook; the unit reads it as an EnvironmentFile.
    - name: Install the fan actuator
      ansible.builtin.copy:
        src: ../scripts/fan-control.sh
        dest: /usr/local/bin/fan-control
        mode: "0755"
        owner: root
        group: root
      notify: restart fan-control

    - name: Install the fan actuator unit
      ansible.builtin.copy:
        src: ../scripts/fan-control.service
        dest: /etc/systemd/system/fan-control.service
        mode: "0644"
        owner: root
        group: root
      notify:
        - reload systemd
        - restart fan-control

    - name: Keep the fan actuator running
      ansible.builtin.systemd_service:
        name: fan-control
        enabled: true
        state: started

    # ---- log shipping --------------------------------------------------------
    # promtail ships this host's journal to Loki, and its config redacts
    # secret-shaped values first (the reasoning lives in the file). Validating
    # before the copy means a broken config never replaces a working one.
    - name: Configure the journal shipper
      ansible.builtin.copy:
        src: ../scripts/pve-promtail.yaml
        dest: /etc/promtail/config.yml
        mode: "0644"
        owner: root
        group: root
        validate: /usr/local/bin/promtail -check-syntax -config.file=%s
      notify: restart promtail

    # ---- LVM metadata archive ------------------------------------------------
    # LVM archives a volume group's metadata before every change, and the CSI
    # driver changes the pve group all day. At the default 30-day retention
    # /etc/lvm/archive held 9,810 files and 1.9 GB on 2026-09-24, about 63 MB a
    # day, all of it for pve. The archives only serve vgcfgrestore after a bad
    # metadata change, so a week is enough. LVM prunes the rest the next time
    # it archives, and retain_min (10) still keeps the newest copies of the
    # quiet groups. lvmlocal.conf overrides lvm.conf, so lvm.conf stays as the
    # package ships it.
    - name: Keep a week of LVM metadata archives
      ansible.builtin.blockinfile:
        path: /etc/lvm/lvmlocal.conf
        marker: "# {mark} pve-host.yml: metadata archive retention"
        block: |
          backup {
              retain_days = 7
          }

    # ---- NFS server: no delegations --------------------------------------------
    # nfsd grants delegations through kernel leases, so leases-enable=0 makes it
    # stop granting them; existing ones drain as clients return them. Why
    # (infra#159, 2026-10-31): nfsd does not recall a delegation when the
    # conflicting change comes from the same NFSv4 client, and every k8s node
    # is ONE client to us however many mounts it holds. A pod mounting a PVC
    # read-only and another mounting it read-write on the same node get two
    # superblocks, and a change made through the rw one never reaches the ro
    # one while it holds a delegation. Reproduced on k8s-node2: the tv (then
    # f1-stream) Edge (ro) held a directory delegation, a rw pod on the same
    # node created and deleted entries, and the Edge listed the old contents
    # for as long as the delegation lived; the same write from k8s-node5 was
    # visible in 1 s.
    # The 7.0 kernels added directory delegations (client and server), which
    # turned this from stale files (2026-10-12, file read delegations) into
    # stale directory listings. Clients fall back to attribute caching, which
    # is what the mount options (actimeo) already assume.
    - name: Stop nfsd granting delegations
      ansible.posix.sysctl:
        name: fs.leases-enable
        value: "0"
        sysctl_file: /etc/sysctl.d/90-nfsd-no-delegations.conf
        reload: true

    # ---- security updates ----------------------------------------------------
    # Nothing installed updates on this host until 2026-10-19, when 29 Debian
    # security updates were waiting. unattended-upgrades takes packages from
    # Debian-Security only. Proxmox packages (kernel, QEMU, pve-manager) and
    # Debian point releases stay manual, because those are the ones that need
    # a reboot or a VM stop/start to take effect. The host never reboots
    # itself, and needrestart is not installed, so nothing restarts services
    # behind our back either; running VMs are untouched. The 52 drop-in sorts
    # after the package's 50unattended-upgrades and #clear replaces its origin
    # list rather than appending to it. Kernel autoremoval is off as well: on
    # the first run, 2026-10-19, the package default removed the fallback
    # kernel proxmox-kernel-6.14.11-3-pve-signed, and which kernels stay
    # installed is a decision for whoever reboots the host.
    - name: Install unattended-upgrades
      ansible.builtin.apt:
        name: unattended-upgrades
        state: present
      tags: patching

    - name: Turn on the daily list refresh and upgrade run
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        mode: "0644"
        owner: root
        group: root
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
      tags: patching

    - name: Debian security updates only, no automatic reboot
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/52unattended-upgrades-security-only
        mode: "0644"
        owner: root
        group: root
        content: |
          // Managed by infra/playbooks/pve-host.yml.
          #clear Unattended-Upgrade::Origins-Pattern;
          Unattended-Upgrade::Origins-Pattern {
              "origin=Debian,codename=${distro_codename}-security,label=Debian-Security";
          };
          Unattended-Upgrade::Automatic-Reboot "false";
          Unattended-Upgrade::Remove-Unused-Kernel-Packages "false";
      tags: patching

    # ---- Proxmox updates: monthly, supervised, with an alert -----------------
    # Debian security updates install themselves (above). Proxmox packages do
    # not: Proxmox needs `apt full-upgrade` for them, and a bad one stops every
    # VM on our only hypervisor, so Viktor chose on 2026-10-21 to take them in a
    # monthly supervised run instead. Until then nothing reported them waiting;
    # on 2026-10-21 there were 11 (pve-manager, QEMU, a 7.0 kernel), and the host
    # had run 94 days on kernel 6.14.
    #
    # host-patch-status writes, hourly, how many Proxmox packages are waiting and
    # since when, and whether the running kernel is older than the newest one
    # installed. node_exporter reads it through the textfile collector, and
    # ProxmoxHostUpdatesWaiting / ProxmoxHostRebootWaiting fire after 30 days.
    # The upgrade itself is the `pve-upgrade` task at the end of this section,
    # which runs only when asked for by tag. Steps: docs/runbooks/proxmox-host.md.
    - name: Create the node_exporter textfile directory
      ansible.builtin.file:
        path: /var/lib/node_exporter/textfile
        state: directory
        mode: "0755"
        owner: root
        group: root
      tags: patching

    - name: Create the node_exporter drop-in directory
      ansible.builtin.file:
        path: /etc/systemd/system/node_exporter.service.d
        state: directory
        mode: "0755"
        owner: root
        group: root
      tags: patching

    - name: Point node_exporter at the textfile directory
      ansible.builtin.copy:
        dest: /etc/systemd/system/node_exporter.service.d/textfile.conf
        mode: "0644"
        owner: root
        group: root
        content: |
          # Managed by infra/playbooks/pve-host.yml.
          [Service]
          ExecStart=
          ExecStart=/usr/local/bin/node_exporter --collector.textfile.directory=/var/lib/node_exporter/textfile
      register: pve_node_exporter_dropin
      tags: patching

    - name: Restart node_exporter for the textfile collector
      ansible.builtin.systemd:
        name: node_exporter
        state: restarted
        daemon_reload: true
      when: pve_node_exporter_dropin is changed
      tags: patching

    - name: Install host-patch-status
      ansible.builtin.copy:
        src: files/pve/host-patch-status
        dest: /usr/local/bin/host-patch-status
        mode: "0755"
        owner: root
        group: root
      tags: patching

    - name: Install the host-patch-status unit and timer
      ansible.builtin.copy:
        src: "files/pve/{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
        mode: "0644"
        owner: root
        group: root
      loop:
        - host-patch-status.service
        - host-patch-status.timer
      register: pve_patch_status_units
      tags: patching

    - name: Enable the host-patch-status timer
      ansible.builtin.systemd:
        name: host-patch-status.timer
        enabled: true
        state: started
        daemon_reload: "{{ pve_patch_status_units is changed }}"
      # In --check the unit file was not written, so systemd cannot find it yet.
      when: not (ansible_check_mode and pve_patch_status_units is changed)
      tags: patching

    # Clears Proxmox CSI disk slots a timed-out detach left poisoned
    # (qemu-server skips drive_del when its 5s query-pci poll times out, and a
    # retried detach then reports success). See the script header and
    # docs/runbooks/proxmox-csi-wedged-attach.md. Writes its metrics to the
    # node_exporter textfile directory created above.
    - name: Install csi-leak-reconcile
      ansible.builtin.copy:
        src: files/pve/csi-leak-reconcile
        dest: /usr/local/bin/csi-leak-reconcile
        mode: "0755"
        owner: root
        group: root
      tags: csi-leak

    - name: Install the csi-leak-reconcile unit and timer
      ansible.builtin.copy:
        src: "files/pve/{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
        mode: "0644"
        owner: root
        group: root
      loop:
        - csi-leak-reconcile.service
        - csi-leak-reconcile.timer
      register: pve_csi_leak_units
      tags: csi-leak

    - name: Enable the csi-leak-reconcile timer
      ansible.builtin.systemd:
        name: csi-leak-reconcile.timer
        enabled: true
        state: started
        daemon_reload: "{{ pve_csi_leak_units is changed }}"
      when: not (ansible_check_mode and pve_csi_leak_units is changed)
      tags: csi-leak

    # ---- ha-london network backups ---------------------------------------------
    # Home Assistant in London writes its automatic backups through Supervisor
    # network storage to /srv/nfs/ha-london-backup, exported by
    # scripts/pve-nfs-exports (that line needs this directory to exist first).
    # nfs-mirror and offsite-sync then carry it to sda and the Synology like
    # any other /srv/nfs subtree. ha-london-backup-status reports the newest
    # archive's age hourly; HaLondonBackupStale pages on it.
    # docs/architecture/london-site.md, "Backups".
    - name: Create the ha-london backup directory
      ansible.builtin.file:
        path: /srv/nfs/ha-london-backup
        state: directory
        mode: "0755"
        owner: root
        group: root
      tags: ha-london-backup

    - name: Install ha-london-backup-status
      ansible.builtin.copy:
        src: files/pve/ha-london-backup-status
        dest: /usr/local/bin/ha-london-backup-status
        mode: "0755"
        owner: root
        group: root
      tags: ha-london-backup

    - name: Install the ha-london-backup-status unit and timer
      ansible.builtin.copy:
        src: "files/pve/{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
        mode: "0644"
        owner: root
        group: root
      loop:
        - ha-london-backup-status.service
        - ha-london-backup-status.timer
      register: pve_ha_london_backup_units
      tags: ha-london-backup

    - name: Enable the ha-london-backup-status timer
      ansible.builtin.systemd:
        name: ha-london-backup-status.timer
        enabled: true
        state: started
        daemon_reload: "{{ pve_ha_london_backup_units is changed }}"
      when: not (ansible_check_mode and pve_ha_london_backup_units is changed)
      tags: ha-london-backup

    # ---- drive SMART -----------------------------------------------------------
    # Nothing read the physical drives' own SMART data until 2026-11-09; the
    # iDRAC only reports a per-drive OK/not-OK verdict. disk-smart-status reads
    # every drive behind the PERC (smartctl -d megaraid,N, plus the Seagate FARM
    # log) hourly and writes it to the textfile directory created
    # above. The "R730 Drives" alert group in stacks/monitoring reads it. Read
    # only: no self-tests are scheduled, by Viktor's choice on 2026-11-09, since
    # the drives' background media scan and the PERC's patrol read already cover
    # the surface and sdc has no spare I/O for a 20-hour long test.
    - name: Install smartmontools
      ansible.builtin.apt:
        name: smartmontools
        state: present
      tags: smart

    - name: Install disk-smart-status
      ansible.builtin.copy:
        src: files/pve/disk-smart-status
        dest: /usr/local/bin/disk-smart-status
        mode: "0755"
        owner: root
        group: root
      tags: smart

    - name: Install the disk-smart-status unit and timer
      ansible.builtin.copy:
        src: "files/pve/{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
        mode: "0644"
        owner: root
        group: root
      loop:
        - disk-smart-status.service
        - disk-smart-status.timer
      register: pve_disk_smart_units
      tags: smart

    - name: Enable the disk-smart-status timer
      ansible.builtin.systemd:
        name: disk-smart-status.timer
        enabled: true
        state: started
        daemon_reload: "{{ pve_disk_smart_units is changed }}"
      when: not (ansible_check_mode and pve_disk_smart_units is changed)
      tags: smart

    # Runs only with `--tags pve-upgrade`. Installs everything a full-upgrade
    # would, Proxmox and Debian alike, and does not reboot: running VMs keep the
    # QEMU binary they started with, and a new kernel waits for the reboot,
    # which is scheduled with Viktor separately. host-patch-status runs straight
    # after, so the alert clears without waiting for the hourly timer.
    - name: Install every pending update (monthly, supervised, no reboot)
      ansible.builtin.apt:
        update_cache: true
        upgrade: full
      tags: [never, pve-upgrade]

    - name: Refresh host-patch-status after the upgrade
      ansible.builtin.systemd:
        name: host-patch-status.service
        state: started
      tags: [never, pve-upgrade]

    # ---- registry cache VM root disk -----------------------------------------
    # VM 220 (docker-registry) is outside Terraform like the VMs named at the top
    # of this file, so its disk size is declared here as a floor. The cache filled
    # its 64G disk four times between 2026-10-11 and 2026-10-20: one busy day of
    # rollouts refills about 25 GB inside a single 168h proxy TTL. Viktor chose
    # 150G on 2026-10-20, on the HDD thin pool where the disk already lives. The
    # task only grows the disk (qm resize cannot shrink, and the condition skips
    # it at or above the floor). registry-cache.yml, tag disk, then grows the
    # partition and filesystem inside the guest.
    - name: Read the registry VM's disk config
      ansible.builtin.command: qm config 220
      register: registry_vm_config
      changed_when: false
      check_mode: false
      tags: registry-disk

    - name: Grow the registry VM's root disk to 150G
      ansible.builtin.command: qm resize 220 scsi0 150G
      when: >-
        (registry_vm_config.stdout
         | regex_search('scsi0:.*size=([0-9]+)G', '\\1') | first | int) < 150
      tags: registry-disk

    # ---- cloud-init snippets for k8s-node4 and k8s-node5 ---------------------
    # VMs 204 and 205 were built from hand-made snippets that were never in
    # git. Their runcmd uninstalled unattended-upgrades and reset containerd,
    # and cloud-init re-ran it on node5 twice. The versions here keep only the
    # identity settings; the reasoning is in the files. Each copy keeps the
    # previous file next to it as a timestamped backup. The snippets the
    # template stack writes (k8s_cloud_init.yaml and the others) stay with
    # stacks/infra.
    - name: Install the k8s-node4 and k8s-node5 cloud-init snippets
      ansible.builtin.copy:
        src: "files/pve/snippets/{{ item }}"
        dest: "/var/lib/vz/snippets/{{ item }}"
        mode: "0644"
        owner: root
        group: root
        backup: true
      loop:
        - node4_bootstrap.yaml
        - k8s_node5_bootstrap.yaml
      tags: snippets

    # ---- stacks/devvm: the Terraform devvm definition ----------------------
    # The vendor snippet every Terraform-built devvm boots with
    # (modules/proxmox-devvm). It embeds scripts/devvm-bootstrap, so a change to
    # that script reaches new VMs only after this task runs. Runbook:
    # docs/runbooks/devvm-drill.md.
    - name: Install the devvm bootstrap cloud-init snippet
      ansible.builtin.template:
        src: files/pve/snippets/devvm_bootstrap.yaml.j2
        dest: /var/lib/vz/snippets/devvm_bootstrap.yaml
        mode: "0644"
        owner: root
        group: root
        backup: true
      tags: [snippets, devvm-tf]

    # What stacks/devvm's token may touch: VMs in the pool `devvm` and the
    # VMID slots 9100-9109, plus the storage, network and node rights to create
    # one. The slots are needed as well as the pool because PVE checks
    # /vms/<id> during create, before the new VM joins the pool (the first
    # drill failed with "403 Permission check failed (/vms/9102,
    # VM.Config.Options)"). The live devvm (102) is neither in the pool nor a
    # slot, so this token cannot reach it. The same scoping as
    # stacks/opnsense (ADR-0038); the token secret is Vault secret/devvm
    # pve_api_token, written by the token task below.
    - name: Read the PVE pools, roles and users
      ansible.builtin.command: "pvesh get {{ item }} --output-format json"
      loop: [/pools, /access/roles, /access/users]
      register: pve_access
      changed_when: false
      check_mode: false
      tags: devvm-tf

    - name: Create the devvm pool
      ansible.builtin.command: pveum pool add devvm --comment "VMs stacks/devvm owns (modules/proxmox-devvm). The live devvm 102 is deliberately not a member."
      when: "'devvm' not in (pve_access.results[0].stdout | from_json | map(attribute='poolid'))"
      tags: devvm-tf

    - name: Declare the TFDevvm role
      ansible.builtin.command: >-
        pveum role {{ 'modify' if 'TFDevvm' in (pve_access.results[1].stdout | from_json | map(attribute='roleid')) else 'add' }}
        TFDevvm --privs {{ pve_devvm_tf_privs | join(',') }}
      when: >-
        'TFDevvm' not in (pve_access.results[1].stdout | from_json | map(attribute='roleid'))
        or ((pve_access.results[1].stdout | from_json | selectattr('roleid', 'equalto', 'TFDevvm') | first).privs.split(',') | sort)
           != (pve_devvm_tf_privs | sort)
      vars:
        pve_devvm_tf_privs:
          - Datastore.AllocateSpace
          - Datastore.AllocateTemplate
          - Datastore.Audit
          - Pool.Audit
          - SDN.Use
          - Sys.AccessNetwork
          - Sys.Audit
          - VM.Allocate
          - VM.Audit
          - VM.Config.CDROM
          - VM.Config.CPU
          - VM.Config.Cloudinit
          - VM.Config.Disk
          - VM.Config.HWType
          - VM.Config.Memory
          - VM.Config.Network
          - VM.Config.Options
          - VM.Console
          - VM.GuestAgent.Audit
          - VM.GuestAgent.FileWrite
          - VM.PowerMgmt
      tags: devvm-tf

    - name: Create the terraform-devvm user
      ansible.builtin.command: pveum user add terraform-devvm@pve --comment "Terraform stacks/devvm (bpg/proxmox), pool devvm only."
      when: "'terraform-devvm@pve' not in (pve_access.results[2].stdout | from_json | map(attribute='userid'))"
      tags: devvm-tf

    - name: Read the terraform-devvm tokens
      ansible.builtin.command: pveum user token list terraform-devvm@pve --output-format json
      register: pve_devvm_tokens
      changed_when: false
      check_mode: false
      failed_when: false
      tags: devvm-tf

    # The secret is shown once, at creation, so it goes straight to Vault.
    # Rotate: `pveum user token remove terraform-devvm@pve tf`, then rerun.
    - name: Create the tf token and store it in Vault secret/devvm
      ansible.builtin.shell: |
        set -euo pipefail
        secret=$(pveum user token add terraform-devvm@pve tf --privsep 1 \
          --comment "stacks/devvm" --output-format json | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')
        printf '%s' "terraform-devvm@pve!tf=$secret"
      args:
        executable: /bin/bash
      register: pve_devvm_new_token
      when: "'tf' not in ((pve_devvm_tokens.stdout | default('[]', true) | from_json) | map(attribute='tokenid'))"
      no_log: true
      tags: devvm-tf

    - name: Write the new token to Vault
      ansible.builtin.shell: vault kv put secret/devvm pve_api_token=-
      args:
        stdin: "{{ pve_devvm_new_token.stdout }}"
        # Ansible appends a newline by default, and bpg rejects a token with one.
        stdin_add_newline: false
      delegate_to: localhost
      become: false
      when: pve_devvm_new_token is changed
      no_log: true
      tags: devvm-tf

    - name: Read the ACLs
      ansible.builtin.command: pvesh get /access/acl --output-format json
      register: pve_acl
      changed_when: false
      check_mode: false
      tags: devvm-tf

    - name: Grant TFDevvm where it is missing
      ansible.builtin.command: >-
        pveum acl modify {{ item.0 }} --roles TFDevvm
        {{ '--tokens' if '!' in item.1 else '--users' }} '{{ item.1 }}' --propagate 1
      loop: "{{ (['/pool/devvm', '/storage/local', '/storage/local-lvm', '/nodes/pve', '/sdn/zones/localnetwork']
                 + range(9100, 9110) | map('regex_replace', '^', '/vms/') | list)
                | product(['terraform-devvm@pve', 'terraform-devvm@pve!tf']) | list }}"
      when: >-
        (pve_acl.stdout | from_json
         | selectattr('path', 'equalto', item.0)
         | selectattr('ugid', 'equalto', item.1)
         | selectattr('roleid', 'equalto', 'TFDevvm') | list | length) == 0
      tags: devvm-tf

    # ---- storage content types --------------------------------------------
    # `local` also holds `import` content (raw/qcow2 disk images) since
    # 2026-11-03, so stacks/opnsense can upload the OPNsense nano image over
    # the API and attach it with import_from. The alternative, a compressed
    # image through file_id, needs the bpg provider to SSH in as a
    # root-equivalent user, which the stack's scoped token avoids (ADR-0038).
    - name: Read the content types of the local storage
      ansible.builtin.shell: >-
        awk '/^dir: local$/{f=1;next} f&&/^[[:space:]]+content /{print $2;exit} /^[^[:space:]]/{f=0}' /etc/pve/storage.cfg
      register: local_content
      changed_when: false
      check_mode: false
      tags: storage-content

    - name: local storage accepts vztmpl, backup, iso and import content
      ansible.builtin.command: pvesm set local --content vztmpl,backup,iso,import
      when: (local_content.stdout.split(',') | sort) != (['vztmpl', 'backup', 'iso', 'import'] | sort)
      tags: storage-content

  handlers:
    - name: restart journald
      ansible.builtin.systemd_service:
        name: systemd-journald
        state: restarted

    - name: reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: restart fan-control
      ansible.builtin.systemd_service:
        name: fan-control
        state: restarted

    - name: restart promtail
      ansible.builtin.systemd_service:
        name: promtail
        state: restarted

